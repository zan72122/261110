      case 'dipRelease': ctx.dip = boardPos(e.board); ctx.dipBoard = e.board || null; break;
      case 'rackStand': A.sfx('rackStand', { slot: e.slot }); break;
      case 'rackReady': A.sfx('ready'); sparks([L.STOP.hinge[0], L.STOP.hinge[1] + L.STOP.height + 1.5, L.STOP.hinge[2]], 8); break;
      case 'stopNudge': A.sfx('nudge'); break;
      case 'chainStart': saveMemory(); break;
      case 'fold': A.sfx('fold'); break;
      case 'domino': A.sfx('domino', { index: e.index }); break;
      case 'lever': A.sfx('lever'); break;
      case 'support': A.sfx('support', { bar: e.bar }); break;
      case 'barLand': A.sfx('barLand', { bar: e.bar }); break;
      case 'platterFormed': break;                                  // success{platter}
      case 'turntable': A.sfx('turntable', { dir: e.dir }); break;
      case 'serve': ctx.serve = L.platePos(clamp(e.plate | 0, 0, 4), 0); ctx.serveBar = 'B' + clamp(e.bar | 0, 0, 4); break;
      case 'platesAway': break;                                     // turntable{} carries the sound
      case 'return': A.sfx('return'); break;
      case 'barReturn': A.strike('B' + clamp(e.bar | 0, 0, 4), { vel: 0.3, damp: 0.3, when: 'now' }); break;
      case 'cycleStart': break;                                     // success{cycle}
      case 'success': A.success(e.kind); successFx(e.kind); break;
      case 'crumbs': if (e.pos) emitFx({ pos: e.pos, n: clamp(e.n | 0, 1, 24), kind: e.kind || 'crumb', color: e.color || 'butter' }); break;
      case 'bgTouch': A.sfx('bg'); if (e.pos) emitFx({ pos: [e.pos[0], e.pos[1] + 0.3, e.pos[2]], n: 3, kind: 'powder', color: 'ceramic' }); break;

    }
  }
  function processEvents() {
    let evs;
    try { evs = sim.drainEvents(); } catch (err) { noteError('drainEvents', err); return; }
    if (!evs || !evs.length) return;
    const wt = now();
    for (const e of evs) {
      e.wt = wt; e.seq = ++evSeq;

      try { handleEvent(e); } catch (err) { noteError('event ' + e.type, err); }
      if (D.onEvent) { try { D.onEvent(e); } catch (err) { /* test hook */ } }
    }
  }

  // ---------------------------------------------------------------- guidance: idle -> ONE hand demo (visual only)
  const overlay = { hand: { visible: false, x: 0, y: 0, press: 0, alpha: 0 } };
  function demoPath(target, dir) {
    const st = sim.state;
    if (target === 'S') {   // review F5: start ON the board and swipe inward; both ends clamped inside the screen
      const p = buildPoly('S', st), cl = (v) => clamp(v, 28, size.w - 28);
      return { a: [cl(p.c[0] - 6), p.c[1] + 4], b: [cl(p.c[0] - 76), p.c[1] + 4] };
    }
    const o = poseOf(target);
    if (!o) return null;
    let half, startZ, k;
    if (target[0] === 'B') { half = L.BAR_LEN[+target[1]] / 2; startZ = dir > 0 ? half * 0.35 : -half * 0.35; k = 0.42; }
    else { half = (L.RECV_Z[1] - L.RECV_Z[0]) / 2; startZ = dir > 0 ? 2.6 : -2.6; k = 0.9; }
    const f = proj2(xf(o.pos, o.q, 0, 0, half)), bk = proj2(xf(o.pos, o.q, 0, 0, -half));
    const a = proj2(xf(o.pos, o.q, 0, 0, startZ));

  }
  function startDemo() {
    const inv = sim.state.invite;
    if (!inv || !inv.target) return false;
    let path = null;
    try { path = demoPath(inv.target, inv.dir); } catch (e) { noteError('demoPath', e); }
    if (!path) return false;
    guide.demo = { target: inv.target, dir: inv.dir, t: 0, path };
    guide.eligible = false; guide.demos++; guide.lastKey = inv.target + ':' + inv.dir;

  }
  function cancelDemo(why) {
    if (!guide.demo) return;

    guide.demo = null;
    overlay.hand.visible = false;
  }
  // timeline: fade in 0.35 s, press 0.2 s, ONE rub 1.2 s (ease in/out), lift 0.2 s, fade out 0.45 s
  const T_IN = 0.35, T_PR = 0.2, T_RUB = 1.2, T_UP = 0.2, T_OUT = 0.45, T_ALL = T_IN + T_PR + T_RUB + T_UP + T_OUT;
  function updateGuide(dt) {
    const ph = sim.state.phase;
    if (active) guide.idle = 0; else guide.idle += dt;
    const g = guide.demo;
    if (g) {
      if (ph !== 'play' && ph !== 'serve') { cancelDemo('phase'); return; }
      g.t += dt;
      const t = g.t, h = overlay.hand;
      if (t >= T_ALL) { guide.demo = null; h.visible = false; return; }

      if (t < T_IN) { alpha = U.smooth(t / T_IN); }
      else if (t < T_IN + T_PR) { press = U.smooth((t - T_IN) / T_PR); }
      else if (t < T_IN + T_PR + T_RUB) { press = 1; u = U.easeInOut((t - T_IN - T_PR) / T_RUB); }
      else if (t < T_IN + T_PR + T_RUB + T_UP) { u = 1; press = 1 - U.smooth((t - T_IN - T_PR - T_RUB) / T_UP); }
      else { u = 1; alpha = 1 - U.smooth((t - T_ALL + T_OUT) / T_OUT); }
      h.visible = true; h.alpha = alpha * 0.92; h.press = press;
      h.x = U.lerp(g.path.a[0], g.path.b[0], u); h.y = U.lerp(g.path.a[1], g.path.b[1], u);

      return;
    }

    guide.quiet += dt;
    // review F12: a demo is re-armed by a touch on a board, or when the invite itself changed since the last demo
    const inv = sim.state.invite, key = inv && inv.target ? inv.target + ':' + inv.dir : '';
    if (!guide.eligible && key && key !== guide.lastKey && guide.demos > 0) guide.eligible = true;
    if (guide.enabled && guide.eligible && guide.idle >= IDLE_DEMO && (guide.quiet >= QUIET_DEMO || guide.idle >= IDLE_DEMO_MAX) && (ph === 'play' || ph === 'serve')) startDemo();
  }
  // the demo board's tiny sympathetic wiggle and the success pops: applied to the render input only, restored right
  // after rendering (saved values are put back in reverse order, so overlapping edits restore exactly)
  const saved = [];
  function setVis(o, key, v) { saved.push(o, key, o[key]); o[key] = v; }
  function applyWiggle(dt) {
    const st = sim.state;
    const g = guide.demo;
    if (g && g.press > 0.01) {
      const k = g.press * (0.8 + 0.2 * Math.sin(st.time * 21));
      if (g.target === 'S') setVis(st.stop, 'press', Math.min(1, st.stop.press + 0.5 * k));
      else { const o = poseOf(g.target); if (o) setVis(o, 'flex', clamp(o.flex - 0.22 * k, -1, 1)); }
    }

      const p = pops[i];
      p.t += dt;
      if (p.t >= POP_T) { pops.splice(i, 1); continue; }
      const o = poseOf(p.id);
      if (!o) continue;
      const u = p.t / POP_T, env = Math.min(1, p.t / 0.05) * (1 - u) * (1 - u);
      setVis(o, 'flex', clamp(o.flex + 1.0 * env * Math.cos(2 * Math.PI * 4.5 * p.t), -1, 1));
      setVis(o, 'ring', Math.max(o.ring || 0, 0.7 * (1 - u)));

  function restoreWiggle() { while (saved.length) { const v = saved.pop(), key = saved.pop(), o = saved.pop(); o[key] = v; } }

  // ---------------------------------------------------------------- frame stats + adaptive quality
  const FS = D.frameStats = { frames: 0, lastMs: 0, avgMs: 0, maxMs: 0, p95Ms: 0, maxDt: 0, level: qLevel, quality: QLEVELS[qLevel].q, renderScale: QLEVELS[qLevel].rs, drops: [], hides: 0, shows: 0, long: 0, simTime: 0, adaptive: qp('adaptive') !== '0' };
  const ring = new Float32Array(120); let ringN = 0, ringK = 0;

  function resetQualityWindow(skipMs) { qwin.ms = 0; qwin.n = 0; qwin.skip = Math.max(qwin.skip, skipMs || 0); }
  function applyQuality(level) {
    qLevel = clamp(level | 0, 0, QLEVELS.length - 1);
    const L2 = QLEVELS[qLevel];
    try { R.renderScale = L2.rs; if (R.quality !== L2.q) R.setQuality(L2.q); else R.resize(size.w, size.h, size.dpr, size.safe); } catch (e) { noteError('quality', e); }

    resetQualityWindow(600);
  }
  function frameStat(ms, dt) {
    FS.frames++; FS.lastMs = ms; FS.maxDt = Math.max(FS.maxDt, dt); FS.simTime = sim.state.time;
    if (ms > 50) FS.long++;
    ring[ringK] = ms; ringK = (ringK + 1) % ring.length; ringN = Math.min(ring.length, ringN + 1);
    if (FS.frames % 30 === 0) {
      let s = 0, mx = 0; const arr = Array.from(ring.subarray(0, ringN)).sort((a, b) => a - b);

      FS.avgMs = s / (ringN || 1); FS.maxMs = mx; FS.p95Ms = arr[Math.min(arr.length - 1, Math.floor(arr.length * 0.95))] || 0;

    if (qwin.skip > 0) { qwin.skip -= ms; return; }
    qwin.ms += ms; qwin.n++;
    if (qwin.ms >= SLOW_WIN_MS) {
      const avg = qwin.ms / qwin.n;
      qwin.ms = 0; qwin.n = 0;
      evalQuality(avg);
    }
  }
  // review RD-1: the rAF interval cannot tell "our frames are too heavy" from "the browser caps rAF" (iOS Low Power
  // Mode / thermal mitigation run rAF at 30 Hz with an idle GPU). So a drop is a probe: if dropping levels does not make
  // the cadence any better, the cap is not ours -> restore the level the probe started from and stop dropping while the
  // cadence stays at that cap. After a drop that did help, a long run of good windows tries one level up again (a level
  // that had to be left twice is never retried).
  const qst = D.qualityState = { probe: null, capped: 0, left: [0, 0, 0, 0], good: 0, lastChange: 0, ups: 0, restores: 0 };
  function evalQuality(avg) {
    const t = now(), last = QLEVELS.length - 1, r1 = (v) => Math.round(v * 10) / 10;
    if (qst.capped > 0) { if (avg <= qst.capped * 1.3) return; qst.capped = 0; }   // still the external cap: nothing to fix
    if (qst.probe) {
      if (avg <= SLOW_MS) { qst.probe = null; qst.lastChange = t; qst.good = 0; return; }          // the drop fixed it: keep
      if (qLevel < last) { qst.left[qLevel]++; FS.drops.push({ at: Math.round(t), avgMs: r1(avg), to: qLevel + 1 }); applyQuality(qLevel + 1); return; }
      const capLike = (v) => [33.33, 50, 66.67].some((c) => Math.abs(v - c) < 2.5);   // a steady 30/20/15 Hz rAF cadence
      if (avg >= qst.probe.avg * 0.85 && capLike(avg) && capLike(qst.probe.avg)) {   // lowest level, no better: a cadence cap, not our load
        const back = qst.probe.from; qst.capped = Math.max(avg, qst.probe.avg); qst.probe = null; qst.restores++;
        FS.drops.push({ at: Math.round(t), avgMs: r1(avg), to: back, restore: true });
        for (let k = back; k < last; k++) qst.left[k] = Math.max(0, qst.left[k] - 1);           // those drops do not count
        applyQuality(back); qst.lastChange = t; return;
      }
      qst.probe = null; qst.lastChange = t; return;                                               // it helped somewhat: keep
    }
    if (avg > SLOW_MS) {
      if (qLevel >= last) return;
      qst.probe = { from: qLevel, avg }; qst.left[qLevel]++; qst.good = 0;
      FS.drops.push({ at: Math.round(t), avgMs: r1(avg), to: qLevel + 1 }); applyQuality(qLevel + 1); return;
    }
    if (avg <= GOOD_MS && qLevel > 0 && t - qst.lastChange >= UP_WAIT_MS) {
      if (++qst.good >= 3 && qst.left[qLevel - 1] < 2) { qst.good = 0; qst.ups++; qst.lastChange = t; FS.drops.push({ at: Math.round(t), avgMs: r1(avg), to: qLevel - 1, up: true }); applyQuality(qLevel - 1); }
    } else qst.good = 0;
  }

  // ---------------------------------------------------------------- rAF loop (dt clamped, stops while hidden)
  let running = false, rafId = 0, lastT = 0, renderOn = true;
  function frame(ts) {
    rafId = 0;
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    const t = now();
    let ms = t - lastT; lastT = t;
    if (!(ms >= 0)) ms = 0;
    const dt = Math.min(ms / 1000, DT_MAX);
    frameNo++;
    if (Math.round(window.innerWidth) !== size.w || Math.round(window.innerHeight) !== size.h || Math.min(2, window.devicePixelRatio || 1) !== size.dpr) resize();
    try { sim.step(dt); } catch (e) { noteError('sim.step', e); }
    processEvents();
    try { updateGuide(dt); } catch (e) { noteError('guide', e); }
    applyWiggle(dt);
    if (renderOn) { try { R.render(sim.state, dt, overlay); } catch (e) { noteError('render', e); } }
    restoreWiggle();
    frameStat(ms, dt);
    if (D.onFrame) { try { D.onFrame({ frame: frameNo, t, dt }); } catch (e) { /* test hook */ } }
  }
  function start() {
    if (running) return;
    running = true; lastT = now();
    resetQualityWindow(600);
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    if (!running) return;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }
  function onHidden(why) {
    endRub(why, false);
    cancelDemo(why);
    if (running) { stop(); FS.hides++; A.suspend(); }
  }
  function onVisible() {
    if (running) return;
    FS.shows++;
    A.resume();
    start();                     // dt restarts from "now": no time jump
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' || document.hidden) onHidden('hidden'); else onVisible(); });
  window.addEventListener('pagehide', function () { onHidden('pagehide'); });
  window.addEventListener('pageshow', function () { if (!(document.visibilityState === 'hidden' || document.hidden)) onVisible(); });

  document.addEventListener('resume', function () { if (!(document.visibilityState === 'hidden' || document.hidden)) onVisible(); });

  // ---------------------------------------------------------------- test hooks (no visible UI)
  D.boardScreenPoly = function (id) { const p = polys().find((o) => o.id === id); return p ? p.poly.map((v) => v.slice()) : null; };
  D.polys = function () { return polys().map((p) => ({ id: p.id, pri: p.pri, c: p.c.slice(), raw: p.raw.map((v) => v.slice()), poly: p.poly.map((v) => v.slice()), size: polySize(p.poly), rawSize: polySize(p.raw) })); };
  D.hitTest = hitTest;
  D.backDir = backDir;
  D.screenToTable = screenToTable;
  D.overlay = overlay;
  D.pops = pops;
  D.size = size;
  D.minHit = MIN_HIT;
  D.saveMemory = saveMemory;
  D.memKey = MEM_KEY;
  D.setAdaptive = function (on) { FS.adaptive = !!on; resetQualityWindow(0); };
  D.setQualityLevel = function (lv) { applyQuality(lv); };
  D.setRender = function (on) { renderOn = !!on; };   // tests only: logic-only frames run at full rate in headless SwiftShader
  D.forceDemo = function () { cancelDemo('force'); guide.eligible = true; guide.idle = IDLE_DEMO; };
  D.state = function () {
    const st = sim.state;
    return {
      phase: st.phase, time: st.time, cycle: st.cycle, invite: { target: st.invite.target, dir: st.invite.dir },
      lifts: st.bars.map((b) => b.lift), serveLifts: st.bars.map((b) => b.serveLift || 0), rubs: st.recv.map((r) => r.rub), psi: st.recv.map((r) => r.psi),
      press: st.bars.map((b) => b.press).concat(st.recv.map((r) => r.press), [st.stop.press]),
      cookies: st.cookies.length, bridge: st.bridgeId, rack: st.rack.slots.map((s) => s.filled),
      active: active ? { id: active.id, pid: active.pid } : null, demo: guide.demo ? { target: guide.demo.target, t: guide.demo.t } : null,
      hand: { visible: overlay.hand.visible, x: overlay.hand.x, y: overlay.hand.y, alpha: overlay.hand.alpha },
      running, audio: A.state(), quality: { level: qLevel, q: QLEVELS[qLevel].q, rs: QLEVELS[qLevel].rs }, size: { w: size.w, h: size.h, dpr: size.dpr, safe: size.safe },
      fit: R.camera.fit, errors: errors.length,

  };

  // ---------------------------------------------------------------- boot
  resize();
  if (!(document.visibilityState === 'hidden' || document.hidden)) start();
  D.ready = true;
})((typeof window !== 'undefined' ? window : globalThis).GF || ((typeof window !== 'undefined' ? window : globalThis).GF = {}));
