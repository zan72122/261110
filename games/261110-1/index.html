// critically damped spring helper
function spring(cur, vel, target, k, d, dt) { // returns [pos, vel]
  const a = (target - cur) * k - vel * d; vel += a * dt; cur += vel * dt; return [cur, vel];
}
function approach(cur, target, rate, dt) { return cur + (target - cur) * (1 - Math.exp(-rate * dt)); }

// srgb hex -> linear rgb
function lin(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  return [Math.pow(r, 2.2), Math.pow(g, 2.2), Math.pow(b, 2.2)];
}

function compile(type, src) {

  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    const log = gl.getShaderInfoLog(s);

  const p = gl.createProgram();

  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));

// ---- shadow (depth packing) ----
const VS_SHADOW = `attribute vec3 aPos; uniform mat4 uModel; uniform mat4 uLightVP; void main(){ gl_Position = uLightVP*uModel*vec4(aPos,1.0); }`;
const FS_SHADOW = 'precision highp float;\n' + `
vec4 packDepth(float d){ d = min(d, 0.99999); vec4 e = vec4(1.0, 255.0, 65025.0, 16581375.0) * d; e = fract(e); e -= e.yzww * vec4(1.0/255.0,1.0/255.0,1.0/255.0,0.0); return e; }
void main(){ gl_FragColor = packDepth(gl_FragCoord.z); }`;

// ---- backdrop (screen quad) ----
const VS_BACK = `attribute vec2 aP; varying vec2 vUV; uniform vec4 uRect; void main(){ vUV = aP*0.5+0.5; vec2 p = mix(uRect.xy, uRect.zw, vUV); gl_Position = vec4(p, 0.9999, 1.0); }`;
const FS_BACK = GLSL_PREC + `uniform sampler2D uTex; uniform vec4 uCrop; uniform float uHas; uniform float uExposure; varying vec2 vUV;
void main(){
  vec2 uv = vec2(mix(uCrop.x, uCrop.z, vUV.x), mix(uCrop.w, uCrop.y, vUV.y));
  vec3 c = uHas > 0.5 ? texture2D(uTex, vec2(uv.x, 1.0-uv.y)).rgb : mix(vec3(0.80,0.84,0.88), vec3(0.92,0.94,0.96), vUV.y);
  float vig = smoothstep(1.25, 0.35, length(vUV - vec2(0.45, 0.6)));

// ---- AO blob decals (multiply) ----
const VS_BLOB = `attribute vec3 aPos; attribute vec3 aNor; attribute vec2 aUV; uniform mat4 uModel; uniform mat4 uVP; varying vec2 vUV; void main(){ vUV = aUV; gl_Position = uVP*uModel*vec4(aPos,1.0); }`;
const FS_BLOB = GLSL_PREC + `uniform float uStr; uniform float uSoft; varying vec2 vUV; void main(){ float d = length(vUV*2.0-1.0); float f = (1.0 - smoothstep(uSoft, 1.0, d)); f = f*f; gl_FragColor = vec4(vec3(1.0 - uStr*f), 1.0); }`;

// ---- particles (camera-facing soft blobs) ----
const VS_PART = `attribute vec3 aPos; attribute vec2 aUV; attribute vec4 aCol; uniform mat4 uVP; varying vec2 vUV; varying vec4 vCol; void main(){ vUV = aUV; vCol = aCol; gl_Position = uVP*vec4(aPos,1.0); }`;
const FS_PART = GLSL_PREC + `varying vec2 vUV; varying vec4 vCol; void main(){ vec2 p = vUV*2.0-1.0; float r = dot(p,p); if (r > 1.0) discard;
  float z = sqrt(1.0 - r); vec3 n = vec3(p.x, -p.y, z); float l = clamp(dot(n, normalize(vec3(-0.4,0.6,0.7))), 0.0, 1.0);
  float hl = pow(l, 24.0); vec3 c = vCol.rgb*(0.55 + 0.55*l) + vec3(hl)*0.6*vCol.a; gl_FragColor = vec4(c, 1.0); }`;

let P = {};
function buildPrograms() {
  P.lit = makeProgram(VS_LIT, FS_LIT, ['aPos', 'aNor', 'aUV']);
  P.field = makeProgram(VS_FIELD, FS_FIELD, ['aPos', 'aNor', 'aM0', 'aM1']);
  P.shadow = makeProgram(VS_SHADOW, FS_SHADOW, ['aPos']);
  P.back = makeProgram(VS_BACK, FS_BACK, ['aP']);
  P.blob = makeProgram(VS_BLOB, FS_BLOB, ['aPos', 'aNor', 'aUV']);

// ---- mesh objects ----
// static/dynamic interleaved meshes: layout 'lit' = pos3 nor3 uv2 (8 floats); 'field' = pos3 nor3 m0(4) m1(4) (14 floats)
function makeMesh(verts, idx, layout, dynamic) {
  const m = { layout: layout || 'lit', count: idx.length, vbo: gl.createBuffer(), ibo: gl.createBuffer(), dynamic: !!dynamic, nverts: 0 };
  gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts instanceof Float32Array ? verts : new Float32Array(verts), dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx instanceof Uint16Array ? idx : new Uint16Array(idx), dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
  m.nverts = (verts.length / (layout === 'field' ? 14 : 8)) | 0;
  return m;
}
function updateMesh(m, verts, idx) {
  gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
  if (verts.length / (m.layout === 'field' ? 14 : 8) > m.nverts || m.recreate) {
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW); m.nverts = (verts.length / (m.layout === 'field' ? 14 : 8)) | 0;
  } else if (verts.length) gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
  if (idx) {
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.DYNAMIC_DRAW);
    m.count = idx.length;
  }
}
function bindMesh(m, prog) {
  gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
  const stride = (m.layout === 'field' ? 14 : 8) * 4;
  const n = prog.nAttr;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  if (n > 1) { gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12); } else gl.disableVertexAttribArray(1);
  if (n > 2) {
    gl.enableVertexAttribArray(2);
    if (m.layout === 'field') { gl.vertexAttribPointer(2, 4, gl.FLOAT, false, stride, 24); }
    else gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
  } else gl.disableVertexAttribArray(2);
  if (n > 3 && m.layout === 'field') { gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, stride, 40); } else gl.disableVertexAttribArray(3);
}

// ---- textures ----
function texFromImage(img, repeat) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  const pot = (img.width & (img.width - 1)) === 0 && (img.height & (img.height - 1)) === 0;
  if (repeat && pot) {
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}
// procedural fallback detail texture (grey noise), POT
function noiseTexture(size, scale, oct, seed) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); const id = x.createImageData(size, size);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    // tileable by sampling on a torus-ish wrap
    let s = 0, a = 0.5, f = scale;
    for (let o = 0; o < oct; o++) {
      const p = size / f;
      const u = i / p, v = j / p, P0 = f | 0 || 1;
      const xi = Math.floor(u), yi = Math.floor(v), xf = u - xi, yf = v - yi;
      const w = (q) => ((q % P0) + P0) % P0;
      const g = (aa, bb) => hash2(w(aa) + seed * 31 + o * 97, w(bb) + seed * 17);
      const uu = xf * xf * (3 - 2 * xf), vv = yf * yf * (3 - 2 * yf);
      const n = lerp(lerp(g(xi, yi), g(xi + 1, yi), uu), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), uu), vv);
      s += a * n; a *= 0.5; f *= 2;
    }
    const k = (j * size + i) * 4, val = clamp(s * 255 * 1.05, 0, 255);
    id.data[k] = id.data[k + 1] = id.data[k + 2] = val; id.data[k + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  return c;
}

// ---- shadow framebuffer ----
const SHADOW_SIZE = 1024;
let shadowFB = null, shadowTex = null;
function buildShadowFB() {
  shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SHADOW_SIZE, SHADOW_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const rb = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, SHADOW_SIZE, SHADOW_SIZE);

  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, shadowTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ===== mesh builders ===========================================================
class MB { // lit layout builder: pos3 nor3 uv2
  constructor() { this.v = []; this.i = []; this.n = 0; }
  vert(p, nn, uv) { this.v.push(p[0], p[1], p[2], nn[0], nn[1], nn[2], uv ? uv[0] : 0, uv ? uv[1] : 0); return this.n++; }
  tri(a, b, c) { this.i.push(a, b, c); }
  quad(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
  mesh() { return makeMesh(new Float32Array(this.v), new Uint16Array(this.i), 'lit', false); }
}

// generic parametric surface: fn(u,v) -> [x,y,z]; u wraps if wrapU; normals by finite differences
function paramSurface(mb, nu, nv, fn, uvfn, wrapU, flip) {
  const P = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) P.push(fn(i / nu, j / nv));
  const at = (i, j) => { if (wrapU) i = ((i % nu) + nu) % nu; else i = clamp(i, 0, nu); j = clamp(j, 0, nv); return P[j * (nu + 1) + i]; };
  const base = mb.n;
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const du = V3.sub(at(i + 1, j), at(i - 1, j));
    let dv = V3.sub(at(i, j + 1), at(i, j - 1));
    if (V3.len(dv) < 1e-7) dv = V3.sub(at(i, j + 2), at(i, j - 2));
    let nn = V3.norm(V3.cross(dv, du)); if (flip) nn = V3.mul(nn, -1);
    if (!isFinite(nn[0]) || V3.len(nn) < 0.5) nn = [0, flip ? -1 : 1, 0];
    mb.vert(P[j * (nu + 1) + i], nn, uvfn ? uvfn(i / nu, j / nv) : [i / nu, j / nv]);
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = base + j * (nu + 1) + i, b = a + 1, c = a + nu + 2, d = a + nu + 1;
    if (flip) mb.quad(a, b, c, d); else mb.quad(a, d, c, b);
  }
}

function lathe(mb, prof, seg, uvy, noflip) { // prof traversed outward along the top surface (solid below)
  paramSurface(mb, seg, prof.length - 1, (u, v) => {
    const k = Math.round(v * (prof.length - 1)); const a = u * TAU; const r = prof[k][0];
    return [Math.cos(a) * r, prof[k][1], Math.sin(a) * r];
  }, (u, v) => [u, uvy ? uvy(v) : v], true, !noflip);
}

function boxMesh(w, h, d, uvY) {
  const mb = new MB(); const x = w / 2, z = d / 2;
  const F = [
    [[0, 1, 0], [[-x, h, z], [x, h, z], [x, h, -z], [-x, h, -z]]],
    [[0, -1, 0], [[-x, 0, -z], [x, 0, -z], [x, 0, z], [-x, 0, z]]],
    [[0, 0, 1], [[-x, 0, z], [x, 0, z], [x, h, z], [-x, h, z]]],
    [[0, 0, -1], [[x, 0, -z], [-x, 0, -z], [-x, h, -z], [x, h, -z]]],
    [[1, 0, 0], [[x, 0, z], [x, 0, -z], [x, h, -z], [x, h, z]]],
    [[-1, 0, 0], [[-x, 0, -z], [-x, 0, z], [-x, h, z], [-x, h, -z]]],

  for (const [nn, q] of F) { const a = mb.vert(q[0], nn, [0, uvY || 0]), b = mb.vert(q[1], nn, [1, uvY || 0]), c = mb.vert(q[2], nn, [1, 1]), d = mb.vert(q[3], nn, [0, 1]); mb.quad(a, b, c, d); }
  return mb.mesh();
}

// rounded-rectangle path (x0..x1, z0..z1, radius) -> points with outward normals
function rrectPath(x0, x1, z0, z1, rad, nper) {
  const pts = []; const cs = [[x1 - rad, z1 - rad, 0], [x1 - rad, z0 + rad, -Math.PI / 2], [x0 + rad, z0 + rad, Math.PI], [x0 + rad, z1 - rad, Math.PI / 2]];
  // go counter-clockwise when viewed from +y (x right, z toward viewer) : start at corner (x1,z1)
  const corners = [[x1 - rad, z1 - rad, 0, Math.PI / 2], [x0 + rad, z1 - rad, Math.PI / 2, Math.PI], [x0 + rad, z0 + rad, Math.PI, 1.5 * Math.PI], [x1 - rad, z0 + rad, 1.5 * Math.PI, TAU]];
  for (const [cx, cz, a0, a1] of corners) for (let k = 0; k <= nper; k++) { const a = lerp(a0, a1, k / nper); const nx = Math.cos(a), nz = Math.sin(a); pts.push([cx + nx * rad, cz + nz * rad, nx, nz]); }
  return pts;
}

// tray: floor + rim, enamel. floor at y=h
function trayMesh(x0, x1, z0, z1, h) {
  const mb = new MB();
  const path = rrectPath(x0, x1, z0, z1, 1.4, 6);
  // floor: fan
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const c = mb.vert([cx, h, cz], [0, 1, 0], [0, 0]);
  const ring = path.map(p => mb.vert([p[0], h, p[1]], [0, 1, 0], [0, 0]));
  for (let k = 0; k < ring.length; k++) mb.tri(c, ring[(k + 1) % ring.length], ring[k]);
  // rim profile (offset along outward normal, y)
  const prof = [[0, h], [0.18, h + 0.05], [0.42, h + 0.34], [0.55, h + 0.46], [0.66, h + 0.47], [0.74, h + 0.40], [0.76, h + 0.1], [0.74, 0.0]];
  const np = prof.length, base = mb.n;
  for (let k = 0; k < path.length; k++) {
    const p = path[k];
    for (let j = 0; j < np; j++) {
      const o = prof[j][0], y = prof[j][1];
      const jp = Math.min(np - 1, j + 1), jm = Math.max(0, j - 1);
      const tx = prof[jp][0] - prof[jm][0], ty = prof[jp][1] - prof[jm][1];
      let nr = -ty, ny = tx; const l = Math.hypot(nr, ny) || 1; nr /= l; ny /= l;
      mb.vert([p[0] + p[2] * o, y, p[1] + p[3] * o], V3.norm([p[2] * nr, ny, p[3] * nr]), [k / path.length, 0.86 + 0.14 * (j / (np - 1))]);
    }
  }
  for (let k = 0; k < path.length; k++) {
    const k2 = (k + 1) % path.length;
    for (let j = 0; j < np - 1; j++) { const a = base + k * np + j, b = base + k2 * np + j; mb.quad(a, b, b + 1, a + 1); }
  }
  return mb.mesh();
}

// plate: lathe profile (radius rp), porcelain. returns mesh with y=0 at foot
function plateProfile(rp) {
  return [[0, 0.29], [rp * 0.3, 0.29], [rp * 0.55, 0.30], [rp * 0.66, 0.32], [rp * 0.74, 0.38], [rp * 0.80, 0.49], [rp * 0.86, 0.64], [rp * 0.92, 0.80], [rp * 0.965, 0.9], [rp * 0.99, 0.91], [rp * 1.0, 0.86], [rp * 0.99, 0.74], [rp * 0.86, 0.42], [rp * 0.62, 0.14], [rp * 0.58, 0.0], [rp * 0.52, 0.0], [rp * 0.5, 0.12], [0, 0.12]];
}
function plateHeightAt(r, rp) { // top surface height (for sim base) at radius r
  const p = plateProfile(rp); for (let k = 0; k < 9; k++) { if (r <= p[k + 1][0]) { const t = (r - p[k][0]) / (p[k + 1][0] - p[k][0] || 1); return lerp(p[k][1], p[k + 1][1], t); } } return 0.88;
}
function plateMesh(rp) { const mb = new MB(); lathe(mb, plateProfile(rp), 72); return mb.mesh(); }

// ---- macaron shell (local: flat face y=0, dome +y). returns {dome, foot, face}
const SHELL = { R: 3.0, footH: 0.40, domeH: 0.98 };
function chipK(theta, chip) { if (!chip) return 0; const d = Math.abs(angDiff(theta, chip.a)); return Math.pow(Math.max(0, 1 - d / chip.w), 1.4); }

    const yy = y / fH;
    let r = R * (0.958 + 0.042 * Math.sin(Math.PI * Math.min(1, yy * 1.15))) + ruff(th, yy) * 0.16 * Math.sin(Math.PI * yy);

  const md = new MB();

    const th = u * TAU; const re = domeEdge(th); const r = re * (1 - v);
    let y = domeY(r, th); if (v < 0.02) y = fH - chipK(th, chip) * 0.08;
    return [Math.cos(th) * r, y, Math.sin(th) * r];

  const mf = new MB();
  paramSurface(mf, 128, 8, (u, v) => {
    const th = u * TAU; const y0 = footY0(th); const y = lerp(y0, fH, v);
    const r = footR(th, y);
    return [Math.cos(th) * r, y, Math.sin(th) * r];
  }, (u, v) => [u, v], true, false);

  const mc = new MB();
  paramSurface(mc, 96, 10, (u, v) => {
    const th = u * TAU; const re = footR(th, footY0(th) + 0.001) - 0.02; const r = re * v;
    return [Math.cos(th) * r, footY0(th) * Math.pow(v, 6), Math.sin(th) * r];
  }, (u, v) => [u, v * 0.98], true, false);
  return { dome: md.mesh(), foot: mf.mesh(), face: mc.mesh() };

// long filling nozzle (local: tip at origin pointing -y, length NOZ_L): thin steel tube, star (cream) or round (jam) tip, flared coupler
const NOZ_L = 3.0;
function nozzleMesh(star) {
  const mb = new MB(); const L = NOZ_L;
  paramSurface(mb, star ? 48 : 28, 18, (u, v) => {
    const th = u * TAU; const y = v * L; // v=0 tip
    let r;
    if (v < 0.07) { r = lerp(0.15, 0.2, v / 0.07); if (star) r *= 1 + 0.2 * Math.max(0, Math.cos(th * 8)); }
    else if (v < 0.1) r = lerp(0.2, 0.13, (v - 0.07) / 0.03);
    else if (v < 0.8) r = 0.13;
    else if (v < 0.95) r = lerp(0.13, 0.5, smooth(0.8, 0.95, v));
    else r = 0.52;
    return [Math.cos(th) * r, y, Math.sin(th) * r];
  }, (u, v) => [u, v], true, false);

  for (const o of objs) { const [sx, sy, sr] = screenRadius(o[1], o[2]); if (Math.hypot(x - sx, (y - sy) * 1.25) < sr) return o[0]; }
  return null; // tray surface, counter and wall are blank: nothing happens
}
function wiggle(name) { G.wig[name] = { t0: G.time, amp: 0.035 }; sfx.wiggle(); logEv('wiggle', { obj: name }); }

function onDown(e) {
  e.preventDefault();
  sfx.init();
  G.lastInput = G.time; G.hint.shown = false; G.hint.t = -1; // hide hint on any operation; idle restarts
  if (G.press.pid !== null) return; // another finger already squeezing: ignore extra fingers
  const x = e.clientX, y = e.clientY;
  const hb = hitBag(x, y);
  if (hb) {
    G.press.pid = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { }
    G.bags[hb.id].pressT = clamp(hb.t, 0.25, 0.62);
    pressStart(hb.id);
    return;
  }
  const o = hitObject(x, y);
  if (o) wiggle(o);
}
function onUpAny(e) { sfx.init(); }
function onUp(e) {
  if (G.press.pid === null || e.pointerId !== G.press.pid) return;
  e.preventDefault && e.preventDefault();
  const id = G.press.bag; G.press.pid = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (er) { }
  if (id >= 0) pressEnd(id);
  G.lastInput = G.time; G.hint.shown = false;
}
function stopAllPress() { if (G.press.bag >= 0) { const id = G.press.bag; G.press.pid = null; pressEnd(id); } G.press.pid = null; }
function bindInput() {
  cv.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointerup', onUpAny, { passive: true });
  window.addEventListener('touchend', onUpAny, { passive: true });
  cv.addEventListener('pointerup', onUp, { passive: false });
  cv.addEventListener('pointercancel', onUp, { passive: false });
  cv.addEventListener('lostpointercapture', onUp, { passive: false });
  window.addEventListener('pointerup', onUp, { passive: false });
  window.addEventListener('blur', stopAllPress);
  window.addEventListener('pagehide', stopAllPress);
  const prevent = e => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('touchstart', prevent, { passive: false });
  document.addEventListener('touchmove', prevent, { passive: false });
  document.addEventListener('touchend', prevent, { passive: false });
  document.addEventListener('gesturestart', prevent, { passive: false });
  document.addEventListener('gesturechange', prevent, { passive: false });
  document.addEventListener('contextmenu', prevent);
  document.addEventListener('dblclick', prevent);
  document.addEventListener('selectstart', prevent);
  document.addEventListener('wheel', prevent, { passive: false });
}

// ===== idle hint (press-and-release hand, drawn once per idle period) ==========
function updateIdle(dt) {
  const idle = G.time - G.lastInput;
  if (G.press.bag >= 0) { G.lastInput = G.time; return; }
  if (idle > 4 && !G.hint.shown && !G.act) { G.hint.shown = true; G.hint.t = 0; G.hint.bag = G.invite; logEv('hint', { bag: G.invite }); }
  if (G.hint.t >= 0) { G.hint.t += dt; if (G.hint.t > 2.2) G.hint.t = -1; }
}
function drawOverlay() {
  const w = ov.width, h = ov.height, d = RS.ovScale || 1;
  if (G.hint.t < 0) { if (RS.ovOn) { octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, w, h); ov.style.display = 'none'; RS.ovOn = false; } return; }
  if (!RS.ovOn) { ov.style.display = 'block'; RS.ovOn = true; }
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, w, h);
  const b = G.bags[G.hint.bag]; if (!b || !b.rings) return;
  const k = Math.floor(b.rings.length * 0.42); const c = toScreen(b.rings[k][0]);
  const t = G.hint.t;
  const fade = Math.min(1, t / 0.25) * (1 - smooth(1.8, 2.2, t));
  const press = t < 0.45 ? 0 : (t < 0.75 ? smooth(0.45, 0.75, t) : (t < 1.25 ? 1 : 1 - smooth(1.25, 1.5, t)));
  const drop = (1 - smooth(0, 0.45, t)) * 40;
  octx.setTransform(d, 0, 0, d, 0, 0);
  octx.globalAlpha = 0.85 * fade;
  const sa = CAM.safe; const x = clamp(c[0] + 6, sa[3] + 40, CAM.w - sa[1] - 80), y = clamp(c[1] - 8 - drop - (1 - press) * 14, sa[0] + 20, CAM.h - sa[2] - 130);
  drawHintHand(octx, x, y, 1 + 0.05 * (1 - press), press);
  if (press > 0.5) { octx.globalAlpha = 0.35 * fade * (press - 0.5) * 2; octx.strokeStyle = '#ffffff'; octx.lineWidth = 3; octx.beginPath(); octx.arc(c[0], c[1], 26 + press * 10, 0, TAU); octx.stroke(); }
  octx.globalAlpha = 1;
}
function drawHintHand(x2, x, y, s, press) {
  x2.save(); x2.translate(x, y); x2.scale(s, s);
  x2.shadowColor = 'rgba(40,50,60,0.35)'; x2.shadowBlur = 10; x2.shadowOffsetY = 4;
  const g = x2.createLinearGradient(-30, -20, 30, 90); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d9dfe5');
  x2.fillStyle = g; x2.strokeStyle = 'rgba(95,108,122,0.9)'; x2.lineWidth = 2;
  const rr = (px, py, w, h, r) => { x2.beginPath(); x2.moveTo(px + r, py); x2.arcTo(px + w, py, px + w, py + h, r); x2.arcTo(px + w, py + h, px, py + h, r); x2.arcTo(px, py + h, px, py, r); x2.arcTo(px, py, px + w, py, r); x2.closePath(); };
  // index finger pointing down to the touch point (tip at 0,0)
  rr(-9, -2 + press * 3, 18, 58 - press * 6, 9); x2.fill(); x2.stroke();
  // palm & curled fingers
  rr(-12, 40, 52, 50, 18); x2.fill(); x2.stroke();
  rr(10, 36, 16, 30, 8); x2.fill(); x2.stroke();
  rr(24, 40, 15, 28, 7.5); x2.fill(); x2.stroke();
  rr(-24, 52, 16, 34, 8); x2.fill(); x2.stroke(); // thumb
  rr(-6, 88, 42, 30, 10); x2.fill(); x2.stroke(); // wrist/sleeve
  x2.restore();
}

// ===== nozzles follow the artisan's guidance ===================================
function updateNozzles(dt) {
  const L = layoutPts();
  for (const b of G.bags) {
    const id = b.id;
    const tg = nozzleTarget(id);
    const busy = G.act && G.act.blocks && G.act.blocks.indexOf(id) >= 0 && G.hands[id].goal;
    let goal, axis;
    const bagBack = L.bag[id];
    if (busy) {
      goal = V3.add(V3.lerp(bagBack, [MAC.x, 0, MAC.z], 0.42), [0, 1.0, 0]);
      axis = V3.norm(V3.add(V3.mul(V3.norm(V3.sub([MAC.x, 0, MAC.z], bagBack)), 1), [0, -0.5, 0]));
    } else {
      goal = tg.w.slice();
      if (tg.side) { const inw = [tg.inward[0], 0, tg.inward[1]]; axis = V3.norm(V3.add(V3.mul(inw, 0.9), [0, -0.3, 0])); if (!b.pressing) goal = V3.add(goal, V3.add(V3.mul(inw, -0.45), [0, 0.35, 0])); }
      else {
        const tb = V3.norm(V3.sub([bagBack[0], 0, bagBack[2]], [goal[0], 0, goal[2]]));
        axis = V3.norm(V3.add([0, -1, 0], V3.mul(tb, -1.05)));
        if (!b.pressing) goal = V3.add(goal, [0, 0.55, 0]);
      }
      if (b.pressing) goal = V3.add(goal, [0, -0.12, 0]);
    }
    if (b.hop > 0 && !b.pressing) goal = V3.add(goal, [0, b.hop * 0.7, 0]); // whole bag (nozzle too) hops when invited
    if (!b.tipInit) { b.tip = goal.slice(); b.tipV = [0, 0, 0]; b.axis = axis; b.tipInit = true; }
    for (let q = 0; q < 3; q++) { const r = spring(b.tip[q], b.tipV[q], goal[q], 260, 30, dt); b.tip[q] = r[0]; b.tipV[q] = r[1]; }
    b.axis = V3.norm(V3.lerp(b.axis, axis, 1 - Math.exp(-dt * 8)));
    // invited bag: small periodic hop (whole bag, no wave)
    const blocked = G.act && G.act.blocks && G.act.blocks.indexOf(id) >= 0;
    const inv = G.invite === id && G.press.bag < 0 && !blocked;
    const ph = (G.time % 1.6);
    b.hop = inv && ph < 0.45 ? Math.sin(ph / 0.45 * Math.PI) * 0.36 : 0;

  }
}

// ===== simulation step ==========================================================
function trayDrain(k) { G.T.J[k] = 0; G.T.C[k] = 0; }
function simulate(dt) {
  const F = G.F, T = G.T, Pg = G.P;
  const topOn = G.top.state === 'on';
  if (G.bottom.state === 'tray') {
    F.awake = Math.max(F.awake, G.press.bag >= 0 ? 30 : 0);
    if (topOn) {
      const pressing = G.press.bag >= 0 && G.phase === 'B';
      const plug = pressing ? nozzleTarget(G.press.bag).plug : null;
      const iters = (G.top.pressDown || 0) > 0 ? 6 : (pressing ? 3 : 2);
      if (pressing || (G.top.pressDown || 0) > 0 || (G.tick % 3 === 0)) squeeze(F, ceilArray(), iters, onExitF, plug);
      for (let q = 0; q < 4; q++) flowJam(F, dt, true, onExitF, true);
    } else if (G.phase === 'A' || G.phase === 'PLACING') {
      for (let q = 0; q < 5; q++) flowJam(F, dt, true, onExitF, true);
      if (G.tick % 2 === 0) flowCream(F, dt, onExitF);
    }
    updateLips(dt);
  }
  updateRopes(dt);
  flowJam(T, dt, true, trayDrain); flowJam(T, dt, true, trayDrain);
  if (G.tick % 3 === 0) flowCream(T, dt, null);
  if (!G.plate.hidden) { flowJam(Pg, dt, false, null); if (G.tick % 3 === 1) flowCream(Pg, dt, null); }
  if (G.tick % 45 === 0) { T.shrink(); Pg.shrink(); }
  if (G.plate.glow > 0) G.plate.glow = Math.max(0, G.plate.glow - dt * 1.2);
}

function step(dt) {
  G.time += dt; G.tick = (G.tick || 0) + 1;
  updatePress(dt);
  updateAction(dt);
  updateNozzles(dt);
  simulate(dt);
  updateTop(dt);
  updatePieces(dt);
  if (G.tick % 6 === 0) evalDiscoveries();
  if (G.tick % 10 === 0) { scanJamBank(); G.invite = computeInvite(); }
  updateHands(dt);
  updateParts(dt);
  updateIdle(dt);
}

// ===== frame loop / resize / visibility =========================================
const STEP = 1 / 60;
const TEST_SCALE = (function () { try { const m = /[?&]scale=([0-9.]+)/.exec(location.search); return m ? clamp(+m[1], 0.25, 1) : 0; } catch (e) { return 0; } })();
const TEST_FAST = (function () { try { const m = /[?&]fast=(\d+)/.exec(location.search); return m ? Math.min(12, +m[1]) : 0; } catch (e) { return 0; } })();
let lastTs = 0, acc = 0, rafId = 0, running = false;
function resize() {
  if (window.innerWidth < 40 || window.innerHeight < 40) return;
  const big = Math.min(window.innerWidth, window.innerHeight) >= 700;
  const dpr = Math.min(big ? 1.5 : 2, window.devicePixelRatio || 1);
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const s = dpr * (TEST_SCALE || RS.scale);
  const W = Math.round(w * s), H = Math.round(h * s);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const od = Math.min(2, window.devicePixelRatio || 1);
  if (ov.width !== Math.round(w * od) || ov.height !== Math.round(h * od)) { ov.width = Math.round(w * od); ov.height = Math.round(h * od); }
  RS.ovScale = od;
  const prevMode = CAM.mode;
  fitCamera();
  RS.lastSize = w + 'x' + h;
  if (prevMode !== CAM.mode) {
    logEv('orient', { mode: CAM.mode });
    if (G.T) setTrayDrive();
    G.works.forEach((ww, i) => { const d = displaySpot(i); ww.plate.x = d[0]; ww.plate.z = d[2]; ww.plate.y = d[1]; });
    if (G.press.bag >= 0) stopAllPress();
  }
}
function frame(ts) {
  rafId = requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  acc += dt; let n = 0;
  const maxSteps = TEST_FAST || 2;
  if (TEST_FAST) acc = STEP * TEST_FAST;
  while (acc >= STEP && n < maxSteps) { step(STEP); acc -= STEP; n++; }
  if (n >= maxSteps) acc = 0;
  G.frame = (G.frame || 0) + 1;
  const sz = window.innerWidth + 'x' + window.innerHeight;
  if (sz !== RS.lastSize) resize();
  const t0 = performance.now();
  try { renderFrame(); } catch (e) { (window.__mgErrors = window.__mgErrors || []).push('render:' + (e && e.message)); }
  drawOverlay();
  // adaptive resolution
  RS.frameMs = RS.frameMs * 0.95 + dt * 1000 * 0.05;
  if (G.frame > 120) {
    if (RS.frameMs > 24 && RS.scale > 0.62) { RS.lowCount++; if (RS.lowCount > 50) { RS.scale = Math.max(0.6, RS.scale - 0.1); RS.lowCount = 0; resize(); } }
    else if (RS.frameMs < 15 && RS.scale < 1) { RS.lowCount--; if (RS.lowCount < -240) { RS.scale = Math.min(1, RS.scale + 0.1); RS.lowCount = 0; resize(); } }
  }
}
function start() { if (running) return; running = true; lastTs = 0; acc = 0; rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopAllPress(); stop(); sfx.suspend(); logEv('hidden'); }
  else { sfx.resume(); start(); logEv('visible'); }
});
window.addEventListener('resize', () => { resize(); });
window.addEventListener('orientationchange', () => { setTimeout(resize, 60); });

// ===== debug/test API (no UI) ===================================================
window.__mg = {
  get state() {
    const T0 = G.top;
    return {
      phase: G.phase, cycle: G.cycle, time: +G.time.toFixed(2), ring: +(G.ring.prog / TAU).toFixed(3), invite: G.invite, act: G.act ? G.act.name : null,
      tilt: +Math.hypot(T0.plane[1], T0.plane[2]).toFixed(3), plane: T0.plane.map(v => +v.toFixed(3)), topState: T0.state,
      disc: Object.assign({}, G.disc), leak: +G.leakVol.toFixed(3), band: +G.bandVol.toFixed(3), chip: +G.chipVol.toFixed(3), crust: G.crustCount, jamBank: G.jamBank,
      plateTouched: G.plateTouched, plateVol: +G.plateVol.toFixed(3), heads: G.heads.filter(h => h.alive).length, ringClosed: G.ring.closed, pressTotal: +(G.stats.pressTotal || 0).toFixed(1), contactFrac: +(G.contactFrac || 0).toFixed(3), bouquet: +G.bouquetVol.toFixed(3), contact: G.contactArea || 0,
      bags: G.bags.map(b => ({ dent: +b.dent.toFixed(3), pressing: b.pressing, used: +b.used.toFixed(3), fill: +b.fill.toFixed(2), glow: +b.glow.toFixed(2) })),
      press: { bag: G.press.bag, pid: G.press.pid }, volF: +sumVol(G.F).toFixed(3), volT: +sumVol(G.T).toFixed(3), volP: +sumVol(G.P).toFixed(3), volTP: +sumVol(G.TP).toFixed(3),
      pieces: G.pieces.map(p => p.st), works: G.works.length, crumbs: G.crumbs.length, restored: !!G.restoredCrumbs, mode: CAM.mode, scale: RS.scale, frameMs: +RS.frameMs.toFixed(1),
      hint: G.hint.t >= 0, audio: sfx.state, parts: G.parts.length, sideAngle: +G.side.angle.toFixed(2), jamPort: +G.jamPort.toFixed(2), chipWorld: +(G.top.chipWorld || 0).toFixed(2),
      errors: (window.__mgErrors || []).slice(0, 5),
    };
  },
  log: () => window.__mgLog.slice(),
  bagPoint(id, t) { const b = G.bags[id]; if (!b || !b.rings) return null; const k = Math.floor((b.rings.length - 1) * (t || 0.4)); const s = toScreen(b.rings[k][0]); return { x: s[0], y: s[1] }; },
  bagExtent(id) { const pts = bagScreenInfo(G.bags[id]); if (!pts) return null; let r = 0; for (const p of pts) r = Math.max(r, p[2]); return { maxRadius: r, pts: pts.map(p => [Math.round(p[0]), Math.round(p[1]), Math.round(p[2])]) }; },
  worldToScreen(x, y, z) { const s = toScreen([x, y, z]); return { x: s[0], y: s[1] }; },
  objPoint(name) {
    const L = layoutPts(); const m = { bottom: [MAC.x, faceY(), MAC.z], top: G.top.state === 'wait' ? [G.top.wx, TRAY.h + 1, G.top.wz] : [MAC.x, faceY() + 1, MAC.z], plate: [G.plate.x, G.plate.y + 0.4, G.plate.z], sample: [L.sample[0], 1, L.sample[2]], tray: [-11.5, TRAY.h, 6.5], oven: V3.add(CAM.target, V3.add(V3.mul(viewBack(), L.wallD), [0, 9, 0])) }[name];
    if (!m) return null; const s = toScreen(m); return { x: s[0], y: s[1] };
  },
  macScreen() { const s = toScreen([MAC.x, faceY(), MAC.z]); return { x: s[0], y: s[1] }; },
  safe: () => CAM.safe.slice(),
  prof() { const t0 = performance.now(); for (let i = 0; i < 30; i++) step(STEP); const t1 = performance.now(); renderFrame(); gl.finish(); const t2 = performance.now(); return { stepMs: +((t1 - t0) / 30).toFixed(2), renderMs: +(t2 - t1).toFixed(1), boxT: G.T.box.slice(), awakeT: G.T.awake, heads: G.heads.length }; },
};
function sumVol(g) { if (!g) return 0; let s = 0; for (let k = 0; k < g.N; k++) s += g.C[k] + g.J[k] + g.U[k]; return s * g.cell * g.cell; }

// ===== boot =====================================================================
function boot() {
  makeBags();
  G.hands = [{ id: 0, goal: null }, { id: 1, goal: null }];
  resize();
  newRound(true);
  if (gl) {
    initGL();
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); RS.ready = false; stop(); }, false);
    cv.addEventListener('webglcontextrestored', () => { try { G.works = []; initGL(); G.T.fullDirty = true; G.P.fullDirty = true; G.F.fullDirty = true; G.TP.fullDirty = true; RS.shadowOnce = false; } catch (e) { } start(); }, false);
  }
  bindInput();
  G.lastInput = 0;
  ov.style.display = 'none';
  // warm-up: one full frame (compiles/links every program before the first touch)
  try { if (gl) { updateNozzles(1 / 60); updateHands(1 / 60); spawnPart([MAC.x, -5, MAC.z], [0, 0, 0], [1, 1, 1], 0.01, 0.05); renderFrame(); } } catch (e) { (window.__mgErrors = window.__mgErrors || []).push('warm:' + e.message); }
  start();
}
boot();
