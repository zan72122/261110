'use strict';
(function(){
// =====================================================================
//  utilities
// =====================================================================
const PI=Math.PI, TAU=PI*2, DEG=PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const wrap=(a)=>{a=((a+180)%360+360)%360-180;return a===-180?180:a;};
const bump=(x,c,w)=>{const d=Math.abs(x-c)/w;return d>=1?0:0.5+0.5*Math.cos(d*PI);};
const sgn=(x)=>x<0?-1:1;
let seedR=12345;
function rnd(){seedR=(seedR*1664525+1013904223)>>>0;return seedR/4294967296;}
function hexLin(h){const n=parseInt(h.slice(1),16);return [Math.pow(((n>>16)&255)/255,2.2),Math.pow(((n>>8)&255)/255,2.2),Math.pow((n&255)/255,2.2)];}

const V3={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sc:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:(a)=>Math.hypot(a[0],a[1],a[2]),
  norm:(a)=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
};
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  mul(a,b){const o=new Float32Array(16);
    for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
      o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
      o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
      o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
      o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}
    return o;},
  T(x,y,z){const m=M4.id();m[12]=x;m[13]=y;m[14]=z;return m;},
  S(x,y,z){const m=M4.id();m[0]=x;m[5]=y===undefined?x:y;m[10]=z===undefined?x:z;return m;},
  RX(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},
  RY(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;},
  RZ(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;},
  basis(x,y,z,o){const m=M4.id();m[0]=x[0];m[1]=x[1];m[2]=x[2];m[4]=y[0];m[5]=y[1];m[6]=y[2];m[8]=z[0];m[9]=z[1];m[10]=z[2];m[12]=o[0];m[13]=o[1];m[14]=o[2];return m;},
  persp(fy,asp,n,f){const t=1/Math.tan(fy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  look(e,c,up){const z=V3.norm(V3.sub(e,c)),x=V3.norm(V3.cross(up,z)),y=V3.cross(z,x);const m=M4.id();
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-V3.dot(x,e);m[13]=-V3.dot(y,e);m[14]=-V3.dot(z,e);return m;},
  inv(m){const o=new Float32Array(16);
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
      b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; if(!det) return M4.id(); det=1/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;},
  xf(m,p){const x=p[0],y=p[1],z=p[2];return [m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]];},
  xp(m,p){const r=M4.xf(m,p);return [r[0],r[1],r[2]];},
  xd(m,d){return [m[0]*d[0]+m[4]*d[1]+m[8]*d[2],m[1]*d[0]+m[5]*d[1]+m[9]*d[2],m[2]*d[0]+m[6]*d[1]+m[10]*d[2]];},
};
function chain(){let m=arguments[0];for(let i=1;i<arguments.length;i++)m=M4.mul(m,arguments[i]);return m;}

  S:[2.0,-2.88], Rp:2.46, ringIn:2.40, ringOut:2.68, trackIn:2.70, trackOut:2.82,
  pageY:0.42, paperY:0.53, hingeY:0.5,
  bx0:-1.0, bx1:5.2, bz0:-5.8, bz1:5.8,
  K:[5.6,0], Kr:0.5,
  handleR:2.0, handleOff:142,
  seatOff:[0,90,180,270], trOff:-68,
  markW:0.85, markH:1.4, rubW:0.98, rubH:1.56, blkW:1.08, blkH:1.66, rubT:0.16, blkT:0.5,
  trW:2.3, padR:3.0, yLift:1.42, padTop:1.24,

L.P=[L.D[0]+L.Ra*Math.cos(L.aP*DEG), L.D[1]+L.Ra*Math.sin(L.aP*DEG)];
L.Q=[L.D[0]+L.Ra*Math.cos(L.aQ*DEG), L.D[1]+L.Ra*Math.sin(L.aQ*DEG)];
L.dPS=Math.hypot(L.P[0]-L.S[0],L.P[1]-L.S[1]);
L.aPS=Math.atan2(L.P[1]-L.S[1],L.P[0]-L.S[0])/DEG;           // angle of P around S
L.mount=L.aPS-L.aP;                                          // stamp up-dir offset from arm radial dir
for(const h of L.holes){h.la=L.aPS+h.a; h.u=L.dPS*Math.cos(h.la*DEG); h.v=L.dPS*Math.sin(h.la*DEG);}
// feed gear between disc rim and hoop
(function(){const dx=L.S[0]-L.D[0],dz=L.S[1]-L.D[1],dl=Math.hypot(dx,dz),ux=dx/dl,uz=dz/dl;
  const rim=[L.D[0]+ux*L.Rd,L.D[1]+uz*L.Rd], hp=[L.S[0]-ux*L.trackOut,L.S[1]-uz*L.trackOut];
  L.G=[(rim[0]+hp[0])/2,(rim[1]+hp[1])/2]; L.Gr=Math.max(0.35,Math.hypot(hp[0]-rim[0],hp[1]-rim[1])/2-0.02);})();

// =====================================================================
//  storage (all guarded)

const STORE_KEY='kk-hanataba-261110-6';
const store={ok:true,lastErr:null};
function storeLoad(){
  let raw=null;
  try{raw=window.localStorage.getItem(STORE_KEY);}catch(e){store.ok=false;store.lastErr='get';return null;}
  if(raw===null||raw===undefined||raw==='') return null;
  try{
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object'||d.v!==1) throw new Error('bad');
    const out={order:[0,1,2,3],phi:0,memorials:[],plays:0};
    if(Array.isArray(d.order)&&d.order.length===4){const o=d.order.map(Number);if(o.slice().sort().join(',')==='0,1,2,3')out.order=o;}
    if(typeof d.phi==='number'&&isFinite(d.phi))out.phi=((d.phi%360)+360)%360;
    if(typeof d.plays==='number'&&isFinite(d.plays))out.plays=clamp(Math.floor(d.plays),0,1e6);
    if(Array.isArray(d.memorials))for(const m of d.memorials.slice(0,4)){
      if(m&&typeof m.f==='string'&&m.f.indexOf('data:image/png;base64,')===0&&m.f.length<400000&&
         typeof m.b==='string'&&m.b.indexOf('data:image/png;base64,')===0&&m.b.length<400000)
        out.memorials.push({id:String(m.id||('m'+out.memorials.length)).slice(0,40),f:m.f,b:m.b});}
    return out;
  }catch(e){store.lastErr='parse';try{window.localStorage.removeItem(STORE_KEY);}catch(e2){}return null;}
}
function storeSave(obj){
  let o={v:1,order:obj.order.slice(),phi:obj.phi,plays:obj.plays,memorials:obj.memorials.slice(0,4)};
  for(let tries=0;tries<6;tries++){
    let s;try{s=JSON.stringify(o);}catch(e){store.ok=false;return false;}
    try{window.localStorage.setItem(STORE_KEY,s);store.ok=true;return true;}
    catch(e){store.lastErr='set';if(o.memorials.length>0){o.memorials=o.memorials.slice(0,o.memorials.length-1);}else{store.ok=false;return false;}}
  }
  store.ok=false;return false;
}

// =====================================================================
//  audio (Web Audio synthesis, started on first touch)
// =====================================================================
const AU={c:null,m:null,nb:null,slideG:null,slideF:null,ok:false};
function auInit(){
  try{
    if(AU.c){if(AU.c.state!=='running'&&AU.c.resume)AU.c.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const c=new AC(); AU.c=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.2;
    comp.connect(c.destination);
    AU.m=c.createGain(); AU.m.gain.value=0.9; AU.m.connect(comp);
    const len=Math.floor(c.sampleRate*1.0), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1; AU.nb=b;
    const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
    // continuous slide (band friction) voice
    const ns=c.createBufferSource(); ns.buffer=b; ns.loop=true;
    AU.slideF=c.createBiquadFilter(); AU.slideF.type='bandpass'; AU.slideF.frequency.value=700; AU.slideF.Q.value=0.8;
    AU.slideG=c.createGain(); AU.slideG.gain.value=0;
    ns.connect(AU.slideF); AU.slideF.connect(AU.slideG); AU.slideG.connect(AU.m); ns.start(0);
    if(c.resume)c.resume().catch(()=>{});
    AU.ok=true;
  }catch(e){AU.ok=false;}
}
function auT(){return AU.c?AU.c.currentTime:0;}
function auLive(){return AU.ok&&AU.c&&AU.c.state==='running';}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);}
function osc(type,f,t,a,peak,dur,f2,dest){
  if(!auLive())return; const c=AU.c,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+a+dur);
  env(g,t,a,peak,dur);o.connect(g);g.connect(dest||AU.m);o.start(t);o.stop(t+a+dur+0.05);
}
function nz(ft,f,q,t,a,peak,dur,f2,dest){
  if(!auLive())return; const c=AU.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.nb; fl.type=ft; fl.frequency.setValueAtTime(f,t); if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+a+dur); fl.Q.value=q;
  env(g,t,a,peak,dur); s.connect(fl);fl.connect(g);g.connect(dest||AU.m);
  const off=Math.random()*0.5; s.start(t,off); s.stop(t+a+dur+0.05);
}
function bell(f,t,peak,dur){osc('sine',f,t,0.004,peak,dur);osc('sine',f*2.76,t,0.002,peak*0.25,dur*0.45);osc('sine',f*5.4,t,0.002,peak*0.08,dur*0.2);}
const SND={
  mugyu(a){if(!auLive())return;const t=auT();a=clamp(a,0,1);

  kotsun(p){if(!auLive())return;const t=auT();p=p||1;
    osc('sine',880*p,t,0.002,0.22,0.09,820*p);osc('sine',2440*p,t,0.001,0.06,0.04);
    nz('highpass',3200,0.7,t,0.001,0.08,0.012);},
  tick(){if(!auLive())return;const t=auT();osc('sine',1700,t,0.001,0.045,0.025);nz('highpass',4000,0.7,t,0.001,0.03,0.008);},
  soft(){if(!auLive())return;const t=auT();osc('sine',420,t,0.002,0.06,0.06,380);},

    osc('sine',300,t,0.004,0.08,0.12,520);},
  slide(v){if(!auLive()||!AU.slideG||!isFinite(v))return;const t=auT();AU.slideG.gain.setTargetAtTime(clamp(v,0,1)*0.22,t,0.04);AU.slideF.frequency.setTargetAtTime(500+900*clamp(v,0,1),t,0.05);},
  bouquet(){if(!auLive())return;const t=auT();[784,988,1175,1568].forEach((f,i)=>bell(f,t+i*0.07,0.16,0.7));},
  hole(){if(!auLive())return;const t=auT();osc('sine',560,t,0.003,0.22,0.12,330);nz('bandpass',700,3,t,0.003,0.12,0.08);bell(1318,t+0.1,0.10,0.6);bell(1760,t+0.18,0.07,0.5);},
  ribbon(){if(!auLive())return;const t=auT();osc('triangle',660,t,0.02,0.10,0.35,990);bell(1320,t+0.18,0.12,0.7);bell(1980,t+0.26,0.06,0.5);},
  pick(){if(!auLive())return;const t=auT();const c=AU.c,o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sine';o.frequency.value=330;l.frequency.value=13;lg.gain.value=45;l.connect(lg);lg.connect(o.frequency);
    env(g,t,0.01,0.2,0.32);o.connect(g);g.connect(AU.m);o.start(t);l.start(t);o.stop(t+0.4);l.stop(t+0.4);
    nz('bandpass',900,2,t,0.005,0.08,0.1);},
  deposit(){if(!auLive())return;const t=auT();osc('sine',523,t,0.03,0.16,0.6);osc('sine',784,t+0.08,0.03,0.14,0.7);bell(1568,t+0.16,0.12,0.8);bell(2093,t+0.26,0.07,0.6);},
  unlock(){if(!auLive())return;const t=auT();[523,659,784,1047,1319].forEach((f,i)=>bell(f,t+i*0.09,0.15,0.9));nz('lowpass',300,0.7,t,0.3,0.10,0.6,1800);},
  whoosh(){if(!auLive())return;const t=auT();nz('bandpass',400,0.8,t,0.08,0.14,0.32,1600);},
  stand(){if(!auLive())return;const t=auT();bell(988,t,0.14,0.8);bell(1319,t+0.09,0.12,0.8);bell(1976,t+0.18,0.08,0.7);},
  complete(){if(!auLive())return;const t=auT();[523,659,784,1047,1319,1568,2093].forEach((f,i)=>bell(f,t+i*0.11,0.14,1.1));
    osc('triangle',262,t,0.2,0.07,1.6);osc('triangle',392,t+0.1,0.2,0.05,1.5);},
  call(){if(!auLive())return;const t=auT();osc('sine',1046,t,0.005,0.07,0.18);},
  paper(){if(!auLive())return;const t=auT();nz('highpass',1800,0.6,t,0.02,0.1,0.18);nz('bandpass',600,1,t+0.05,0.02,0.06,0.2);},
};

// =====================================================================
//  procedural textures (canvas 2D)
// =====================================================================
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function noiseFill(x,w,h,amt,mono){
  const id=x.getImageData(0,0,w,h),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(rnd()-0.5)*amt;d[i]=clamp(d[i]+n,0,255);d[i+1]=clamp(d[i+1]+n*(mono?1:0.9),0,255);d[i+2]=clamp(d[i+2]+n*(mono?1:0.8),0,255);}
  x.putImageData(id,0,0);
}
function texWalnut(N,base,light){
  const c=mkC(N,N),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,N,N);
  // broad colour bands
  for(let i=0;i<14;i++){const y0=rnd()*N,hh=40+rnd()*160;const g=x.createLinearGradient(0,y0-hh,0,y0+hh);

// ---- seedling stamp masks (white shape, alpha) ----------------------
const MW=128,MH=256;
function maskCtx(){const c=mkC(MW,MH),x=c.getContext('2d');
  x.setTransform(MW/L.markW,0,0,-MH/L.markH,MW/2,MH/2); // (s,t) units -> px, t up
  x.fillStyle='#fff';x.strokeStyle='#fff';x.lineCap='round';x.lineJoin='round';return {c,x};}
function leaf(x,cx,cy,len,wid,ang){x.save();x.translate(cx,cy);x.rotate(ang);x.beginPath();x.moveTo(-len/2,0);
  x.quadraticCurveTo(0,wid,len/2,0);x.quadraticCurveTo(0,-wid,-len/2,0);x.fill();x.restore();}
function stem(x,pts,w){x.lineWidth=w;x.beginPath();x.moveTo(pts[0],pts[1]);
  if(pts.length===6)x.quadraticCurveTo(pts[2],pts[3],pts[4],pts[5]);else x.bezierCurveTo(pts[2],pts[3],pts[4],pts[5],pts[6],pts[7]);x.stroke();}
function petals(x,cx,cy,n,rr,pr,rot){for(let i=0;i<n;i++){const a=rot+i/n*TAU;x.beginPath();x.ellipse(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,pr,pr*0.82,a,0,TAU);x.fill();}}
function makeMasks(){
  const out=[];
  { // 0 sprout (双葉)
    const {c,x}=maskCtx(); stem(x,[0,-0.66,-0.05,-0.2,0.02,0.24],0.11);
    leaf(x,-0.18,0.36,0.4,0.22,0.45); leaf(x,0.18,0.36,0.4,0.22,-0.45);
    x.beginPath();x.arc(0,0.27,0.05,0,TAU);x.fill(); out.push(c);}
  { // 1 bud
    const {c,x}=maskCtx(); stem(x,[0,-0.66,0.06,-0.15,-0.03,0.36],0.1);
    leaf(x,-0.16,-0.2,0.34,0.17,0.7); leaf(x,0.16,-0.02,0.34,0.17,-0.6);
    x.beginPath();x.moveTo(0,0.68);x.bezierCurveTo(0.21,0.5,0.17,0.32,0,0.3);x.bezierCurveTo(-0.17,0.32,-0.21,0.5,0,0.68);x.fill();
    leaf(x,-0.07,0.34,0.14,0.07,0.6);leaf(x,0.07,0.34,0.14,0.07,-0.6); out.push(c);}
  { // 2 bloom
    const {c,x}=maskCtx(); stem(x,[0,-0.66,-0.07,-0.1,0.01,0.3],0.1);
    leaf(x,-0.17,-0.25,0.36,0.18,0.55); leaf(x,0.13,-0.02,0.28,0.14,-0.5);

    const {c,x}=maskCtx(); stem(x,[0,-0.66,0.03,-0.3,0,0.02],0.1);
    stem(x,[0,0.0,-0.08,0.16,-0.18,0.4],0.08); stem(x,[0,0.0,0.12,0.1,0.2,0.3],0.08);
    leaf(x,-0.15,-0.28,0.32,0.16,0.6); leaf(x,0.15,-0.16,0.3,0.15,-0.55);

}

// =====================================================================
//  ink surfaces + printing operations
// =====================================================================
const SF={};
function mkSurf(name,N,M,k,kind){const c=mkC(N,M);return {name,c,x:c.getContext('2d'),N,M,k,kind,dirty:true,tex:null,ver:0};}
function initSurfaces(){
  const kT=512/(2*L.Rp+0.06), kP=512/(L.bx1-L.bx0);
  SF.topF=mkSurf('topF',512,512,kT,'top'); SF.topB=mkSurf('topB',512,512,kT,'top');
  SF.far=mkSurf('far',512,512,kP,'far'); SF.near=mkSurf('near',512,512,kP,'near');
  SF.rub=mkSurf('rub',256,256,256/L.trW,'rub');
}
// world plan point -> surface px
function topLocal(x,z,mode,phi){const fz=mode==='B'?-z:z,dx=x-L.S[0],dz=fz-L.S[1],c=Math.cos(phi*DEG),s=Math.sin(phi*DEG);return [dx*c+dz*s,-dx*s+dz*c];}
function topWorld(u,v,mode,phi){const c=Math.cos(phi*DEG),s=Math.sin(phi*DEG),fx=L.S[0]+u*c-v*s,fz=L.S[1]+u*s+v*c;return [fx,mode==='B'?-fz:fz];}
function mapper(surf,mode,phi){
  if(surf.kind==='top'){const k=surf.k,h=surf.N/2;return (W)=>{const l=topLocal(W[0],W[1],mode,phi);return [l[0]*k+h,l[1]*k+h];};}
  if(surf.kind==='far'){const k=surf.k;return (W)=>[(W[0]-L.bx0)*k,(W[1]-L.bz0)*k];}
  if(surf.kind==='near'){const k=surf.k;return (W)=>[(W[0]-L.bx0)*k,(W[1])*k];}
  return null;
}
function aff3(p0,p1,p2,iw,ih){return [(p1[0]-p0[0])/iw,(p1[1]-p0[1])/iw,(p2[0]-p0[0])/ih,(p2[1]-p0[1])/ih,p0[0],p0[1]];}
function affInv(m){const a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],det=a*d-b*c||1e-9;
  return [d/det,-b/det,-c/det,a/det,(c*f-d*e)/det,(b*e-a*f)/det];}
// oriented rect corners in world plan for an image covering (w x h) centred at C with up direction angle upDeg
function rectW(C,upDeg,w,h){const ut=[Math.cos(upDeg*DEG),Math.sin(upDeg*DEG)],us=[-ut[1],ut[0]];
  const W0=[C[0]-us[0]*w/2+ut[0]*h/2,C[1]-us[1]*w/2+ut[1]*h/2];
  return {W0,W1:[W0[0]+us[0]*w,W0[1]+us[1]*w],W2:[W0[0]-ut[0]*h,W0[1]-ut[1]*h],ut,us};}
function holeClip(x,mapW,mode,phi,k,pad){for(const h of L.holes){const w=topWorld(h.u,h.v,mode,phi),p=mapW(w);x.moveTo(p[0]+h.r*k+pad,p[1]);x.arc(p[0],p[1],h.r*k+pad,0,TAU);}}
function clearHoles(surf){const x=surf.x;x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-out';x.beginPath();
  for(const h of L.holes){const px=h.u*surf.k+surf.N/2,py=h.v*surf.k+surf.N/2;x.moveTo(px+h.r*surf.k+1,py);x.arc(px,py,h.r*surf.k+1,0,TAU);}x.fill();x.restore();}
function drawImgOn(surf,mapW,img,R,alpha,op,clip){
  const x=surf.x,iw=img.width,ih=img.height,m=aff3(mapW(R.W0),mapW(R.W1),mapW(R.W2),iw,ih);
  x.save();
  if(clip){x.setTransform(1,0,0,1,0,0);x.beginPath();clip(x);x.clip();}
  x.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);x.globalAlpha=clamp(alpha,0,1);x.globalCompositeOperation=op||'source-over';
  x.drawImage(img,0,0);x.restore();surf.dirty=true;
}
// paint an image onto the stack under a station (top paper with holes + lower layer)
// returns {top:bool, under:bool(through hole or direct)}
function paintStack(stack,img,C,upDeg,w,h,alpha,phi){
  const R=rectW(C,upDeg,w,h),res={top:false,under:false,hole:false};
  if(stack.top){
    const mt=mapper(stack.top,stack.mode,phi);
    drawImgOn(stack.top,mt,img,R,alpha);clearHoles(stack.top);res.top=true;
    // lower layer only through holes: test hole proximity
    const mu=mapper(stack.under,null,phi);
    let near=false;for(const hh of L.holes){const wp=topWorld(hh.u,hh.v,stack.mode,phi),d=Math.hypot(wp[0]-C[0],wp[1]-C[1]);if(d<hh.r+Math.max(w,h)*0.55)near=true;}
    if(near){drawImgOn(stack.under,mu,img,R,alpha,null,(x)=>holeClip(x,mu,stack.mode,phi,stack.under.k,0));res.hole=true;res.under=true;}
  }else{
    const mu=mapper(stack.under,null,phi);drawImgOn(stack.under,mu,img,R,alpha);res.under=true;
  }
  return res;
}
// fraction of mark footprint already inked (for bouquet detection)
const probeC=mkC(24,24),probeX=probeC.getContext('2d',{willReadFrequently:true});
function coverageAt(surf,mapW,C,upDeg,w,h){
  const R=rectW(C,upDeg,w,h),m=aff3(mapW(R.W0),mapW(R.W1),mapW(R.W2),24,24),inv=affInv(m);
  probeX.setTransform(1,0,0,1,0,0);probeX.clearRect(0,0,24,24);
  probeX.setTransform(inv[0],inv[1],inv[2],inv[3],inv[4],inv[5]);probeX.drawImage(surf.c,0,0);
  probeX.setTransform(1,0,0,1,0,0);
  const d=probeX.getImageData(0,0,24,24).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>50)n++;return n/576;
}
const covC=mkC(32,32),covX=covC.getContext('2d',{willReadFrequently:true});
function coverage(surf){covX.setTransform(1,0,0,1,0,0);covX.clearRect(0,0,32,32);covX.drawImage(surf.c,0,0,32,32);
  const d=covX.getImageData(0,0,32,32).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return s/(255*1024);}

// tinted mark image (with speckle so that every print differs slightly)
const tintC=mkC(MW,MH),tintX=tintC.getContext('2d');
let SPECK=null,MASKS=null;
function tintMark(type,colA,colB){
  const x=tintX;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.clearRect(0,0,MW,MH);
  if(colA===colB){x.fillStyle=colA;}else{const g=x.createLinearGradient(MW*0.25,0,MW*0.75,0);g.addColorStop(0,colA);g.addColorStop(1,colB);x.fillStyle=g;}
  x.fillRect(0,0,MW,MH);
  x.globalCompositeOperation='destination-in';x.drawImage(MASKS[type],0,0);
  x.globalCompositeOperation='destination-out';x.globalAlpha=0.3;x.drawImage(SPECK,-rnd()*120,-rnd()*240,256,512);
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  return tintC;
}
// band brush (soft-edged bar), tinted per colour (cached)
const brushCache={};
function brushImg(col){
  if(brushCache[col])return brushCache[col];
  const c=mkC(64,16),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,64,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.12,col);g.addColorStop(0.88,col);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,64,16);
  x.globalCompositeOperation='destination-out';x.globalAlpha=0.35;x.drawImage(SPECK,-rnd()*100,-rnd()*100);
  brushCache[col]=c;return c;
}
// ---------- transfer rubber ----------
function rubRect(C,upDeg){return rectW(C,upDeg,L.trW,L.trW);}
function rubLocalPx(C,upDeg){ // world -> rubber px
  const ut=[Math.cos(upDeg*DEG),Math.sin(upDeg*DEG)],us=[-ut[1],ut[0]],k=SF.rub.k,h=SF.rub.N/2;
  return (W)=>{const dx=W[0]-C[0],dz=W[1]-C[1];return [(dx*us[0]+dz*us[1])*k+h,h-(dx*ut[0]+dz*ut[1])*k];};}
function roundRectPath(x,X,Y,w,h,r){x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function pickStack(stack,C,upDeg,phi,strength){
  const Rb=SF.rub,N=Rb.N,R=rubRect(C,upDeg),toR=rubLocalPx(C,upDeg);
  const layers=[];
  layers.push({s:stack.under,map:mapper(stack.under,null,phi),holesOnly:!!stack.top});
  if(stack.top)layers.push({s:stack.top,map:mapper(stack.top,stack.mode,phi),holesOnly:false});
  const before=coverage(Rb);
  for(const ly of layers){
    const A=aff3(ly.map(R.W0),ly.map(R.W1),ly.map(R.W2),N,N),B=affInv(A);
    const x=Rb.x;x.save();x.setTransform(1,0,0,1,0,0);x.beginPath();
    if(ly.holesOnly)holeClip(x,toR,stack.mode,phi,Rb.k,0);else roundRectPath(x,2,2,N-4,N-4,26);
    x.clip();x.setTransform(B[0],B[1],B[2],B[3],B[4],B[5]);x.globalAlpha=strength;x.drawImage(ly.s.c,0,0);x.restore();
    // paper keeps part of its ink
    const y=ly.s.x;y.save();
    if(ly.holesOnly){y.setTransform(1,0,0,1,0,0);y.beginPath();holeClip(y,ly.map,stack.mode,phi,ly.s.k,0);y.clip();}
    y.setTransform(A[0],A[1],A[2],A[3],A[4],A[5]);y.globalCompositeOperation='destination-out';y.globalAlpha=0.45*strength;
    y.beginPath();roundRectPath(y,2,2,N-4,N-4,26);y.fill();y.restore();ly.s.dirty=true;
  }
  Rb.dirty=true;
  return coverage(Rb)-before;
}
function depositStack(stack,C,upDeg,phi,strength){
  const Rb=SF.rub,N=Rb.N,R=rubRect(C,upDeg),amt=coverage(Rb);
  if(amt<0.002)return 0;
  if(stack.top){const mt=mapper(stack.top,stack.mode,phi);drawImgOn(stack.top,mt,Rb.c,R,0.82*strength);clearHoles(stack.top);
    const mu=mapper(stack.under,null,phi);drawImgOn(stack.under,mu,Rb.c,R,0.82*strength,null,(x)=>holeClip(x,mu,stack.mode,phi,stack.under.k,0));}

function partsUpdate(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
  if(!q.add){q.v[1]-=7.5*dt;}else{q.v[1]-=0.4*dt;}q.p[0]+=q.v[0]*dt;q.p[1]+=q.v[1]*dt;q.p[2]+=q.v[2]*dt;if(!q.add&&q.p[1]<0.45){q.p[1]=0.45;q.v[0]*=0.5;q.v[2]*=0.5;q.v[1]=0;}}}

// =====================================================================
//  stations / kinematics
// =====================================================================
function stationOpen(s){
  if(st.sendAside)return false;
  if(s==='P')return !(st.beta>=6&&st.beta<=55);
  return st.unlocked&&st.cover<0.5&&!(st.beta>125&&st.beta<172);
}
function surfY(s){if(s==='P')return st.beta<6?L.paperY:L.pageY;return st.beta>=172?(2*L.hingeY-L.paperY):L.pageY;}
function stackAt(s){
  if(s==='P'){if(st.beta<6)return {top:SF.topF,mode:'F',under:SF.far};return {top:null,mode:null,under:SF.far};}
  if(!st.unlocked||st.cover>0.5)return null;
  if(st.beta>=172)return {top:SF.topB,mode:'B',under:SF.near};
  return {top:null,mode:null,under:SF.near};
}
function seatKin(s,rel){
  const ret=smooth(-64,-50,rel)*(1-smooth(-24,-12,rel));
  let r=lerp(L.Ra,L.padR,ret);
  const dip=bump(rel,-37,6.5);
  let y=lerp(L.yLift,L.yLift+0.3,ret);
  y=lerp(y,L.padTop-0.04,dip);
  if(st.beta>8&&st.beta<172){const fr=smooth(3,11,rel)*(1-smooth(30,40,rel));r=lerp(r,2.3,fr);y+=fr*0.45;}
  let pullP=0,pen=0;
  if(stationOpen('P')){const ar=Math.abs(rel);pullP=1-smooth(5,14,ar);const ys=surfY('P');
    const h=(L.yLift-ys)*smooth(5.5,14,ar),pc=Math.max(0,1-ar/5.5)*0.10+st.sink*0.095*Math.max(0,1-ar/12);
    if(ar<16)y=lerp(y,ys+h-pc,1-smooth(12,16,ar));pen=Math.max(0,ys-y);}
  let pullQ=0,penQ=0;
  if(st.beta>=172&&stationOpen('Q')){const ar=Math.abs(rel-44);pullQ=1-smooth(5,14,ar);const ys=surfY('Q');
    const h=(L.yLift-ys)*smooth(5.5,14,ar),pc=Math.max(0,1-ar/5.5)*0.10+st.sink*0.095*Math.max(0,1-ar/12);
    if(ar<16)y=lerp(y,ys+h-pc,1-smooth(12,16,ar));penQ=Math.max(0,ys-y);}
  y-=st.sink*0.04*(1-Math.max(pullP,pullQ));
  if(s.ext<1){r=lerp(1.35,r,s.ext);y=lerp(L.discTop+0.25,y,s.ext);pen=s.ext<0.98?0:pen;penQ=s.ext<0.98?0:penQ;pullP*=s.ext;pullQ*=s.ext;}
  return {r,y,dip:s.ext<0.98?0:dip,pullP,pen,pullQ,penQ};
}
function trKin(rel){
  const tr=st.tr;let r=L.Ra,y=L.yLift+0.08,pullP=0,pullQ=0,penP=0,penQ=0;
  if(st.beta>8&&st.beta<172){const fr=smooth(3,11,rel)*(1-smooth(33,41,rel));r=lerp(r,2.3,fr);y+=fr*0.7;}
  if(stationOpen('P')){const ar=Math.abs(rel);pullP=1-smooth(5,14,ar);const ys=surfY('P');const h=(L.yLift-ys)*smooth(5.5,14,ar),pc=Math.max(0,1-ar/5.5)*0.09;
    if(ar<16)y=lerp(y,ys+h-pc,1-smooth(12,16,ar));penP=Math.max(0,ys-y);}
  if(stationOpen('Q')){const ar=Math.abs(rel-44);pullQ=1-smooth(5,14,ar);const ys=surfY('Q');const h=(L.yLift-ys)*smooth(5.5,14,ar),pc=Math.max(0,1-ar/5.5)*0.09;
    if(ar<16)y=lerp(y,ys+h-pc,1-smooth(12,16,ar));penQ=Math.max(0,ys-y);}
  const tilt=bump(rel,19,11)+bump(rel,64,12);
  y+=tilt*0.75;
  if(tr.ext<1){r=lerp(0.6,r,tr.ext);y=lerp(2.4,y,tr.ext);penP=penQ=0;pullP*=tr.ext;pullQ*=tr.ext;}
  return {r,y,pullP,pullQ,penP,penQ,tilt};

const upP=L.aPS; // stamp up direction at P
const upQ=L.aQ+L.mount; // stamp up direction at Q (folded-over back)
L.aQS=Math.atan2(L.Q[1]+L.S[1],L.Q[0]-L.S[0])/DEG;
function canEmerge(k){
  if(k===1)return st.seats[0].prints>=1;
  if(k===2)return st.prints>=4;
  if(k===3)return (st.prints>=7&&(st.f.d1||st.f.d2))||st.prints>=16;
  return false;
}
function emerge(s){
  s.emerged=true;SND.kotsun(0.8);setTimeout(()=>SND.kotsun(1.15),140);logEv('emerge'+s.k);
  tlAdd(0,0.45,(u)=>{s.out=easeOut(u);});tlAdd(0.15,0.6,(u)=>{s.ext=easeOut(u);},()=>{s.ext=1;});
  const a=(st.th+s.off)*DEG;sparkle(L.D[0]+Math.cos(a)*3.2,1.3,L.D[1]+Math.sin(a)*3.2,6,0.5);
}
// --------------------------------------------------------------------
function armsUpdate(dth){
  for(const s of st.seats){
    const rel=wrap(st.th+s.off-L.aP);
    if(!s.emerged){
      if(s.relPrev!==null&&dth>0&&s.relPrev<-100&&rel>=-100&&rel-s.relPrev<40&&canEmerge(s.k))emerge(s);
      s.relPrev=rel;continue;}
    const k=seatKin(s,rel);s.dip=k.dip;
    if(k.dip>0.55&&!s.padIn){s.padIn=true;s.ink=1;SND.mugyu(0.4+0.6*k.dip);
      const a=(st.th+s.off)*DEG;inkSplash(L.D[0]+Math.cos(a)*L.padR,L.padTop+0.05,L.D[1]+Math.sin(a)*L.padR,INK[s.type].a,2);}
    if(k.dip<0.2)s.padIn=false;
    s.pen=k.pen;s.penQ=k.penQ;
    if(k.pen>0.0004){
      if(!s.inP){s.inP=true;s.phiRef=st.phi;s.printed=false;s.band=0;}
      if(!s.printed&&k.pen>0.055){doPrint(s,k.pen);s.printed=true;}
    }else if(s.inP){s.inP=false;contactEnd(s,'P');}
    if(k.penQ>0.0004){
      if(!s.inQ){s.inQ=true;s.phiRef=st.phi;s.printedQ=false;s.band=0;}
      if(!s.printedQ&&k.penQ>0.055){doPrint(s,k.penQ,'Q');s.printedQ=true;}
    }else if(s.inQ){s.inQ=false;contactEnd(s,'Q');}
    // ratchet feed (only forward motion, flap down)
    const p=clamp((rel-12)/22,0,1);
    if(s.feedP!==null&&s.ext>=1&&p>s.feedP&&dth>0&&st.beta<4&&!st.sendAside&&s.relPrev!==null&&Math.abs(rel-s.relPrev)<40)paperRotate((p-s.feedP)*L.feed,'feed');
    s.feedP=p;s.relPrev=rel;
  }
  const tr=st.tr;
  if(tr.emerged){
    const rel=wrap(st.th+L.trOff-L.aP),k=trKin(rel);
    if(k.penP>0.0004){if(!tr.inP){tr.inP=true;tr.picked=false;tr.dragAcc=0;}if(!tr.picked&&k.penP>0.05){doPick(1);tr.picked=true;}}
    else if(tr.inP){tr.inP=false;}
    if(k.penQ>0.0004){if(!tr.inQ){tr.inQ=true;tr.dep=false;tr.dragAcc=0;}if(!tr.dep&&k.penQ>0.05){doDeposit(1);tr.dep=true;}}
    else if(tr.inQ){tr.inQ=false;}
    tr.relPrev=rel;
  }
}
function doPrint(s,pen,station){
  station=station||'P';const C=station==='P'?L.P:L.Q,up=station==='P'?upP:upQ;
  const stack=stackAt(station);if(!stack)return;
  const col=INK[s.type],img=tintMark(s.type,col.a,col.b),pn=clamp(pen/0.1,0,1);
  const alpha=clamp(s.ink*(0.7+0.3*pn)+0.1,0.3,1);
  let cov=0;if(stack.top)cov=coverageAt(stack.top,mapper(stack.top,stack.mode,st.phi),C,up,L.markW*0.8,L.markH*0.8);
  else cov=coverageAt(stack.under,mapper(stack.under,null,st.phi),C,up,L.markW*0.8,L.markH*0.8);
  const res=paintStack(stack,img,C,up,L.markW,L.markH,alpha,st.phi);
  if(station==='Q'&&stack.top){st.cyc.back=true;}
  s.ink=Math.max(0.3,s.ink*0.8);s.prints++;st.prints++;st.cyc.prints++;st.typeCount[s.type]++;
  SND.peta(pn);inkSplash(C[0],surfY(station),C[1],col.a,4);
  st.f.first=true;logEv('print'+s.k+station+(stack.top?'T':'U')+' cov'+cov.toFixed(2));
  // success kinds
  if(res.hole){let best=9;for(const h of L.holes){const w=topWorld(h.u,h.v,stack.mode,st.phi);best=Math.min(best,Math.hypot(w[0]-C[0],w[1]-C[1])-h.r);}
    if(best<0.45){st.f.d4=true;SND.hole();const w=nearestHole(stack.mode,C);sparkle(w[0],L.pageY+0.2,w[1],7,0.35,[1,0.95,0.75]);logEv('hole');}}
  if(cov>0.04&&st.f.turnSincePrint>4){st.f.d1=true;setTimeout(()=>SND.bouquet(),60);sparkle(C[0],surfY(station)+0.3,C[1],8,0.7);logEv('bouquet');}
  st.f.turnSincePrint=0;
  if(s.k===3&&!st.unlocked)unlock();
}
function nearestHole(mode,C){let best=null,bd=1e9;for(const h of L.holes){const w=topWorld(h.u,h.v,mode,st.phi),d=Math.hypot(w[0]-C[0],w[1]-C[1]);if(d<bd){bd=d;best=w;}}return best;}
function contactEnd(s,station){
  const C=station==='Q'?L.Q:L.P;
  if(Math.abs(s.tw)>2||s.band>0.05)SND.peel();
  if(s.band>0.45){st.f.d2=true;SND.ribbon();sparkle(C[0],L.paperY+0.3,C[1],6,0.6,[1,0.9,0.7]);logEv('ribbon'+s.band.toFixed(2));}
  s.twV=0;s.band=0;
}
function stampDrag(s,station){
  station=station||'P';const C=station==='P'?L.P:L.Q,bandUp=station==='P'?L.aPS+90:L.aQS+90;
  const rel=st.phi-s.phiRef;
  if(Math.abs(rel)<=L.TW){s.tw=rel;return;}
  const sg=sgn(rel);s.phiRef=st.phi-sg*L.TW;s.tw=sg*L.TW;
  const stack=stackAt(station);if(!stack)return;
  const step=Math.abs(rel-sg*L.TW)*DEG*L.dPS;s.band+=step;s.bandS+=step;
  const w=L.markH*0.62*(0.22+0.78*Math.abs(Math.cos(s.bandS*3.0+s.bandPh)));
  const ink=INK[s.type],col=(ink.a===ink.b||Math.sin(s.bandS*5)>0)?ink.a:ink.b;
  const alpha=clamp(s.ink,0.12,1)*0.85;
  paintStack(stack,brushImg(col),C,bandUp,w,Math.max(step*1.8,0.05),alpha,st.phi);
  s.ink=Math.max(0.14,s.ink-step*0.05);
  st.bandSnd=1;
}
function paperRotate(d,src){
  if(!d)return;
  const n=Math.max(1,Math.ceil(Math.abs(d)/1.2));
  for(let i=0;i<n;i++){
    st.phi+=d/n;
    if(st.beta<6){for(const s of st.seats)if(s.emerged&&s.inP)stampDrag(s,'P');}
    if(st.beta>=172){for(const s of st.seats)if(s.emerged&&s.inQ)stampDrag(s,'Q');}
    const tr=st.tr;
    if(tr.inP&&st.beta<6){tr.dragAcc+=Math.abs(d/n);if(tr.dragAcc>4){tr.dragAcc=0;doPick(0.3);}}
    if(tr.inQ&&st.beta>=172){tr.dragAcc+=Math.abs(d/n);if(tr.dragAcc>4){tr.dragAcc=0;doDeposit(0.3);}}
  }
  if(st.beta<4)st.gearA-=d*(L.trackOut/L.Gr);
  if(src==='feed'){st._feedTick=(st._feedTick||0)+Math.abs(d);if(st._feedTick>6){st._feedTick=0;SND.tick();}}
  else{st.f.userTurn+=Math.abs(d);st.f.turnSincePrint+=Math.abs(d);}
}
function doPick(strength){
  const stack=stackAt('P');if(!stack)return;
  const got=pickStack(stack,L.P,L.aP,st.phi,strength);
  if(strength>=1){if(got>0.004){SND.pick();st.tr.glow=1;logEv('pick'+got.toFixed(3));}else SND.mugyu(0.2);}
}
function doDeposit(strength){
  const stack=stackAt('Q');if(!stack)return;
  const amt=depositStack(stack,L.Q,L.aQ,st.phi,strength);
  if(strength>=1){
    if(amt>0.004){SND.deposit();sparkle(L.Q[0],surfY('Q')+0.3,L.Q[1],10,0.9);st.f.d3=true;st.cyc.trans=true;
      if(stack.top)st.cyc.back=true;logEv('deposit'+(stack.top?'B':'N')+amt.toFixed(3));}
    else SND.mugyu(0.15);
  }
}

function captureMemorial(){
  const N=256,mk=(src)=>{const c=mkC(N,N),x=c.getContext('2d');
    x.save();x.beginPath();x.arc(N/2,N/2,N/2*L.Rp/(L.Rp+0.03),0,TAU);x.clip();x.drawImage(src.c,0,0,src.N,src.N,0,0,N,N);x.restore();

  const cf=mk(SF.topF),cb=mk(SF.topB),id='m'+Date.now().toString(36)+st.cyc.id;

  let f=null,b=null;try{f=cf.toDataURL('image/png');b=cb.toDataURL('image/png');}catch(e){}

}
function addMemorial(cap,replaceId,visual){
  if(visual!==false){const i=replaceId?memorials.findIndex(q=>q.id===replaceId):-1;
    if(i>=0)memorials[i]=cap.m;else{memorials.unshift(cap.m);if(memorials.length>4)memorials.pop();}}
  if(cap.f&&cap.b){const j=persist.memorials.findIndex(q=>q.id===cap.m.id);const e={id:cap.m.id,f:cap.f,b:cap.b};
    if(j>=0)persist.memorials[j]=e;else{persist.memorials.unshift(e);persist.memorials=persist.memorials.slice(0,4);}}
  persistNow();
}
function complete(){
  st.cyc.done=true;st.f.d5=true;SND.complete();logEv('complete');
  const fp=flapPaperCenter();sparkle(fp[0],fp[1],fp[2],16,2.0);
  st.cyc.cap=captureMemorial();st.cyc.after=0;
  // drop the in-progress snapshot of this page and store the finished one right away

  addMemorial(st.cyc.cap,null,false);
  st.busy=2.8;st.glowStand=1;
  const b0=st.beta;tlAdd(0.5,1.0,(u)=>{st.beta=lerp(b0,155,easeIO(u));});

}
function sendAside(){

  st.fly={u:0,from:paperModel(),cap,b0:st.beta};
  tlAdd(0,1.25,(u)=>{st.fly.u=easeIO(u);},()=>{if(st.cyc.cap===cap){memorials.unshift(cap.m);if(memorials.length>4)memorials.pop();}else addMemorial(cap,null);st.fly=null;SND.kotsun(0.75);});
  tlAdd(0.05,0.01,null,()=>{for(const s of [SF.topF,SF.topB]){s.x.setTransform(1,0,0,1,0,0);s.x.clearRect(0,0,s.N,s.M);s.dirty=true;}st.newPaper=1;});
  tlAdd(0.3,0.9,(u)=>{st.beta=lerp(st.fly?st.fly.b0:st.beta,0,easeIO(u));},()=>{st.beta=0;});
  tlAdd(0.5,0.6,(u)=>{st.newPaper=1-easeOut(u);},()=>{st.newPaper=0;SND.paper();});
  tlAdd(0.4,0.7,(u)=>{for(const s of [SF.far,SF.near]){s.x.save();s.x.setTransform(1,0,0,1,0,0);s.x.globalCompositeOperation='destination-out';s.x.globalAlpha=0.22;s.x.fillRect(0,0,s.N,s.M);s.x.restore();s.dirty=true;}},
    ()=>{for(const s of [SF.far,SF.near]){s.x.setTransform(1,0,0,1,0,0);s.x.clearRect(0,0,s.N,s.M);s.dirty=true;}});

}

function camAt(target,dist,el,az,asp,fov){
  const eye=[target[0]+dist*Math.cos(el)*Math.sin(az),target[1]+dist*Math.sin(el),target[2]+dist*Math.cos(el)*Math.cos(az)];
  const view=M4.look(eye,target,[0,1,0]),proj=M4.persp(fov,asp,0.5,200);return {eye,view,proj,vp:M4.mul(proj,view)};

function fitPts(){
  const p=[];
  for(let i=0;i<20;i++){const a=i/20*TAU;p.push([L.D[0]+Math.cos(a)*3.9,1.3,L.D[1]+Math.sin(a)*3.9]);}
  for(let a=-75;a<=75;a+=15)p.push([L.D[0]+Math.cos(a*DEG)*(L.Ra+0.75),1.9,L.D[1]+Math.sin(a*DEG)*(L.Ra+0.75)]);
  p.push([L.bx0-0.25,0.1,L.bz0-0.25],[L.bx1+0.25,0.1,L.bz0-0.25],[L.bx0-0.25,0.1,L.bz1+0.25],[L.bx1+0.25,0.1,L.bz1+0.25],[L.K[0]+L.Kr+0.1,0.7,0]);
  p.push([L.S[0]-2.85,6.0,1.0],[L.S[0]+2.85,6.0,1.0]);
  const side=[LAY.sample].concat(LAY.mem.slice(0,LAY.portrait?4:3));

function fitCamera(){
  const W=LAY.W,H=LAY.H,asp=W/H,fov=30*DEG,sa=LAY.sa;

  const mx=LAY.portrait?0.012:0.025,mL=(sa[3]+W*mx)/W*2,mR=(sa[1]+W*mx)/W*2,mT=(sa[0]+H*0.03)/H*2,mB=(sa[2]+H*0.03)/H*2;
  const pts=fitPts();let target=[0.2,0,0.3],dist=40,cam=null;
  for(let it=0;it<4;it++){
    let lo=5,hi=200;
    for(let k=0;k<30;k++){const mid=(lo+hi)/2;const c=camAt(target,mid,el,az,asp,fov);let ok=true;
      for(const q of pts){const r=M4.xf(c.vp,q);if(r[3]<=0.1){ok=false;break;}const x=r[0]/r[3],y=r[1]/r[3];
        if(x<-1+mL||x>1-mR||y<-1+mB||y>1-mT){ok=false;break;}}
      if(ok)hi=mid;else lo=mid;}
    dist=hi;cam=camAt(target,dist,el,az,asp,fov);
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of pts){const r=M4.xf(cam.vp,q),x=r[0]/r[3],y=r[1]/r[3];x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
    const cx=(x0+x1)/2-((-1+mL)+(1-mR))/2,cy=(y0+y1)/2-((-1+mB)+(1-mT))/2;
    const th=Math.tan(fov/2)*dist,R=[cam.view[0],cam.view[4],cam.view[8]],U=[cam.view[1],cam.view[5],cam.view[9]];
    target=V3.add(target,V3.add(V3.sc(R,cx*th*asp),V3.sc(U,cy*th)));

  cam=camAt(target,dist,el,az,asp,fov);

  // light (fixed lamp)

  try{render();}catch(err){st._errR=String(err&&err.message||err);}
  if(st._downT&&!st._downFrameT)st._downFrameT=performance.now();
  try{overlayUpdate();}catch(err){st._errO=String(err&&err.message||err);}
  // adaptive resolution (keeps 60fps on older iPads)
  perfAcc+=dt;perfN++;perfCool-=dt;
  if(perfN>=60){const avg=perfAcc/perfN;perfAcc=0;perfN=0;
    if(perfCool<=0){if(avg>0.021&&renderScale>0.6){renderScale=Math.max(0.6,renderScale-0.1);resize();perfCool=2;}
      else if(avg<0.0145&&renderScale<1){renderScale=Math.min(1,renderScale+0.1);resize();perfCool=3;}}}
}
function start(){if(running)return;running=true;lastT=0;rafId=requestAnimationFrame(frame);}
function stop(){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();saveWork();try{if(AU.c&&AU.c.suspend)AU.c.suspend().catch(()=>{});}catch(e){}}
  else{try{if(AU.c&&AU.c.resume)AU.c.resume().catch(()=>{});}catch(e){}start();}
});
window.addEventListener('pagehide',()=>saveWork());
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>{setTimeout(resize,120);});
function saveWork(){
  // keep the work in progress as "previous memorial page" when the paper has ink
  try{if(!st.cyc.done&&coverage(SF.topF)>0.01&&!st.sendAside){const cap=captureMemorial();cap.m.id='w'+st.cyc.id+'_'+(persist.plays||0);addMemorial(cap,cap.m.id);}else persistNow();}catch(e){}
}
function loadMemorials(){
  for(const m of persist.memorials){const rec={id:m.id,cf:null,cb:null,texF:null,texB:null};memorials.push(rec);
    let n=0;const fin=()=>{n++;if(n===2&&glOK){try{rec.texF=texFrom(rec.cf,false,true);rec.texB=texFrom(rec.cb,false,true);}catch(e){}}};
    const ld=(src,key)=>{const im=new Image();im.onload=()=>{const c=mkC(256,256);c.getContext('2d').drawImage(im,0,0,256,256);rec[key]=c;fin();};im.onerror=()=>{const i=memorials.indexOf(rec);if(i>=0)memorials.splice(i,1);};im.src=src;};
    ld(m.f,'cf');ld(m.b,'cb');}
}
function boot(){
  seedR=(Date.now()&0xffff)+7;
  SPECK=texSpeck(256);MASKS=makeMasks();
  seedR=4242;
  IMG.desk=texWalnut(1024,'#4c2d19','150,98,60');IMG.disc=texTurned(512);IMG.paper=texPaper(512);
  IMG.cloth=texCloth(256,'#2c4b38');IMG.cover=texCover(512);IMG.felt=texFelt(128);IMG.stripe=texStripes(128);IMG.spr=texSprite(64);
  IMG.white=mkC(4,4);{const x=IMG.white.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,4,4);}
  const smp=sampleImages();IMG.sampleF=smp.f;IMG.sampleB=smp.b;
  seedR=(Date.now()&0xffff)+99;
  initSurfaces();buildMeshes();loadMemorials();
  resize();
  if(glInit())buildMats();
  start();
}
// test / inspection hook (no UI)
window.__kk={st,L,G,SF,store,persist,memorials,get frame(){return frameNo;},get glOK(){return glOK;},
  screen(name){if(name==='ring')return toScreen(handleWorld());if(name==='paper')return toScreen(pknobWorld());if(name==='book'){const k=bknobWorld();return toScreen([k[0],k[1]+0.4,k[2]]);}
    if(name==='D')return toScreen([L.D[0],L.discTop+0.45,L.D[1]]);if(name==='S')return toScreen(flapPaperCenter());if(name==='K'){const k=bknobWorld();return toScreen([k[0],k[1]+0.4,k[2]]);}return null;},
  coverage:(n)=>coverage(SF[n]),toScreen,hitTest};
boot();
})();
