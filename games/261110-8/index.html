const PI=Math.PI, TAU=PI*2;

function rnd(){seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}

/* ---------------- mat4 (column major) ---------------- */
const T16=new Float32Array(16);
const M4={
  create(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  ident(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;},
  copy(o,a){o.set(a);return o;},
  mul(o,a,b){const r=T16;for(let i=0;i<4;i++){const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
      r[i*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;r[i*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;

    o.set(r);return o;},
  persp(o,fovy,asp,n,f){const t=1/Math.tan(fovy/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  lookAt(o,ex,ey,ez,tx,ty,tz){let fx=ex-tx,fy=ey-ty,fz=ez-tz;let l=Math.hypot(fx,fy,fz)||1;fx/=l;fy/=l;fz/=l;
    let rx=fz,ry=0,rz=-fx;l=Math.hypot(rx,rz)||1;rx/=l;rz/=l;
    const ux=fy*rz-fz*ry,uy=fz*rx-fx*rz,uz=fx*ry-fy*rx;
    o[0]=rx;o[4]=ry;o[8]=rz;o[12]=-(rx*ex+ry*ey+rz*ez);
    o[1]=ux;o[5]=uy;o[9]=uz;o[13]=-(ux*ex+uy*ey+uz*ez);
    o[2]=fx;o[6]=fy;o[10]=fz;o[14]=-(fx*ex+fy*ey+fz*ez);
    o[3]=0;o[7]=0;o[11]=0;o[15]=1;return o;},
  translate(o,x,y,z){o[12]+=o[0]*x+o[4]*y+o[8]*z;o[13]+=o[1]*x+o[5]*y+o[9]*z;o[14]+=o[2]*x+o[6]*y+o[10]*z;o[15]+=o[3]*x+o[7]*y+o[11]*z;return o;},
  scale(o,x,y,z){for(let i=0;i<4;i++){o[i]*=x;o[4+i]*=y;o[8+i]*=z;}return o;},
  rotX(o,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const y=o[4+i],z=o[8+i];o[4+i]=y*c+z*s;o[8+i]=z*c-y*s;}return o;},
  rotY(o,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=o[i],z=o[8+i];o[i]=x*c-z*s;o[8+i]=x*s+z*c;}return o;},
  rotZ(o,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=o[i],y=o[4+i];o[i]=x*c+y*s;o[4+i]=y*c-x*s;}return o;},
  invert(o,m){const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];

    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!det)return M4.ident(o);det=1/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;return o;},
  normal3(o,m){ // inverse transpose of upper 3x3 -> o (Float32Array(9))
    const a=m[0],b=m[1],c=m[2],d=m[4],e=m[5],f=m[6],g=m[8],h=m[9],i=m[10];
    const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;let det=a*A+b*B+c*C;if(!det)det=1;const id=1/det;
    o[0]=A*id;o[1]=B*id;o[2]=C*id;o[3]=-(b*i-c*h)*id;o[4]=(a*i-c*g)*id;o[5]=-(a*h-b*g)*id;o[6]=(b*f-c*e)*id;o[7]=-(a*f-c*d)*id;o[8]=(a*e-b*d)*id;return o;}
};
function xform(m,x,y,z,out){const w=m[3]*x+m[7]*y+m[11]*z+m[15];out[0]=(m[0]*x+m[4]*y+m[8]*z+m[12])/w;out[1]=(m[1]*x+m[5]*y+m[9]*z+m[13])/w;out[2]=(m[2]*x+m[6]*y+m[10]*z+m[14])/w;out[3]=w;return out;}

/* ---------------- GL setup ---------------- */
const canvas=D.getElementById('c');
let gl=null;
function getGL(){
  const o={antialias:true,alpha:false,depth:true,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'};
  try{return canvas.getContext('webgl',o)||canvas.getContext('experimental-webgl',o);}catch(e){return null;}
}
gl=getGL();

const GLSL_COMMON=`
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);
 return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}return s;}
uniform vec3 uCam;uniform vec3 uKeyDir;uniform vec3 uKeyCol;uniform vec3 uOvenCol;uniform float uGlow;uniform float uWarm;uniform vec4 uOvenBox;uniform float uTime;uniform float uOvenOff;
vec3 envMap(vec3 r,float rough){
 float y=r.y;
 vec3 sky=mix(vec3(0.16,0.13,0.11),vec3(0.50,0.52,0.56),smoothstep(-0.35,0.75,y));
 sky=mix(sky,vec3(0.62,0.58,0.52),smoothstep(0.75,1.0,y)*0.5);
 float w=mix(0.992,0.78,rough);
 vec3 a=normalize(vec3(-0.42,0.80,0.42));
 float sa=smoothstep(w,w+(1.0-w)*0.55,dot(r,a));
 vec3 b=normalize(vec3(0.80,0.42,-0.30));
 float sb=smoothstep(w-0.004,w+(1.0-w)*0.45,dot(r,b));
 vec3 c=normalize(vec3(0.15,0.55,0.82));
 float sc=smoothstep(w+0.002,w+(1.0-w)*0.5,dot(r,c));
 float k=mix(1.0,0.28,rough);
 return sky+(vec3(4.2,3.95,3.6)*sa+vec3(1.5,1.75,2.1)*sb+vec3(1.4,1.2,1.0)*sc*0.6)*k;
}
vec3 tonemap(vec3 c){c*=0.78;c=(c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14);return pow(clamp(c,0.0,1.0),vec3(1.0/2.2));}
float ovenMask(vec3 w){
 float mx=smoothstep(uOvenBox.x-0.03,uOvenBox.x+0.05,w.x)*(1.0-smoothstep(uOvenBox.y-0.05,uOvenBox.y+0.03,w.x));
 float mz=smoothstep(uOvenBox.z-0.03,uOvenBox.z+0.05,w.z)*(1.0-smoothstep(uOvenBox.w-0.04,uOvenBox.w+0.03,w.z));
 float my=1.0-smoothstep(0.49,0.53,w.y);
 return mx*mz*my*(1.0-uOvenOff);
}
vec3 ambientAt(vec3 w,vec3 n){
 vec3 hemi=mix(vec3(0.20,0.165,0.14),vec3(0.50,0.52,0.56),n.y*0.5+0.5);
 float m=ovenMask(w);
 vec3 ov=uOvenCol*(0.18+0.26*(n.y*0.5+0.5));
 vec3 gdir=normalize(vec3(0.0,0.35,-1.0));
 float back=clamp((w.z-uOvenBox.z),0.0,1.2);
 vec3 glow=vec3(1.0,0.42,0.12)*uGlow*(0.30+0.7*max(dot(n,-gdir),0.0)+0.25*max(-n.y,0.0))/(1.0+back*2.2);
 return mix(hemi,ov+glow,m);
}
float keyAtt(vec3 w){return mix(1.0,0.92,ovenMask(w));}
vec3 shadeStd2(vec3 base,vec3 n,vec3 v,vec3 w,float rough,float metal,float coat,float ao,float wrap,float sh){
 vec3 l=uKeyDir;vec3 h=normalize(l+v);
 float ndlr=dot(n,l);float ndl=max((ndlr+wrap)/(1.0+wrap),0.0);float ndv=max(dot(n,v),0.001);float ndh=max(dot(n,h),0.0);float vdh=max(dot(v,h),0.0);
 vec3 f0=mix(vec3(0.04),base,metal);
 vec3 F=f0+(1.0-f0)*pow(1.0-vdh,5.0);
 float a=max(rough*rough,0.002);float a2=a*a;float d=ndh*ndh*(a2-1.0)+1.0;float Dg=a2/(3.14159*d*d);
 float k=(rough+1.0)*(rough+1.0)/8.0;float nl=max(ndlr,0.0);float G=(ndv/(ndv*(1.0-k)+k))*(nl/(nl*(1.0-k)+k));
 vec3 spec=Dg*G*F/(4.0*ndv*max(nl,0.001)+0.0001);
 vec3 kd=(1.0-F)*(1.0-metal);
 vec3 kc=uKeyCol*keyAtt(w)*sh;
 vec3 col=(kd*base/3.14159*ndl+spec*nl)*kc;
 col+=kd*base*ambientAt(w,n)*ao;
 vec3 r=reflect(-v,n);
 vec3 Fe=f0+(max(vec3(1.0-rough),f0)-f0)*pow(1.0-ndv,5.0);
 vec3 envc=envMap(r,rough);
 float om=ovenMask(w);
 envc=mix(envc,envc*0.22+uOvenCol*0.32+vec3(1.0,0.45,0.15)*uGlow*0.6,om);
 col+=envc*Fe*ao*0.62;
 if(coat>0.0){
  float fc=0.04+0.96*pow(1.0-ndv,5.0);
  vec3 ec=envMap(r,0.06);ec=mix(ec,ec*0.4+uOvenCol*0.5+vec3(1.0,0.45,0.15)*uGlow*0.7,om);
  col=col*(1.0-coat*fc)+coat*fc*ec*ao;
  float ac=0.012;float dc=ndh*ndh*(ac-1.0)+1.0;col+=coat*0.05*(ac/(3.14159*dc*dc))*nl*kc*0.25;
 }

}
vec3 shadeStd(vec3 base,vec3 n,vec3 v,vec3 w,float rough,float metal,float coat,float ao,float wrap){return shadeStd2(base,n,v,w,rough,metal,coat,ao,wrap,1.0);}
`;

const VS_STD=`
attribute vec3 aP;attribute vec3 aN;attribute vec2 aT;
uniform mat4 uVP;uniform mat4 uM;uniform mat3 uNM;
varying vec3 vW;varying vec3 vN;varying vec2 vT;varying vec3 vL;
void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vN=normalize(uNM*aN);vT=aT;vL=aP;gl_Position=uVP*w;}`;

const FS_STD=`precision highp float;
varying vec3 vW;varying vec3 vN;varying vec2 vT;varying vec3 vL;
uniform vec3 uCol;uniform float uRough;uniform float uMetal;uniform float uCoat;uniform float uKind;uniform float uAlpha;uniform vec3 uEmit;uniform float uAO;uniform vec4 uParam;
${GLSL_COMMON}
void main(){
 vec3 n=normalize(vN);
 vec3 v=normalize(uCam-vW);
 vec3 base=uCol;float rough=uRough;float metal=uMetal;float coat=uCoat;float ao=1.0;float wrap=0.0;vec3 emit=uEmit;
 float kind=uKind;
 if(kind>0.5&&kind<1.5){ /* wood table */
  vec2 q=vW.xz;
  float plank=floor((q.y+0.13)/0.42);
  float o=hash(vec2(plank,3.1))*7.0;
  float g=fbm(vec2(q.x*1.6+o,q.y*12.0+o));
  float rings=sin(q.y*58.0+g*9.0+o*3.0)*0.5+0.5;
  float fine=noise(vec2(q.x*40.0,q.y*260.0));
  base=mix(vec3(0.36,0.215,0.115),vec3(0.60,0.40,0.23),clamp(rings*0.45+g*0.55,0.0,1.0));
  base*=0.86+0.14*fine;base*=0.92+0.16*hash(vec2(plank,9.7));
  float gap=fract((q.y+0.13)/0.42);gap=smoothstep(0.0,0.012,gap)*smoothstep(1.0,0.988,gap);
  base*=mix(0.35,1.0,gap);rough=mix(0.62,0.42,fine);
  ao=gap;
 } else if(kind>1.5&&kind<2.5){ /* black enamel */
  float op=noise(vW.xz*140.0+vW.y*90.0);
  rough=uRough+op*0.05;
 } else if(kind>2.5&&kind<3.5){ /* copper brushed (dial / feet) */
  float ang=atan(vL.x,vL.z);float rr=length(vL.xz);
  float br=noise(vec2(rr*900.0,ang*2.0));
  base=uCol*(0.86+0.2*br);rough=uRough+0.12*br;
  float pat=smoothstep(0.55,0.9,noise(vL.xz*60.0+vL.y*30.0));base=mix(base,vec3(0.55,0.42,0.30),pat*0.12);
 } else if(kind>3.5&&kind<4.5){ /* ceramic plate */
  float rr=length(vL.xz)/max(uParam.x,0.001);
  float band=smoothstep(0.885,0.895,rr)*(1.0-smoothstep(0.915,0.925,rr));
  base=mix(uCol,vec3(0.55,0.36,0.20),band*0.85);
  float sp=noise(vL.xz*90.0);base*=0.97+0.03*sp;
 } else if(kind>4.5&&kind<5.5){ /* fur */
  float f1=noise(vec2(vL.x*90.0+vL.z*40.0,vL.y*260.0));
  float f2=noise(vL.xy*35.0+vL.z*20.0);
  base=uCol*(0.80+0.26*f1)*(0.92+0.12*f2);
  wrap=0.45;rough=0.82;
  float rim=pow(1.0-max(dot(n,v),0.0),3.0);emit+=uCol*rim*0.35*(0.6+0.4*f1);
 } else if(kind>5.5&&kind<6.5){ /* skin */
  wrap=0.55;rough=0.55;
  float rim=pow(1.0-max(dot(n,v),0.0),2.5);emit+=vec3(0.9,0.35,0.25)*rim*0.18;
 } else if(kind>6.5&&kind<7.5){ /* tray steel */
  float st=fbm(vW.xz*7.0);float fl=smoothstep(0.80,0.97,noise(vW.xz*150.0))*0.5;
  base=mix(uCol,uCol*0.55,smoothstep(0.45,0.8,st)*0.6);
  base=mix(base,vec3(0.86,0.83,0.78),fl*0.35);rough=uRough+st*0.15+fl*0.3;metal=uMetal*(1.0-fl*0.6);
 } else if(kind>7.5&&kind<8.5){ /* heating coil */
  float t=uParam.y;
  emit+=vec3(1.0,0.36,0.08)*uGlow*2.4*(0.75+0.25*sin(vL.x*40.0+uTime*2.0));
  base=mix(uCol,vec3(0.4,0.15,0.05),uGlow*0.5);
 } else if(kind>8.5&&kind<9.5){ /* interior enamel */
  float sp=noise(vW.xz*60.0+vW.y*40.0);rough=uRough+sp*0.1;
 } else if(kind>9.5&&kind<10.5){ /* cheese strand */
  base=mix(vec3(1.0,0.93,0.72),vec3(0.98,0.80,0.42),0.5+0.5*noise(vL.xy*30.0));wrap=0.5;
 }
 vec3 col=shadeStd(base,n,v,vW,rough,metal,coat,ao*uAO,wrap)+emit;
 gl_FragColor=vec4(tonemap(col),uAlpha);
}`;

/* dough heightfield */
const VS_DOUGH=`
attribute vec2 aXZ;attribute vec3 aY;attribute vec4 aA;attribute vec4 aB;attribute vec4 aC;attribute vec4 aD;
uniform mat4 uVP;
varying vec3 vW;varying vec3 vN;varying vec4 vA;varying vec4 vB;varying vec4 vC;varying vec4 vD;
void main(){vec3 p=vec3(aXZ.x,aY.x,aXZ.y);vD=aD;vW=p;float ny=sqrt(max(1.0-aY.y*aY.y-aY.z*aY.z,0.02));vN=vec3(aY.y,ny,aY.z);
vA=aA;vB=aB;vC=aC;gl_Position=uVP*vec4(p,1.0);}`;

const FS_DOUGH=`precision highp float;
varying vec3 vW;varying vec3 vN;varying vec4 vA;varying vec4 vB;varying vec4 vC;varying vec4 vD;
${GLSL_COMMON}
uniform float uPlate;
void main(){
 float vis=vB.x;if(vis<0.40)discard;
 float alpha=smoothstep(0.43,0.58,vis);
 vec2 p=vW.xz;
 float bake=vA.x,crisp=vA.y,toast=vA.z,ch=vA.w;
 float air=vB.y,glw=vB.z,ao=0.55+0.45*vB.w;
 float flap=vC.x,crack=vC.y,puff=vC.z,seam=vC.w;
 float e=0.004;
 float n0=noise(p*95.0);
 float nx=noise(p*95.0+vec2(e*95.0,0.0));float nz=noise(p*95.0+vec2(0.0,e*95.0));
 float bub=smoothstep(0.66,0.92,noise(p*58.0+3.1));
 float b0=noise(p*58.0+3.1);
 float bx=noise(p*58.0+3.1+vec2(e*58.0,0.0));float bz=noise(p*58.0+3.1+vec2(0.0,e*58.0));
 float chN=noise(p*16.0+2.7);float chM=smoothstep(0.10,0.42,ch+(chN-0.5)*0.22);
 float bumpS=mix(0.26,0.18,bake)*(1.0-chM*0.5);
 vec3 n=normalize(vN+vec3(-(nx-n0),0.0,-(nz-n0))*bumpS*1.6+vec3(-(bx-b0),0.0,-(bz-b0))*bumpS*1.2*(1.0-bake*0.4));
 vec3 v=normalize(uCam-vW);
 float nb2=noise(p*230.0);
 vec3 rawC=vec3(0.90,0.80,0.62)*(0.95+0.07*n0);
 float flour=smoothstep(0.55,0.9,noise(p*170.0+11.0))*(1.0-bake)*0.5;
 rawC=mix(rawC,vec3(1.0,0.99,0.96),flour);
 vec3 gold=vec3(0.84,0.54,0.23),brown=vec3(0.56,0.29,0.11),dark=vec3(0.27,0.13,0.05);

function compileShader(type,src){

}
function makeProgram(vs,fs,attrs){
  const p=gl.createProgram();
  gl.attachShader(p,compileShader(gl.VERTEX_SHADER,vs));gl.attachShader(p,compileShader(gl.FRAGMENT_SHADER,fs));
  attrs.forEach((a,i)=>gl.bindAttribLocation(p,i,a));

  if(!gl.getProgramParameter(p,gl.LINK_STATUS)&&!gl.isContextLost()){W.__shaderLog=(W.__shaderLog||'')+gl.getProgramInfoLog(p);}
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS)||0;
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);if(!inf)continue;u[inf.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,inf.name);}

/* ---------------- geometry builders ---------------- */
function Geo(){return {p:[],n:[],t:[],i:[]};}
function gGrid(g,nu,nv,fn){ // fn(u,v,out[8]) u,v in [0,1]
  const base=g.p.length/3;const o=new Array(8);
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){fn(i/nu,j/nv,o);g.p.push(o[0],o[1],o[2]);g.n.push(o[3],o[4],o[5]);g.t.push(o[6],o[7]);}

  return g;
}
function gSphere(g,rx,ry,rz,nu,nv,cx,cy,cz){

  return gGrid(g,nu||24,nv||16,(u,v,o)=>{const th=u*TAU,ph=v*PI;const sx=Math.sin(ph)*Math.sin(th),sy=Math.cos(ph),sz=Math.sin(ph)*Math.cos(th);

}
function gLathe(g,prof,nu){ // prof: [[r,y],...] from inside/bottom upwards, normals computed from tangent
  const n=prof.length;const base=g.p.length/3;

    for(let i=0;i<=nu;i++){const th=i/nu*TAU;const c=Math.cos(th),s=Math.sin(th);const r=prof[j][0];
      g.p.push(r*s,prof[j][1],r*c);g.n.push(nr*s,ny,nr*c);g.t.push(i/nu,j/(n-1));}}
  for(let j=0;j<n-1;j++)for(let i=0;i<nu;i++){const a=base+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;g.i.push(a,b,c,b,d,c);}

}
function gRBox(g,cx,cy,cz,hx,hy,hz,r,seg){ // rounded box

    const out=[];for(const v of a){if(!out.length||Math.abs(v-out[out.length-1])>1e-7)out.push(v);}return out;};
  const sx=samp(hx),sy=samp(hy),sz=samp(hz);

    for(let j=0;j<B.length;j++)for(let i=0;i<A.length;i++){const p=[0,0,0];p[axis]=sign*[hx,hy,hz][axis];p[ai]=A[i];p[bi]=B[j];
      const q=[clamp(p[0],-ih[0],ih[0]),clamp(p[1],-ih[1],ih[1]),clamp(p[2],-ih[2],ih[2])];
      let dx=p[0]-q[0],dy=p[1]-q[1],dz=p[2]-q[2];const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
      g.p.push(cx+q[0]+dx*r,cy+q[1]+dy*r,cz+q[2]+dz*r);g.n.push(dx,dy,dz);g.t.push(i/(A.length-1),j/(B.length-1));}

      if(sign>0)g.i.push(a,b,c,b,d,c);else g.i.push(a,c,b,b,c,d);}};
  face(0,1,sy,sz,1,2);face(0,-1,sy,sz,1,2);

}
function gTube(g,pts,rad,nseg){ // pts: [[x,y,z],...], rad: number or fn(t)

    for(let i=0;i<=nseg;i++){const th=i/nseg*TAU;const c=Math.cos(th),s=Math.sin(th);const nx=bx*c+cx2*s,ny=by*c+cy2*s,nz=bz*c+cz2*s;

}

function meshFromGeo(g){

function computeLayout(asp){
  const old={x:LAY.plate.x,z:LAY.plate.z,r:LAY.plate.r};
  if(asp<1.0){
    LAY.portrait=true;
    const tall=clamp((0.75-asp)/0.3,0,1); // 1 for very tall phones
    LAY.plate={x:0.13,z:1.08+0.04*tall,r:0.45};
    LAY.dog={x:-0.44,z:1.50+0.10*tall,yaw:0.45};
    LAY.elev=1.1+0.06*tall;
  }else{
    LAY.portrait=false;

    LAY.dog={x:0.98,z:0.98,yaw:-0.40};
    LAY.elev=0.9;
  }
  return {dx:LAY.plate.x-old.x,dz:LAY.plate.z-old.z,sr:LAY.plate.r/old.r};
}

/* support surface height under the dough */
function plateSurf(x,z){
  const P=LAY.plate;const r=Math.hypot(x-P.x,z-P.z)/P.r;
  return 0.021+0.026*sstep(0.74,1.0,r);
}
function supportY(x,z){
  const P=LAY.plate;const pr=Math.hypot(x-P.x,z-P.z);
  if(pr<P.r*0.995&&z>0.52)return plateSurf(x,z);
  if(z<0.43){
    const T=WL.tray;
    const dx=Math.max(T.x0-x,x-T.x1,0),dz=Math.max(T.z0-z,z-T.z1,0);
    const d=Math.max(dx,dz);
    return WL.trayY-0.068*sstep(0,0.075,d);
  }
  // corridor from oven lip to plate
  const near=P.z-P.r;
  const t=sstep(0.50,Math.max(0.56,near+0.07),z);
  const lip=WL.lipY;
  const ty=pr<P.r*1.25?plateSurf(x,Math.min(z,P.z)):0.006;
  return lerp(lip,ty,t);
}

/* ================= dough simulation ================= */
const S0=0.036;

const MAXP=1500,MAXT=2900,MAXE=4800;
const P={n:0,cnt:0,free:[],
  alive:new Uint8Array(MAXP),x:new Float32Array(MAXP),z:new Float32Array(MAXP),px:new Float32Array(MAXP),pz:new Float32Array(MAXP),
  fx:new Float32Array(MAXP),fz:new Float32Array(MAXP),ex:new Float32Array(MAXP),ez:new Float32Array(MAXP),
  gx:new Float32Array(MAXP),gz:new Float32Array(MAXP),w:new Float32Array(MAXP),
  vol:new Float32Array(MAXP),area:new Float32Array(MAXP),thick:new Float32Array(MAXP),hR:new Float32Array(MAXP),
  bake:new Float32Array(MAXP),bakeR:new Float32Array(MAXP),toast:new Float32Array(MAXP),
  lift:new Float32Array(MAXP),liftV:new Float32Array(MAXP),liftT:new Float32Array(MAXP),
  layer:new Uint8Array(MAXP),layerT:new Float32Array(MAXP),air:new Float32Array(MAXP),
  mu:new Float32Array(MAXP),mv:new Float32Array(MAXP),
  soft:new Uint8Array(MAXP),edited:new Uint8Array(MAXP),wasBaked:new Uint8Array(MAXP),
  welds:new Uint8Array(MAXP),bnd:new Uint8Array(MAXP),piece:new Int32Array(MAXP),
  glow:new Float32Array(MAXP),crack:new Float32Array(MAXP),seam:new Float32Array(MAXP),sag:new Float32Array(MAXP),
  dent:new Float32Array(MAXP),bend:new Float32Array(MAXP),bendX:new Float32Array(MAXP),bendZ:new Float32Array(MAXP),
  kind:new Uint8Array(MAXP), // band class at bake: 0 none 1 ear 2 wing
  inD:new Uint8Array(MAXP),eat:new Uint8Array(MAXP),spring:new Float32Array(MAXP),dg:new Float32Array(MAXP)
};
const TR={n:0,cnt:0,free:[],alive:new Uint8Array(MAXT),a:new Int32Array(MAXT),b:new Int32Array(MAXT),c:new Int32Array(MAXT),vol:new Float32Array(MAXT),ar:new Float32Array(MAXT)};
const ED={n:0,cnt:0,free:[],alive:new Uint8Array(MAXE),a:new Int32Array(MAXE),b:new Int32Array(MAXE),rest:new Float32Array(MAXE),
  type:new Uint8Array(MAXE),wk:new Uint8Array(MAXE),t0:new Int32Array(MAXE),t1:new Int32Array(MAXE),born:new Float32Array(MAXE)};
const EMAP=new Map();
const ekey=(a,b)=>a<b?a*MAXP+b:b*MAXP+a;
let topoDirty=true;

function resetDough(){
  P.n=0;P.cnt=0;P.free.length=0;P.alive.fill(0);
  TR.n=0;TR.cnt=0;TR.free.length=0;TR.alive.fill(0);
  ED.n=0;ED.cnt=0;ED.free.length=0;ED.alive.fill(0);EMAP.clear();topoDirty=true;
}
function addP(x,z,mu,mv){
  let i;if(P.free.length)i=P.free.pop();else{if(P.n>=MAXP)return -1;i=P.n++;}
  P.alive[i]=1;P.cnt++;P.x[i]=P.px[i]=P.fx[i]=P.ex[i]=x;P.z[i]=P.pz[i]=P.fz[i]=P.ez[i]=z;P.mu[i]=mu;P.mv[i]=mv;
  P.vol[i]=0;P.area[i]=0;P.thick[i]=T_IN;P.hR[i]=T_IN;P.bake[i]=1;P.bakeR[i]=0;P.toast[i]=0;P.lift[i]=0;P.liftV[i]=0;P.liftT[i]=0;
  P.layer[i]=0;P.layerT[i]=0;P.air[i]=0;P.soft[i]=0;P.edited[i]=0;P.wasBaked[i]=0;P.welds[i]=0;P.bnd[i]=0;P.piece[i]=0;
  P.glow[i]=0;P.crack[i]=0;P.seam[i]=0;P.sag[i]=0;P.dent[i]=0;P.w[i]=0;P.spring[i]=0;P.inD[i]=0;P.eat[i]=0;P.bend[i]=0;P.bendX[i]=0;P.bendZ[i]=0;P.kind[i]=0;
  return i;
}
function killP(i){if(!P.alive[i])return;P.alive[i]=0;P.cnt--;P.free.push(i);}
function addEdge(a,b,type,t){
  const k=ekey(a,b);let e=EMAP.get(k);
  if(e!==undefined){if(t>=0){if(ED.t0[e]<0)ED.t0[e]=t;else if(ED.t1[e]<0)ED.t1[e]=t;}return e;}
  if(ED.free.length)e=ED.free.pop();else{if(ED.n>=MAXE)return -1;e=ED.n++;}
  ED.alive[e]=1;ED.cnt++;ED.a[e]=a;ED.b[e]=b;ED.type[e]=type;ED.wk[e]=0;ED.t0[e]=t;ED.t1[e]=-1;ED.born[e]=TIME.t;
  ED.rest[e]=Math.hypot(P.x[a]-P.x[b],P.z[a]-P.z[b]);EMAP.set(k,e);topoDirty=true;return e;
}
function killEdge(e){if(!ED.alive[e])return;ED.alive[e]=0;ED.cnt--;ED.free.push(e);EMAP.delete(ekey(ED.a[e],ED.b[e]));
  if(ED.type[e]===1){P.welds[ED.a[e]]=Math.max(0,P.welds[ED.a[e]]-1);P.welds[ED.b[e]]=Math.max(0,P.welds[ED.b[e]]-1);}topoDirty=true;}
function addTri(a,b,c,vol){
  let t;if(TR.free.length)t=TR.free.pop();else{if(TR.n>=MAXT)return -1;t=TR.n++;}
  TR.alive[t]=1;TR.cnt++;TR.a[t]=a;TR.b[t]=b;TR.c[t]=c;TR.vol[t]=vol;
  addEdge(a,b,0,t);addEdge(b,c,0,t);addEdge(c,a,0,t);topoDirty=true;return t;
}
function detachTriFromEdge(a,b,t){const e=EMAP.get(ekey(a,b));if(e===undefined)return;
  if(ED.t0[e]===t){ED.t0[e]=ED.t1[e];ED.t1[e]=-1;}else if(ED.t1[e]===t)ED.t1[e]=-1;
  if(ED.t0[e]<0&&ED.type[e]===0)killEdge(e);}
function killTri(t){if(!TR.alive[t])return;TR.alive[t]=0;TR.cnt--;TR.free.push(t);const a=TR.a[t],b=TR.b[t],c=TR.c[t];
  detachTriFromEdge(a,b,t);detachTriFromEdge(b,c,t);detachTriFromEdge(c,a,t);topoDirty=true;}
function triArea(a,b,c){return Math.abs((P.x[b]-P.x[a])*(P.z[c]-P.z[a])-(P.x[c]-P.x[a])*(P.z[b]-P.z[a]))*0.5;}

/* split edge e at midpoint (keeps volume, interpolates attributes) */
function splitEdge(e){
  if(P.cnt>=MAXP-2||TR.cnt>=MAXT-3||ED.cnt>=MAXE-6)return false;
  const a=ED.a[e],b=ED.b[e];const rest=ED.rest[e];
  const ts=[ED.t0[e],ED.t1[e]].filter(t=>t>=0&&TR.alive[t]);
  const m=addP((P.x[a]+P.x[b])/2,(P.z[a]+P.z[b])/2,(P.mu[a]+P.mu[b])/2,(P.mv[a]+P.mv[b])/2);if(m<0)return false;
  P.px[m]=(P.px[a]+P.px[b])/2;P.pz[m]=(P.pz[a]+P.pz[b])/2;
  for(const k of ['bake','toast','lift','liftV','air','w','gx','gz','ex','ez','fx','fz','glow','sag','dg']){P[k][m]=(P[k][a]+P[k][b])/2;}
  P.bakeR[m]=Math.max(P.bakeR[a],P.bakeR[b]);P.soft[m]=P.soft[a]|P.soft[b];P.edited[m]=P.edited[a]|P.edited[b];P.layer[m]=(P.layer[a]&&P.layer[b])?1:0;
  P.wasBaked[m]=P.wasBaked[a]|P.wasBaked[b];P.piece[m]=P.piece[a];P.kind[m]=0;
  P.inD[m]=P.inD[a]|P.inD[b];if(P.inD[m]&&DRAG.active)DRAG.list.push(m);
  // remove old triangles
  const tris=ts.map(t=>{const v=[TR.a[t],TR.b[t],TR.c[t]];const c=v.find(q=>q!==a&&q!==b);
    // keep orientation
    const ia=v.indexOf(a),ib=v.indexOf(b);const fwd=((ia+1)%3)===ib;return {c,vol:TR.vol[t],fwd,t};});
  for(const q of tris)killTri(q.t);
  if(ED.alive[e])killEdge(e);
  const e1=addEdge(a,m,0,-1),e2=addEdge(m,b,0,-1);
  if(e1>=0)ED.rest[e1]=rest/2;if(e2>=0)ED.rest[e2]=rest/2;
  for(const q of tris){
    if(q.fwd){addTri(a,m,q.c,q.vol/2);addTri(m,b,q.c,q.vol/2);}else{addTri(m,a,q.c,q.vol/2);addTri(b,m,q.c,q.vol/2);}
  }
  if(!tris.length){/* free edge (shouldn't happen) */}
  return true;
}

/* ---- dough construction ---- */
// shapeFn(x,z) -> true if inside. Builds hex lattice.
function buildDough(shapeFn,bbox,opts){
  resetDough();
  opts=opts||{};
  const s=S0,h=s*Math.sqrt(3)/2;
  const nx=Math.ceil((bbox.x1-bbox.x0)/s)+2,nz=Math.ceil((bbox.z1-bbox.z0)/h)+2;
  const idx=new Int32Array(nx*nz).fill(-1);
  const jit=0.06*s;
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const x=bbox.x0+(i+(j&1)*0.5)*s,z=bbox.z0+j*h;
    if(!shapeFn(x,z))continue;
    const p=addP(x+(rnd()-0.5)*jit,z+(rnd()-0.5)*jit,x,z);idx[j*nx+i]=p;
  }
  const g=(i,j)=>(i>=0&&j>=0&&i<nx&&j<nz)?idx[j*nx+i]:-1;
  const tl=[];
  for(let j=0;j<nz-1;j++)for(let i=0;i<nx-1;i++){
    let A,B,C,D2;
    if((j&1)===0){A=g(i,j);B=g(i+1,j);C=g(i,j+1);if(A>=0&&B>=0&&C>=0)tl.push([A,B,C]);
      A=g(i+1,j);B=g(i+1,j+1);C=g(i,j+1);if(A>=0&&B>=0&&C>=0)tl.push([A,B,C]);}
    else{A=g(i,j);B=g(i+1,j);C=g(i+1,j+1);if(A>=0&&B>=0&&C>=0)tl.push([A,B,C]);
      A=g(i,j);B=g(i+1,j+1);C=g(i,j+1);if(A>=0&&B>=0&&C>=0)tl.push([A,B,C]);}
  }
  // drop particles not in any triangle
  const used=new Uint8Array(MAXP);for(const t of tl){used[t[0]]=used[t[1]]=used[t[2]]=1;}
  for(let i=0;i<P.n;i++)if(P.alive[i]&&!used[i])killP(i);
  // hop distance from boundary (count neighbors)
  const nb=new Uint8Array(MAXP);for(const t of tl){nb[t[0]]++;nb[t[1]]++;nb[t[2]]++;}
  const dist=new Float32Array(MAXP).fill(99);const q=[];
  for(let i=0;i<P.n;i++)if(P.alive[i]&&nb[i]<6){dist[i]=0;q.push(i);}
  const adj=new Map();const link=(a,b)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b);};
  for(const t of tl){link(t[0],t[1]);link(t[1],t[0]);link(t[1],t[2]);link(t[2],t[1]);link(t[2],t[0]);link(t[0],t[2]);}
  for(let k=0;k<q.length;k++){const a=q[k];for(const b of (adj.get(a)||[])){if(dist[b]>dist[a]+1){dist[b]=dist[a]+1;q.push(b);}}}
  const thickAt=(i)=>{const d=dist[i];let t=lerp(T_RIM,T_IN,sstep(1.1,2.6,d));t*=1+(rnd()-0.5)*0.06;if(opts.thickFn)t=opts.thickFn(i,t,d);return t;};
  const th=new Float32Array(MAXP);for(let i=0;i<P.n;i++)if(P.alive[i])th[i]=thickAt(i);
  for(const t of tl){const ar=triArea(t[0],t[1],t[2]);addTri(t[0],t[1],t[2],ar*(th[t[0]]+th[t[1]]+th[t[2]])/3);}
  for(let e=0;e<ED.n;e++)if(ED.alive[e])ED.rest[e]=Math.hypot(P.x[ED.a[e]]-P.x[ED.b[e]],P.z[ED.a[e]]-P.z[ED.b[e]]);
  computeDerived();computePieces();
}
function circleShape(cx,cz,r){return (x,z)=>Math.hypot(x-cx,z-cz)<=r;}

/* ---- derived quantities ---- */
const PUFF=1.15;
function computeDerived(){
  const n=P.n;P.area.fill(0,0,n);P.vol.fill(0,0,n);
  for(let t=0;t<TR.n;t++){if(!TR.alive[t])continue;const a=TR.a[t],b=TR.b[t],c=TR.c[t];
    let ar=triArea(a,b,c);TR.ar[t]=ar;ar=Math.max(ar,1e-6);const v=TR.vol[t];
    P.area[a]+=ar/3;P.area[b]+=ar/3;P.area[c]+=ar/3;P.vol[a]+=v/3;P.vol[b]+=v/3;P.vol[c]+=v/3;}
  P.bnd.fill(0,0,n);
  for(let e=0;e<ED.n;e++){if(!ED.alive[e]||ED.type[e])continue;if(ED.t1[e]<0){P.bnd[ED.a[e]]=1;P.bnd[ED.b[e]]=1;}}
  for(let i=0;i<n;i++){if(!P.alive[i])continue;
    const ar=Math.max(P.area[i],S0*S0*0.08);let th=P.vol[i]/ar;if(!(th>0))th=T_IN;th=Math.min(th,T_RIM*2.6);P.thick[i]=th;
    const pf=sstep(0.0185,0.034,th);P.hR[i]=th*(1+PUFF*P.bake[i]*pf)*(P.kind[i]===1?1+0.75*P.bake[i]:1);}
}
function puffOf(i){return sstep(0.0185,0.034,P.thick[i])*P.bake[i];}
function crispOf(i){return P.bake[i]*(1-sstep(0.010,0.020,P.thick[i]));}

/* ---- pieces (connected components) ---- */
let PIECES=[];
function computePieces(){
  const n=P.n;const lab=P.piece;for(let i=0;i<n;i++)lab[i]=-1;
  const adj=buildAdj();
  PIECES=[];
  for(let i=0;i<n;i++){if(!P.alive[i]||lab[i]>=0)continue;const id=PIECES.length;const list=[i];lab[i]=id;
    for(let k=0;k<list.length;k++){const a=list[k];const s=adj.start[a],e2=adj.start[a+1];for(let q=s;q<e2;q++){const b=adj.nb[q];if(lab[b]<0){lab[b]=id;list.push(b);}}}
    PIECES.push({id,list});}
  // remove tiny isolated particles with no triangles
  for(const pc of PIECES){if(pc.list.length<3){for(const i of pc.list){if(P.area[i]<1e-6){killP(i);}}}}
  PIECES=PIECES.filter(pc=>pc.list.some(i=>P.alive[i]));
  PIECES.forEach((pc,k)=>{pc.id=k;pc.list=pc.list.filter(i=>P.alive[i]);for(const i of pc.list)lab[i]=k;});
  topoDirty=false;ADJ=null;
}
let ADJ=null;
function buildAdj(){
  if(ADJ&&!topoDirty)return ADJ;
  const n=P.n;const deg=new Int32Array(n+1);
  for(let e=0;e<ED.n;e++){if(!ED.alive[e])continue;deg[ED.a[e]]++;deg[ED.b[e]]++;}
  const start=new Int32Array(n+1);for(let i=0;i<n;i++)start[i+1]=start[i]+deg[i];
  const fill=start.slice();const nb=new Int32Array(start[n]);const ne=new Int32Array(start[n]);
  for(let e=0;e<ED.n;e++){if(!ED.alive[e])continue;const a=ED.a[e],b=ED.b[e];nb[fill[a]]=b;ne[fill[a]++]=e;nb[fill[b]]=a;ne[fill[b]++]=e;}
  ADJ={start,nb,ne,n};return ADJ;
}
function pieceStats(pc){
  let sx=0,sz=0,ar=0,vol=0;for(const i of pc.list){sx+=P.x[i]*P.area[i];sz+=P.z[i]*P.area[i];ar+=P.area[i];vol+=P.vol[i];}
  ar=Math.max(ar,1e-9);pc.cx=sx/ar;pc.cz=sz/ar;pc.area=ar;pc.vol=vol;let rm=0;for(const i of pc.list)rm=Math.max(rm,Math.hypot(P.x[i]-pc.cx,P.z[i]-pc.cz));pc.rmax=rm;return pc;
}

/* ---- spatial hash ---- */
const HG={x0:-1.0,z0:-0.9,cs:S0,nx:0,nz:0,start:null,cnt:null,items:null};

  try{const st=storage();if(!st)return null;const s=st.getItem(STORE_KEY);if(!s)return null;
    let o=null;try{o=JSON.parse(s);}catch(e){o=null;}
    if(!o||typeof o!=='object'||o.v!==1||o.w!==MASK.w||o.h!==MASK.h){try{st.removeItem(STORE_KEY);}catch(e){}return null;}
    const m=decMask(o.d);if(!validMask(m)){try{st.removeItem(STORE_KEY);}catch(e){}return null;}
    G.round=clamp((o.n|0)+1,1,9999);return m;
  }catch(e){return null;}
}
function saveOutline(m){
  G.outline=m;
  try{const st=storage();if(!st){G.storeOK=false;return;}st.setItem(STORE_KEY,JSON.stringify({v:1,w:MASK.w,h:MASK.h,d:encMask(m),n:G.round}));G.storeOK=true;}
  catch(e){G.storeOK=false;}
}

/* ---- serving ---- */
function startServe(){
  G.phase='serve';G.serveT=0;
  const m=captureOutline();if(m)saveOutline(m);
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;if(P.bake[i]<1){P.bakeR[i]=Math.max(P.bakeR[i],2.2);}}
  emit('serveStart',{});
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.gx[i]=P.x[i];P.gz[i]=P.z[i];if(P.soft[i]&&P.inD[i]){P.gx[i]=lerp(P.x[i],P.ex[i],0.78);P.gz[i]=lerp(P.z[i],P.ez[i],0.78);}P.dg[i]=0;}
  G.serveMap=null;
  DRAG.active=false;
}
function serveMapCompute(){
  computeDerived();
  let sx=0,sz=0,ar=0;for(let i=0;i<P.n;i++){if(!P.alive[i])continue;sx+=P.x[i]*P.area[i];sz+=P.z[i]*P.area[i];ar+=P.area[i];}
  const cx=sx/Math.max(ar,1e-6),cz=sz/Math.max(ar,1e-6);const ds=[];for(let i=0;i<P.n;i++){if(P.alive[i])ds.push(Math.hypot(P.x[i]-cx,P.z[i]-cz));}
  ds.sort((a,b)=>a-b);const rm=ds.length?ds[Math.floor(ds.length*0.93)]:0.3;
  const pl=LAY.plate;const s=clamp((pl.r-0.06)/Math.max(rm,0.01),0.62,1);
  G.serveMap={cx,cz,s,tx:pl.x,tz:pl.z};
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.ex[i]=P.x[i];P.ez[i]=P.z[i];P.liftT[i]=0;}
  for(let k=0;k<CH.n;k++){CH.ox[k]=CH.x[k];CH.oz[k]=CH.z[k];}
  for(let e=0;e<ED.n;e++)if(ED.alive[e])ED.rest[e]=Math.hypot(P.x[ED.b[e]]-P.x[ED.a[e]],P.z[ED.b[e]]-P.z[ED.a[e]]);
}
function serveUpdate(dt){
  const t=(G.serveT+=dt);
  if(t<0.75){const u=sstep(0,0.5,t);for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.x[i]=lerp(P.x[i],P.gx[i],Math.min(1,dt*7));P.z[i]=lerp(P.z[i],P.gz[i],Math.min(1,dt*7));P.px[i]=P.x[i];P.pz[i]=P.z[i];}
    OVEN.door=sstep(0.2,0.8,t);OVEN.warm=sstep(0.3,1.7,t);OVEN.tray=sstep(0.55,1.25,t);return;}
  if(!G.serveMap)serveMapCompute();
  const M=G.serveMap;
  OVEN.door=sstep(0.2,0.8,t);
  OVEN.warm=sstep(0.3,1.7,t);
  OVEN.tray=sstep(0.55,1.25,t)*(1-sstep(2.0,2.6,t));
  const u=sstep(0.75,1.85,t);const fw=sstep(0.55,1.25,t)*0.18*(1-u);
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;
    const tx=M.tx+(P.ex[i]-M.cx)*M.s,tz=M.tz+(P.ez[i]-M.cz)*M.s;
    P.x[i]=lerp(P.ex[i],tx,u);P.z[i]=lerp(P.ez[i],tz,u)+fw;P.px[i]=P.x[i];P.pz[i]=P.z[i];
    P.lift[i]=Math.sin(PI*u)*0.11+(1-u)*0.0;P.liftV[i]=0;if(u>=0.999)clampPlate(i,false);}
  for(let k=0;k<CH.n;k++){const tx=M.tx+(CH.ox[k]-M.cx)*M.s,tz=M.tz+(CH.oz[k]-M.cz)*M.s;CH.x[k]=lerp(CH.ox[k],tx,u);CH.z[k]=lerp(CH.oz[k],tz,u)+fw;}
  if(t>=1.85&&!G.landed){G.landed=true;emit('land',{x:M.tx,z:M.tz});for(let i=0;i<P.n;i++){if(P.alive[i])clampPlate(i,false);}
    if(M.s<0.999){for(let q=0;q<TR.n;q++)if(TR.alive[q])TR.vol[q]*=M.s*M.s;}
    for(let e=0;e<ED.n;e++)if(ED.alive[e])ED.rest[e]=Math.hypot(P.x[ED.b[e]]-P.x[ED.a[e]],P.z[ED.b[e]]-P.z[ED.a[e]]);}
  if(t>=2.7){G.phase='plate';G.landed=false;G.emptyT=0;
    for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.lift[i]=0;P.bake[i]=1;P.soft[i]=0;P.bakeR[i]=0;P.layer[i]=P.layer[i];P.sag[i]=0;P.glow[i]=0;}
    computeDerived();computePieces();anchorCheese();emit('platePhase',{});}
}
/* ---- arrival ---- */
function startArrive(){
  G.phase='arrive';G.arriveT=0;G.round++;
  setupDough(G.outline,true);
  // remember final positions & compact
  let sx=0,sz=0,c=0;for(let i=0;i<P.n;i++){if(!P.alive[i])continue;sx+=P.x[i];sz+=P.z[i];c++;}
  G.arr={cx:sx/c,cz:sz/c,bake:new Float32Array(P.n)};
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.gx[i]=P.x[i];P.gz[i]=P.z[i];G.arr.bake[i]=P.bake[i];P.bake[i]=0;P.soft[i]=1;}
  for(let k=0;k<CH.n;k++){CH.ox[k]=CH.x[k];CH.oz[k]=CH.z[k];CH.a[k]*=1;}
  G.arrCheese=CH.n;CH.n=0;

}
function arriveUpdate(dt){
  const t=(G.arriveT+=dt);const A=G.arr;
  const pop=sstep(0,0.35,t);
  const spread=t<0.5?0.12*pop:lerp(0.12,1,1-Math.pow(1-sstep(0.5,1.3,t),2))+Math.sin(clamp((t-0.5)/0.8,0,1)*PI*2)*0.04*(1-sstep(1.1,1.5,t));
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;
    P.x[i]=A.cx+(P.gx[i]-A.cx)*spread;P.z[i]=A.cz+(P.gz[i]-A.cz)*spread;P.px[i]=P.x[i];P.pz[i]=P.z[i];
    P.lift[i]=t<0.5?(1-pop)*0.05:0;P.liftV[i]=0;}
  if(t>0.5&&!A.s1){A.s1=1;emit('arriveLand',{x:A.cx,z:A.cz});}
  OVEN.door=1-sstep(1.1,1.7,t);
  OVEN.warm=1-sstep(1.2,2.3,t);
  if(t>1.35&&!A.ch){A.ch=1;CH.n=G.arrCheese;emit('cheesePop',{x:A.cx,z:A.cz});}
  if(t>1.6&&!A.bk){A.bk=1;
    for(let i=0;i<P.n;i++){if(!P.alive[i])continue;if(A.bake[i]>0.5){P.bakeR[i]=0.9;}else{P.bake[i]=A.bake[i];P.bakeR[i]=0;}}
    BANDS.push({list:Array.from({length:P.n},(_,i)=>i).filter(i=>P.alive[i]&&A.bake[i]>0.5),t:TIME.t,cx:A.cx,cz:A.cz,moved:0,thick:0,done:false,arrival:true});}
  if(t>1.6){for(let i=0;i<P.n;i++){if(P.alive[i]&&A.bake[i]<=0.5){P.bake[i]=A.bake[i];P.soft[i]=P.bake[i]<0.5?1:0;}}}
  if(t>2.9){G.phase='oven';for(let i=0;i<P.n;i++){if(!P.alive[i])continue;P.edited[i]=0;P.kind[i]=0;if(P.bake[i]>=0.99)P.soft[i]=0;}
    for(let e=0;e<ED.n;e++)if(ED.alive[e])ED.rest[e]=Math.hypot(P.x[ED.b[e]]-P.x[ED.a[e]],P.z[ED.b[e]]-P.z[ED.a[e]]);
    G.inviteEval=0;G.demoArmed=true;G.lastInput=TIME.t;G.ovenTime=0;G.rdone={};G.rto={};G.roundBakes=0;emit('ovenPhase',{});}
}

/* ================= director: invitation & demo ================= */
function boundaryList(){const b=[];for(let i=0;i<P.n;i++)if(P.alive[i]&&P.bnd[i])b.push(i);return b;}
function centroidAll(){let sx=0,sz=0,c=0;for(let i=0;i<P.n;i++){if(!P.alive[i])continue;sx+=P.x[i];sz+=P.z[i];c++;}return c?[sx/c,sz/c]:[0,0];}
function cheeseCentroid(){let sx=0,sz=0,c=0;for(let k=0;k<CH.n;k++){if(!CH.alive[k])continue;sx+=CH.x[k]*CH.a[k];sz+=CH.z[k]*CH.a[k];c+=CH.a[k];}return c?[sx/c,sz/c]:null;}
function roomAt(x,z,dx,dz){ // free distance from point along dir within oven
  const I=WL.inner;let best=0.5;
  if(dx>0.01)best=Math.min(best,(I.x1-0.03-x)/dx);if(dx<-0.01)best=Math.min(best,(I.x0+0.03-x)/dx);
  if(dz<-0.01)best=Math.min(best,(I.z0+0.03-z)/dz);if(dz>0.01)best=Math.min(best,(0.40-z)/dz);
  return Math.max(0,best);
}
function chooseInvite(){
  if(G.phase==='plate')return choosePlateInvite();
  if(G.phase!=='oven')return null;
  const bl=boundaryList();if(!bl.length)return null;
  const [cx,cz]=centroidAll();
  const out=(i)=>{let dx=P.x[i]-cx,dz=P.z[i]-cz;const l=Math.hypot(dx,dz)||1;return [dx/l,dz/l];};
  const want=(k)=>G.rdone[k]!==1&&G.rdone[k]!=='skip';
  const serveNow=G.ovenTime>300||(!want('d1')&&!want('d2')&&!want('d3')&&!want('d4')&&!want('d5'));
  // 1. raw boundary (initial tongue)
  let raw=-1,rb=-1;for(const i of bl){if(P.bake[i]<0.5&&!P.edited[i]){const s=P.x[i];if(s>rb){rb=s;raw=i;}}}
  if(raw>=0&&G.roundBakes<1&&!serveNow){let d=out(raw);if(roomAt(P.x[raw],P.z[raw],d[0],d[1])<0.09){d=[d[0]*0.45,d[1]*0.45+0.9];const l=Math.hypot(d[0],d[1]);d=[d[0]/l,d[1]/l];}return {i:raw,dir:d,dist:0.075,kind:'tongue'};}
  const ears=bl.filter(i=>P.kind[i]===1),wings=bl.filter(i=>P.kind[i]===2);
  const fresh=bl.filter(i=>!P.edited[i]&&P.bake[i]>0.9);
  const pickFar=(cands,from,minD)=>{let best=-1,bs=-1;for(const i of cands){let md=1e9;for(const f of from){md=Math.min(md,Math.hypot(P.x[i]-P.x[f],P.z[i]-P.z[f]));}
      const o=out(i);const room=roomAt(P.x[i],P.z[i],o[0],o[1]);const s=Math.min(md,0.6)+room*0.6+(P.z[i]<0.15?0.05:0);if(md>=minD&&s>bs){bs=s;best=i;}}return best;};
  const pickNear=(cands,to,minD,maxD)=>{let best=-1,bd=1e9;for(const i of cands){const d=Math.hypot(P.x[i]-to[0],P.z[i]-to[1]);if(d>=minD&&d<=maxD&&d<bd){bd=d;best=i;}}return best;};
  const edited=bl.filter(i=>P.edited[i]);
  // 2. d1: ear & wing
  if(!serveNow&&want('d1')){
    if(!ears.length){const i=pickFar(fresh.length?fresh:bl,edited.length?edited:[],0.0);if(i>=0)return {i,dir:out(i),dist:0.07,kind:'ear'};}
    if(!wings.length){const e0=ears[0];const c=fresh.length?fresh:bl;const i=pickNear(c,[P.x[e0],P.z[e0]],0.14,0.4);const j=i>=0?i:pickFar(c,ears,0.1);
      if(j>=0){const o=out(j);const room=roomAt(P.x[j],P.z[j],o[0],o[1]);return {i:j,dir:o,dist:clamp(room*0.9,0.16,0.3),kind:'wing'};}}
  }
  // 3. d2: rewind an edited band
  if(!serveNow&&want('d2')&&edited.length){const i=edited[Math.floor(edited.length/2)];const o=out(i);return {i,dir:[o[0]*0.7-o[1]*0.7,o[1]*0.7+o[0]*0.7],dist:0.1,kind:'rewind'};}
  // 4. d3: next to a hard ear, sideways
  if(!serveNow&&want('d3')){const ear=hardEarNear(cx,cz,2);if(ear){
      const c=bl.filter(i=>!P.kind[i]||P.kind[i]===2);const i=pickNear(c,[ear.x,ear.z],0.10,0.22);
      if(i>=0){let tx=P.x[i]-ear.x,tz=P.z[i]-ear.z;const l=Math.hypot(tx,tz)||1;return {i,dir:[tx/l,tz/l],dist:0.15,kind:'pivot',ear};}}}
  // 5. d4: pocket
  if(!serveNow&&want('d4')){
    if(POCKET.inflated){// open seam
      let best=-1,bd=1e9;for(let e=0;e<ED.n;e++){if(!ED.alive[e]||ED.type[e]!==1||ED.wk[e]!==1)continue;const a=ED.a[e];const d=Math.hypot(P.x[a]-POCKET.cx,P.z[a]-POCKET.cz);if(d<bd){bd=d;best=P.layer[a]?a:ED.b[e];}}
      if(best>=0){let dx=P.x[best]-POCKET.cx,dz=P.z[best]-POCKET.cz;const l=Math.hypot(dx,dz)||1;return {i:best,dir:[dx/l,dz/l],dist:0.16,kind:'open'};}}
    else{const cc=cheeseCentroid();if(cc){const i=pickNear(bl,cc,0.04,0.5);if(i>=0){let dx=cc[0]-P.x[i],dz=cc[1]-P.z[i];const l=Math.hypot(dx,dz)||1;return {i,dir:[dx/l,dz/l],dist:Math.min(0.42,l+0.11),kind:'pocket'};}}}
  }
  // 6. d5: ring - two tips
  if(!serveNow&&want('d5')){
    const tips=[];for(const i of bl){if(!P.kind[i])continue;const o=out(i);const r=Math.hypot(P.x[i]-cx,P.z[i]-cz);tips.push([i,r]);}
    tips.sort((a,b)=>b[1]-a[1]);
    if(tips.length){const a=tips[0][0];let b=-1,bd=1e9;for(const i of bl){const d=Math.hypot(P.x[i]-P.x[a],P.z[i]-P.z[a]);if(d>0.16&&d<0.45&&d<bd){
          const o1=out(i);const o2=out(a);if(o1[0]*o2[0]+o1[1]*o2[1]>0.2){bd=d;b=i;}}}
      if(b>=0){let dx=P.x[a]-P.x[b],dz=P.z[a]-P.z[b];const l=Math.hypot(dx,dz)||1;const o=out(b);return {i:b,dir:[dx/l*0.8+o[0]*0.3,dz/l*0.8+o[1]*0.3],dist:l*0.95,kind:'ring'};}}
  }
  // 7. serve
  let fr=-1,fz=-1e9;for(const i of bl){if(P.z[i]>fz&&Math.abs(P.x[i])<0.5){fz=P.z[i];fr=i;}}
  if(fr>=0){const pl=LAY.plate;let dx=pl.x-P.x[fr],dz=pl.z-P.z[fr];const l=Math.hypot(dx,dz)||1;return {i:fr,dir:[dx/l,dz/l],dist:l*0.62,kind:'serve'};}
  return null;
}
function choosePlateInvite(){
  if(!PIECES.length)return null;
  let big=null;for(const pc of PIECES){pieceStats(pc);if(!big||pc.area>big.area)big=pc;}
  if(!big)return null;
  // farthest boundary point from centroid
  let best=-1,bd=-1;for(const i of big.list){if(!P.bnd[i])continue;const d=Math.hypot(P.x[i]-big.cx,P.z[i]-big.cz);if(d>bd){bd=d;best=i;}}
  if(best<0)return null;
  let dx=P.x[best]-big.cx,dz=P.z[best]-big.cz;const l=Math.hypot(dx,dz)||1;
  for(const pc of PIECES){if(pc===big||pc.area<0.07||pc.list.some(i=>P.eat[i]))continue;
    let c=pc.list[0],cd=1e9;for(const i of pc.list){const d=Math.hypot(P.x[i]-pc.cx,P.z[i]-pc.cz);if(d<cd){cd=d;c=i;}}
    const dx=LAY.dogZone.x-P.x[c],dz=LAY.dogZone.z-P.z[c];const l=Math.hypot(dx,dz)||1;return {i:c,dir:[dx/l,dz/l],dist:Math.min(0.5,l),kind:'share'};}
  return {i:best,dir:[dx/l,dz/l],dist:0.08,kind:'snap'};
}
function inviteUpdate(dt){
  G.inviteEval-=dt;
  if(G.inviteEval<=0&&!DRAG.active){G.inviteEval=1.2;const prev=G.invite;const nv=chooseInvite();
    if(nv&&prev&&prev.kind===nv.kind&&P.alive[prev.i]&&Math.hypot(P.x[prev.i]-P.x[nv.i],P.z[prev.i]-P.z[nv.i])<0.12){G.invite=prev;prev.dir=nv.dir;prev.dist=nv.dist;}else{G.invite=nv;G.invDecay=0.6;GF.forceFrames=45;if(nv)G.inviteT=0;}}
  const inv=G.invite;
  if(inv&&G.phase==='oven'){const key={ear:'d1',wing:'d1',rewind:'d2',pivot:'d3',pocket:'d4',open:'d4',ring:'d5'}[inv.kind];
    if(key&&TIME.t-G.lastInput<20){G.rto[key]=(G.rto[key]||0)+dt;if(G.rto[key]>55&&G.rdone[key]!==1){G.rdone[key]='skip';G.inviteEval=0;}}}
  for(let i=0;i<P.n;i++){P.sag[i]*=0.85;P.glow[i]*=0.85;}
  G.inviteAnim=G.invDecay>0;if(G.invDecay>0)G.invDecay-=dt;
  if(!inv||!P.alive[inv.i]||DRAG.active||(G.phase!=='oven'&&G.phase!=='plate'))return;
  G.inviteT+=dt;const ph=(G.inviteT%2.6)/0.95;const pulse=ph<1?Math.pow(Math.sin(ph*PI),2):0;G.inviteAnim=ph<1.45||G.inviteT<0.6;
  const ax=P.x[inv.i],az=P.z[inv.i];
  for(let i=0;i<P.n;i++){if(!P.alive[i])continue;const d=Math.hypot(P.x[i]-ax,P.z[i]-az);if(d>0.11)continue;const f=1-d/0.11;
    if(G.phase==='oven'){P.sag[i]=-0.013*pulse*f*f+0.004*f;}else P.sag[i]=0.006*pulse*f;
    P.glow[i]=Math.max(P.glow[i],(0.35+0.65*pulse)*f*0.8);}
}
const DEMO={active:false,t:0,inv:null,started:false,released:false,sx:0,sz:0};
function demoMaybe(){
  if(DEMO.active||DRAG.active||!G.demoArmed)return;
  if(G.phase!=='oven'&&G.phase!=='plate')return;
  if(TIME.t-G.lastInput<4.0||TIME.t-G.lastDemo<12)return;
  const inv=G.invite;if(!inv||!P.alive[inv.i])return;
  DEMO.active=true;DEMO.t=0;DEMO.inv={i:inv.i,dir:inv.dir.slice(),dist:inv.dist,kind:inv.kind,x:P.x[inv.i],z:P.z[inv.i]};DEMO.started=false;DEMO.released=false;
  G.demoArmed=false;G.lastDemo=TIME.t;HAND.on=true;HAND.a=0;
}
function demoUpdate(dt){
  if(!DEMO.active){HAND.a=Math.max(0,HAND.a-dt*4);if(HAND.a<=0)HAND.on=false;return;}

  if(G.phase==='plate'&&I.kind==='snap')dist=0.045;
  const p0x=I.x,p0z=I.z;
  const k=sstep(0.75,1.95,t);
  const gx=p0x+I.dir[0]*dist*k,gz=p0z+I.dir[1]*dist*k;
  let hx=gx,hz=gz;
  if(t<0.75){const u=sstep(0,0.75,t);hx=p0x-0.04*(1-u);hz=p0z+0.32*(1-u);HAND.a=u;}
  else if(t>2.1){const u=sstep(2.1,2.8,t);hx=gx-0.03*u;hz=gz+0.3*u;HAND.a=1-u;}
  else HAND.a=1;
  HAND.x=hx;HAND.z=hz;HAND.y=sampleGrid(GF.y,hx,hz)||supportY(hx,hz)+0.03;
  HAND.press=t>0.6&&t<2.05?sstep(0.6,0.75,t):0;
  HAND.yaw=clamp(Math.atan2(-I.dir[0],-I.dir[1])*0.35,-0.6,0.6);
  if(t>=0.75&&!DEMO.started){DEMO.started=true;
    const sc=worldToScreen(p0x,supportY(p0x,p0z)+0.03,p0z);

/* ================= dog behaviour ================= */
function dogUpdate(dt){
  const d=DOG;d.x=LAY.dog.x;d.z=LAY.dog.z;d.yaw=LAY.dog.yaw;
  d.breath+=dt*2.6;
  d.blinkT-=dt;if(d.blinkT<=0){d.blink=1;d.blinkT=2+rnd()*3.5;}d.blink=Math.max(0,d.blink-dt*7);
  d.happy=Math.max(0,d.happy-dt*0.25);d.wag=0.25+d.happy*1.2;d.wagP+=dt*(5+d.happy*12);
  d.perk=Math.max(0,d.perk-dt*0.8);
  // look target
  let L=null;
  if(d.eating){L=[d.eating.cx,0.05,d.eating.cz];}
  else if(DRAG.active){const a=DRAG.anchor;if(P.alive[a])L=[P.x[a],sampleGrid(GF.y,P.x[a],P.z[a])||0.2,P.z[a]];}
  else if(d.lookEvT>0&&d.lookEv){L=d.lookEv;d.lookEvT-=dt;}
  else if(G.invite&&P.alive[G.invite.i]){const i=G.invite.i;L=[P.x[i],(sampleGrid(GF.y,P.x[i],P.z[i])||0.2),P.z[i]];}
  else L=[0,0.25,-0.1];
  const hw=d.headW[1]?d.headW:[d.x,0.33,d.z];
  const hs=worldToScreen(hw[0],hw[1],hw[2]),ts=worldToScreen(L[0],L[1],L[2]);
  const sc=Math.max(1,Math.hypot(CAM.cssW,CAM.cssH))/900;
  const dxs=(ts[0]-hs[0])/sc,dys=(hs[1]-ts[1])/sc;
  // body faces mostly toward camera; turn head toward the on-screen direction (up on screen -> look up)
  const fwx=Math.sin(d.yaw); // body facing x (world) ~ screen-right component
  let yaw=clamp(Math.atan2(dxs,260)-0.0,-0.95,0.95)-d.yaw*0.55;yaw=clamp(yaw,-1.0,1.0);
  let pitch=-clamp(Math.atan2(dys,240),-0.35,0.85);
  if(d.eating){yaw*=0.6;pitch=0.25;}
  d.ty=yaw;d.tp=pitch;
  d.tiltT=Math.max(0,d.tiltT-dt);d.tr=d.tiltT>0?0.42*Math.sin(Math.min(1,d.tiltT)*PI*0.5+0.5):0;
  const k=1-Math.pow(0.002,dt);
  const py=d.hy,pp=d.hp;
  d.hy=lerp(d.hy,d.ty,k*0.9);d.hp=lerp(d.hp,d.tp,k*0.9);d.hr=lerp(d.hr,d.tr,k*0.7);
  d.lean=lerp(d.lean,d.leanT,1-Math.pow(0.004,dt));if(!d.eating)d.leanT=0;
  const hv=(d.hy-py)/Math.max(dt,1e-3);
  d.earVL+=(-hv*0.08-d.earL*40)*dt-d.earVL*dt*6;d.earL+=d.earVL*dt;d.earVR+=(hv*0.08-d.earR*40)*dt-d.earVR*dt*6;d.earR+=d.earVR*dt;
  d.earL=clamp(d.earL,-0.6,0.6);d.earR=clamp(d.earR,-0.6,0.6);
  d.sniff+=dt;d.bob=Math.sin(d.sniff*9)*0.002*(DRAG.active?1:0.3);
  if(!d.eating)d.jaw=lerp(d.jaw,d.happy>0.6?0.25:0,0.1);
}

  if(Math.abs(LIGHT.warm-lastWarm)>0.002||Math.abs(OVEN.tray-lastTray)>0.0005||Math.abs(OVEN.wob)>0.0004||Math.abs(OVEN.plateWob)>0.0004||lastWob){bgDirty=true;}
  lastWob=(Math.abs(OVEN.wob)>0.0004||Math.abs(OVEN.plateWob)>0.0004)?1:0;

function ringCheck(){
  RING.lastCheck=TIME.t;
  const h=detectHoles();
  let has=!!(h&&h.cnt>=(RING.has?4:7));
  if(!has&&RING.has&&TIME.t-(RING.seenT||0)<1.2)has=true;else if(has)RING.seenT=TIME.t;
  if(has&&!RING.has){RING.cx=h.x;RING.cz=h.z;RING.area=h.cnt;
    let joins=0;for(let e=0;e<ED.n;e++)if(ED.alive[e]&&ED.type[e]===1&&ED.wk[e]===2)joins++;
    if(joins){emit('ring',{x:h.x,z:h.z});achieve('d5a','ring hole '+h.cnt);RING.expand=0.7;RING.ex=h.x;RING.ez=h.z;}}
  RING.has=has;if(has&&h&&h.cnt){RING.cx=h.x;RING.cz=h.z;RING.cells=h.cells;}else if(!has)RING.cells=null;
}

/* ================= render ================= */
const BG={fbo:null,tex:null,rb:null,w:0,h:0,ok:false};
function makeFBO(){
  try{
    if(BG.fbo){gl.deleteFramebuffer(BG.fbo);gl.deleteTexture(BG.tex);gl.deleteRenderbuffer(BG.rb);}
    BG.w=canvas.width;BG.h=canvas.height;
    BG.tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,BG.tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,BG.w,BG.h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    BG.rb=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,BG.rb);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,BG.w,BG.h);
    BG.fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,BG.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,BG.tex,0);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,BG.rb);
    BG.ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }catch(e){BG.ok=false;}
  bgDirty=true;
}
const MO=M4.create(),MT=M4.create();
function ovenM(out){M4.ident(out);if(OVEN.wob){M4.translate(out,0,0,0.5);M4.rotX(out,OVEN.wob*0.02);M4.translate(out,0,0,-0.5);}return out;}
function drawBackground(){
  gl.clearColor(0.16,0.11,0.08,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);

function renderFrame(){
  const w=canvas.width,h=canvas.height;

    if(bgDirty){gl.bindFramebuffer(gl.FRAMEBUFFER,BG.fbo);gl.viewport(0,0,w,h);drawBackground();gl.bindFramebuffer(gl.FRAMEBUFFER,null);bgDirty=false;}
    gl.viewport(0,0,w,h);gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
    useProg(PR.blit);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,BG.tex);gl.uniform1i(PR.blit.u.uTex,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,MESH.fs);setAttribs(1);gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0);gl.drawArrays(gl.TRIANGLES,0,3);
    gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.clear(gl.DEPTH_BUFFER_BIT);
    // depth prime with background solids (cheap shader)
    setFrameUniforms(PR.depth);gl.colorMask(false,false,false,false);
    ovenM(MO);drawMesh(MESH.shell,MO,null);M4.ident(MT);M4.translate(MT,LAY.plate.x,0,LAY.plate.z);drawMesh(MESH.plate,MT,null);
    M4.copy(MT,MO);M4.translate(MT,0,0,OVEN.tray*0.42);drawMesh(MESH.tray,MT,null);
    gl.colorMask(true,true,true,true);
  }else{gl.viewport(0,0,w,h);drawBackground();}
  // coils
  setFrameUniforms(PR.std);
  drawMesh(MESH.coil,ovenM(MO),MAT.coil);
  // dough shadow
  if(GF.idxCount){
    setFrameUniforms(PR.dsh);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.disable(gl.DEPTH_TEST);
    setAttribs(3);bindField(2);
    const u=PR.dsh.u;
    const by=G.phase==='plate'?0.022:WL.trayY+0.001;
    gl.uniform1f(u.uBaseY,by);gl.uniform1f(u.uStr,0.30);
    // offset via VP trick: shift by light dir in world
    const VP2=M4.create();M4.copy(VP2,CAM.VP);M4.translate(VP2,0.018,0,0.012);gl.uniformMatrix4fv(u.uVP,false,VP2);
    gl.drawElements(gl.TRIANGLES,GF.idxCount,gl.UNSIGNED_SHORT,0);
    gl.uniform1f(u.uStr,0.16);M4.copy(VP2,CAM.VP);M4.translate(VP2,0.04,0,0.03);gl.uniformMatrix4fv(u.uVP,false,VP2);
    gl.drawElements(gl.TRIANGLES,GF.idxCount,gl.UNSIGNED_SHORT,0);

    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    gl.drawElements(gl.TRIANGLES,GF.idxCount,gl.UNSIGNED_SHORT,0);
    gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  }
  // cheese strands
  buildStrandMesh();
  if(STRM.count){setFrameUniforms(PR.std);const m={vbo:STRM.vbo,ibo:STRM.ibo,count:STRM.count};drawMesh(m,IDM,MAT.cheese);}
  // dog
  setFrameUniforms(PR.blob);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.disable(gl.DEPTH_TEST);
  drawBlob(DOG.x+0.02,DOG.z+0.0,0.17,0.2,0.45,0.6,false,0.002,DOG.yaw);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);
  setFrameUniforms(PR.std);

  // foreground oven parts
  ovenM(MO);
  drawMesh(MESH.frame,MO,MAT.enamel);
  // door
  M4.copy(MT,MO);M4.translate(MT,0,WL.doorBot,WL.doorZ);M4.rotX(MT,OVEN.door*1.42);
  drawMesh(MESH.doorFrame,MT,MAT.enamel);drawMesh(MESH.handle,MT,MAT.copper);

  // dials

  M4.copy(dm,MO);M4.translate(dm,0.36,0.088,WL.frontZ+0.001);drawMesh(MESH.dialPlate,dm,MAT.copperDk);M4.rotZ(dm,-DIAL.ang);drawMesh(MESH.dialBig,dm,MAT.copper);
  M4.copy(dm,MO);M4.translate(dm,0.525,0.088,WL.frontZ+0.001);M4.scale(dm,0.72,0.72,1);drawMesh(MESH.dialPlate,dm,MAT.copperDk);M4.copy(dm,MO);M4.translate(dm,0.525,0.088,WL.frontZ+0.001);M4.rotZ(dm,DIAL.ang*1.55+0.4);drawMesh(MESH.dialSmall,dm,MAT.copper);
  // plate glow ring (serve hint feedback)
  // fx
  if(FX.n){fxBuild();setFrameUniforms(PR.pt);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
    gl.uniform1f(PR.pt.u.uScale,canvas.height*0.9);gl.bindBuffer(gl.ARRAY_BUFFER,FX.vbo);setAttribs(3);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0);gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,12);gl.vertexAttribPointer(2,1,gl.FLOAT,false,32,28);
    gl.drawArrays(gl.POINTS,0,FX.n);gl.depthMask(true);gl.disable(gl.BLEND);}
  // glass
  setFrameUniforms(PR.glass);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  drawMesh(MESH.topGlass,MO,MAT.glass,{alpha:1});
  drawMesh(MESH.doorGlass,doorM,MAT.glass,{alpha:1});
  gl.depthMask(true);gl.disable(gl.BLEND);
  // plate glow (when dragging dough over the plate)
  if(OVEN.plateGlow>0.02){setFrameUniforms(PR.blob);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.disable(gl.DEPTH_TEST);
    drawBlobGlow(OVEN.plateGlow);gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);}
  // hand
  if(HAND.on&&HAND.a>0.01){gl.clear(gl.DEPTH_BUFFER_BIT);setFrameUniforms(PR.std);if(HAND.a<0.98){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);}drawHand();gl.disable(gl.BLEND);}
}
function drawBlobGlow(a){
  BLOBC[0]=1.0;BLOBC[1]=0.72;BLOBC[2]=0.38;
  drawBlob(LAY.plate.x,LAY.plate.z,LAY.plate.r*0.86,LAY.plate.r*0.86,0.30*a,0.7,false,0.03);
  BLOBC[0]=0;BLOBC[1]=0;BLOBC[2]=0;

/* ================= resize / loop ================= */
const PERF={upd:0,ren:0,fieldSkips:0,fld:0,sim:0,why:''};
let renderScale=1,frameAvg=16,frameCnt=0,lastTs=0,running=true,rafId=0;
const FIXED=/[?&]fixed/.test(location.search);
const DTMAX=/[?&]fast/.test(location.search)?0.1:0.05;
function resize(){
  readSafe();
  const cw=Math.max(1,W.innerWidth||D.documentElement.clientWidth||1),ch=Math.max(1,W.innerHeight||D.documentElement.clientHeight||1);
  const dpr=Math.min(W.devicePixelRatio||1,2)*renderScale;
  CAM.cssW=cw;CAM.cssH=ch;CAM.dpr=dpr;
  const nw=Math.max(1,Math.round(cw*dpr)),nh=Math.max(1,Math.round(ch*dpr));
  if(canvas.width!==nw||canvas.height!==nh){canvas.width=nw;canvas.height=nh;}
  const asp=cw/ch;const wasPortrait=LAY.portrait;const d=computeLayout(asp);
  if(Math.abs(d.dx)+Math.abs(d.dz)>1e-6||Math.abs(d.sr-1)>1e-6||wasPortrait!==LAY.portrait||!GF.sup){
    if(gl&&MESH.table)buildPlate();
    if(GF.sup)computeSupportGrid();
    if(G.phase==='plate'){const pl=LAY.plate;for(let i=0;i<P.n;i++){if(!P.alive[i])continue;
        const ox=P.x[i]-(pl.x-d.dx),oz=P.z[i]-(pl.z-d.dz);P.x[i]=pl.x+ox*d.sr;P.z[i]=pl.z+oz*d.sr;P.px[i]=P.x[i];P.pz[i]=P.z[i];P.ex[i]+=d.dx;P.ez[i]+=d.dz;}
      for(let k=0;k<CH.n;k++){CH.x[k]=pl.x+(CH.x[k]-(pl.x-d.dx))*d.sr;CH.z[k]=pl.z+(CH.z[k]-(pl.z-d.dz))*d.sr;}}
    else if(G.phase==='serve'&&G.serveMap){G.serveMap.tx=LAY.plate.x;G.serveMap.tz=LAY.plate.z;G.serveMap.s*=d.sr;}
  }
  const dg=LAY.dog;LAY.dogZone={x:dg.x+Math.sin(dg.yaw)*0.22,z:dg.z+Math.cos(dg.yaw)*0.22-0.02,r:0.17};
  DOG.x=dg.x;DOG.z=dg.z;DOG.yaw=dg.yaw;
  fitCamera();
  bgDirty=true;
}
let resizeT=0;
W.addEventListener('resize',()=>{resize();resizeT=3;});
W.addEventListener('orientationchange',()=>{setTimeout(resize,60);setTimeout(resize,350);});
D.addEventListener('visibilitychange',()=>{
  if(D.hidden){running=false;cancelAnimationFrame(rafId);if(DRAG.active)endDrag(true);if(DEMO.active)cancelDemo();PTR.id=-1;SND.stretchOff&&SND.stretchOff();SND.sizzle(0);SND.suspend();}
  else{if(!running){running=true;lastTs=0;rafId=requestAnimationFrame(frame);}try{SND.unlock();}catch(e){}}
});
W.addEventListener('pagehide',()=>{if(DRAG.active)endDrag(true);});
W.addEventListener('blur',()=>{if(DRAG.active&&!DRAG.demo){endDrag(true);PTR.id=-1;}});
W.__errs=[];
function frame(ts){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  let dt=lastTs?(ts-lastTs)/1000:0.016;lastTs=ts;if(!(dt>0))dt=0.016;
  const raw=dt;dt=Math.min(dt,DTMAX);
  TIME.t+=dt;TIME.dt=dt;
  try{
    if(resizeT>0){resizeT-=dt;}
    const u0=performance.now();update(dt);const u1=performance.now();
    if(gl&&!gl.isContextLost()){if(GF.didUpdate)uploadField();renderFrame();}
    PERF.upd=PERF.upd*0.95+(u1-u0)*0.05;PERF.ren=PERF.ren*0.95+(performance.now()-u1)*0.05;
  }catch(e){if(W.__errs.length<20)W.__errs.push(String(e&&e.stack||e));}
  // adaptive resolution
  frameAvg=frameAvg*0.95+raw*1000*0.05;frameCnt++;
  if(!FIXED&&frameCnt>90){
    if(frameAvg>26&&renderScale>0.56){renderScale=Math.max(0.55,renderScale-0.15);frameCnt=0;resize();}
    else if(frameAvg<13&&renderScale<1){renderScale=Math.min(1,renderScale+0.1);frameCnt=0;resize();}
  }
}
function initGLResources(){
  attribsOn=0;curProg=null;
  initPrograms();buildScene();initFieldGL();STRM.vbo=null;FX.vbo=null;makeFBO();
  gl.disable(gl.CULL_FACE);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
}
canvas.addEventListener('webglcontextlost',(e)=>{e.preventDefault();},false);
canvas.addEventListener('webglcontextrestored',()=>{try{initGLResources();bgDirty=true;}catch(e){}},false);

function boot(){
  initLSH();initFieldArrays();
  resize();
  if(gl){initGLResources();}
  const m=loadOutline();G.outline=m;
  setupDough(m,true);
  G.phase='oven';G.lastInput=0;
  for(let i=0;i<P.n;i++){if(P.alive[i]){P.fx[i]=P.x[i];P.fz[i]=P.z[i];}}
  if(!gl){ // no webgl: keep a calm background
    D.body.style.background='#3a2a1e';return;}
  rafId=requestAnimationFrame(frame);
}

/* ================= test hooks (no UI) ================= */
W.__pizza={
  get phase(){return G.phase;},
  disc(){return JSON.parse(JSON.stringify(DISC));},
  state(){let raw=0,baked=0,l1=0,welds=0,seams=0,joins=0;for(let i=0;i<P.n;i++){if(!P.alive[i])continue;if(P.bake[i]<0.5)raw++;else baked++;if(P.layer[i])l1++;}
    for(let e=0;e<ED.n;e++)if(ED.alive[e]&&ED.type[e]===1){welds++;if(ED.wk[e]===1)seams++;else joins++;}

    return {phase:G.phase,round:G.round,cnt:P.cnt,tris:TR.cnt,raw,baked,layer1:l1,welds,seams,joins,ears,wings,pieces:PIECES.length,
      pocket:{air:POCKET.air,sealed:POCKET.sealed,inflated:POCKET.inflated},ring:RING.has,strands:STR.length,cheese:CH.n,
      dogEating:!!DOG.eating,storeOK:G.storeOK,bakes:G.bakes,invite:G.invite?{kind:G.invite.kind}:null,demo:DEMO.active,

  screen(x,z,y){return worldToScreen(x,y==null?supportY(x,z)+0.03:y,z);},

  invite(){const v=G.invite;if(!v||!P.alive[v.i])return null;const s=worldToScreen(P.x[v.i],supportY(P.x[v.i],P.z[v.i])+0.03,P.z[v.i]);return {kind:v.kind,i:v.i,x:P.x[v.i],z:P.z[v.i],sx:s[0],sy:s[1],dir:v.dir,dist:v.dist};},

  dog(){const h=DOG.headW;const s=worldToScreen(h[0],h[1],h[2]);return {sx:s[0],sy:s[1],x:h[0],y:h[1],z:h[2],eating:!!DOG.eating};},
  pieces(){return PIECES.map(pc=>{pieceStats(pc);const s=worldToScreen(pc.cx,0.04,pc.cz);return {n:pc.list.length,area:pc.area,cx:pc.cx,cz:pc.cz,sx:s[0],sy:s[1]};});},

  fieldLine(z){const out=[];const j=Math.round((z-GF.z0)/GF.cs);for(let i=0;i<GF.nx;i+=3){const k=j*GF.nx+i;out.push([+(GF.x0+i*GF.cs).toFixed(3),+GF.y[k].toFixed(4),+GF.vis[k].toFixed(2),+(GF.dynB[k*16]/255).toFixed(2),+(GF.dynB[k*16+3]/170).toFixed(2),+(GF.dynB[k*16+12]/255).toFixed(2)]);}return out;},
  drag(){return {active:DRAG.active,mode:DRAG.mode,anchor:DRAG.anchor,n:DRAG.list.length,D:DRAG.D,G:DRAG.G,G0:DRAG.G0,demo:DRAG.demo,maxD:DRAG.maxD,over:DRAG.overPlate};},
  dbgP(i){return {alive:P.alive[i],bake:P.bake[i],bakeR:P.bakeR[i],soft:P.soft[i],inD:P.inD[i],thick:P.thick[i],w:P.w[i],x:P.x[i],z:P.z[i],edited:P.edited[i]};},
  cap(){const m=captureOutline();return m?m.reduce((a,b)=>a+b,0):0;},

  dbgReach(){computePieces();const out=[];for(const pc of PIECES){const d=geodesic(pc.list[0],pc);const un=pc.list.filter(p=>d[p]>1e8);
      const info=un.slice(0,5).map(p=>{let deg=0;for(let e=0;e<ED.n;e++)if(ED.alive[e]&&(ED.a[e]===p||ED.b[e]===p))deg++;return [p,deg,P.alive[p],P.piece[p]];});out.push({n:pc.list.length,un:un.length,info});}return out;},
  timeScale:1
};
boot();
