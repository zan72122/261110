// ===================================================================
// Model builders (fixed shapes; animated only through hinges/pivots)
// ===================================================================
function rrShape(w, d, r, cx = 0, cy = 0) {
  const s = new T.Shape(); const x0 = cx - w / 2, y0 = cy - d / 2;
  s.moveTo(x0 + r, y0); s.lineTo(x0 + w - r, y0); s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
  s.lineTo(x0 + w, y0 + d - r); s.quadraticCurveTo(x0 + w, y0 + d, x0 + w - r, y0 + d);
  s.lineTo(x0 + r, y0 + d); s.quadraticCurveTo(x0, y0 + d, x0, y0 + d - r);
  s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0); return s;
}
function rrPath(w, d, r, cx = 0, cy = 0) { const p = new T.Path(); p.curves = rrShape(w, d, r, cx, cy).curves; return p; }
function flatExtrude(shape, depth, bevel = 0, curveSegments = 6) {
  const g = new T.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments });
  g.rotateX(-Math.PI / 2); // extrude upward (+y); shape y -> -z

}
function mesh(geo, mat, cast = true, recv = true) { const m = new T.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
function merge(geos) { return T.mergeGeometries(geos.map(g => g.index ? g.toNonIndexed() : g), false); }

// ---------- container (hollow, molded) ----------
const BOX_H = 4.2;
function makeContainer(w, d, h = BOX_H) {
  const g = new T.Group();
  const ring = rrShape(w, d, 1.4); ring.holes.push(rrPath(w - 0.8, d - 0.8, 1.0));
  g.add(mesh(flatExtrude(ring, h, 0.12), MAT.plastic));
  g.add(mesh(flatExtrude(rrShape(w - 0.5, d - 0.5, 1.2), 0.35), MAT.plastic, false, true));
  // molded seat ledge where the inner lid lands
  const lip = rrShape(w + 0.3, d + 0.3, 1.55); lip.holes.push(rrPath(w - 0.05, d - 0.05, 1.38));
  const lg = flatExtrude(lip, 0.32); lg.translate(0, h - 1.0, 0);
  g.add(mesh(lg, MAT.plasticRim));
  // fine molding groove lines on the outer wall (subtle realism)

  for (const y of [0.9, 1.25]) { const gg = flatExtrude(ln, 0.05); gg.translate(0, y, 0); g.add(mesh(gg, MAT.plasticRim, false, false)); }
  return g;
}

// ---------- inner lid with inlaid wooden groove rails ----------

function makeLid(w, d, grooves = []) {

  top.renderOrder = 2; g.add(top);

  const skg = flatExtrude(sk, 0.75, 0, 8); skg.translate(0, -0.62, 0);
  const skm = mesh(skg, MAT.lidEdge, false, false); skm.renderOrder = 2; g.add(skm);

  const tab = mesh(new T.BoxGeometry(2.2, 0.3, 0.7), MAT.lidEdge, false, false); tab.position.set(0, -0.05, d / 2 + 0.55); tab.renderOrder = 2; g.add(tab);

// ---------- big lever with fork plate (分かれ道 + レバー) ----------

// ---------- open bento bag (袋) ----------
function makeBag(w, d, h) {
  const g = new T.Group();
  // soft body: lathe of a rounded rectangle profile, scaled
  const prof = [];
  for (let i = 0; i <= 14; i++) {
    const k = i / 14, y = k * h;
    const bulge = 1 + 0.06 * Math.sin(k * Math.PI) - 0.04 * k;
    prof.push(new T.Vector2(Math.max(0.01, (k < 0.08 ? k / 0.08 : 1) * bulge), y));
  }
  const body = new T.LatheGeometry(prof, 40);
  const pa = body.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), z = pa.getZ(i), y = pa.getY(i);
    const a = Math.atan2(z, x), r = Math.hypot(x, z);
    // squarish cross-section
    const sq = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), 0.25);
    const fold = 1 + 0.025 * Math.sin(a * 9 + y * 0.8) * (y / h);
    pa.setXYZ(i, Math.cos(a) * r * sq * w / 2 * fold, y, Math.sin(a) * r * sq * d / 2 * fold);
  }
  body.computeVertexNormals();
  const bm = mesh(body, MAT.bag); g.add(bm);
  // rolled cuff at the mouth
  const cuff = new T.TorusGeometry(1, 0.35, 10, 48); cuff.rotateX(Math.PI / 2);
  const cp = cuff.attributes.position;
  for (let i = 0; i < cp.count; i++) { const x = cp.getX(i), z = cp.getZ(i), y = cp.getY(i); const a = Math.atan2(z, x); const sq = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), 0.25); const r = Math.hypot(x, z); cp.setXYZ(i, Math.cos(a) * sq * (w / 2 * 0.96 + (r - 1) ), y + h, Math.sin(a) * sq * (d / 2 * 0.96 + (r - 1))); }
  cuff.computeVertexNormals();
  g.add(mesh(cuff, MAT.bag));
  // handles
  for (const s of [-1, 1]) {
    const c = new T.CatmullRomCurve3([new T.Vector3(-w * 0.22, h, s * d / 2 * 0.98), new T.Vector3(-w * 0.18, h + 3.5, s * d / 2 * 1.05), new T.Vector3(w * 0.18, h + 3.5, s * d / 2 * 1.05), new T.Vector3(w * 0.22, h, s * d / 2 * 0.98)]);
    g.add(mesh(new T.TubeGeometry(c, 24, 0.32, 8, false), MAT.bag));
  }
  return g;
}

// ---------- ball lift (玉のエレベーター) ----------
function makeLift(height) {

  for (const s of [-1, 1]) { const p = mesh(new T.BoxGeometry(0.5, height, 0.5), MAT.woodDark); p.position.set(s * 1.5, height / 2, 0); g.add(p); }

  const car = new T.Group(); g.add(car);

// Food (rice grains, rolled omelette, broccoli) — inside the containers only
// ===================================================================
// rice: textured mound (thousands of painted grains) + a sparse layer of real grains for relief and gloss
const RICE_TEX = (() => {
  const N = 512, R = rngf(31);
  const grains = [];
  for (let i = 0; i < 2600; i++) grains.push([R() * N, R() * N, R() * Math.PI, 5.5 + R() * 2.5, 2.6 + R() * 0.8, R()]);
  const col = canvasTex(N, N, g => {
    g.fillStyle = '#d9d6cc'; g.fillRect(0, 0, N, N);
    for (const [x, y, a, l, w, k] of grains) {
      g.save(); g.translate(x, y); g.rotate(a);
      const grd = g.createLinearGradient(0, -w, 0, w);
      const b = 236 + k * 18;
      grd.addColorStop(0, `rgb(${b - 26},${b - 26},${b - 32})`); grd.addColorStop(0.45, `rgb(${b},${b},${b - 4})`); grd.addColorStop(1, `rgb(${b - 34},${b - 34},${b - 40})`);
      g.fillStyle = grd; g.beginPath(); g.ellipse(0, 0, l, w, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(-l * 0.2, -w * 0.3, l * 0.45, w * 0.25, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  });
  const bump = canvasTex(N, N, g => {
    g.fillStyle = '#202020'; g.fillRect(0, 0, N, N);
    for (const [x, y, a, l, w] of grains) {
      g.save(); g.translate(x, y); g.rotate(a);
      const grd = g.createRadialGradient(0, 0, 0, 0, 0, l); grd.addColorStop(0, '#f0f0f0'); grd.addColorStop(1, '#303030');
      g.fillStyle = grd; g.beginPath(); g.ellipse(0, 0, l, w, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
  }, false);
  return { col, bump };
})();
function rice(w, d, h) {
  const g = new T.Group();
  const iw = w / 2 - 0.5, id = d / 2 - 0.5;
  const seg = 30, geo = new T.PlaneGeometry(iw * 2, id * 2, seg, seg); geo.rotateX(-Math.PI / 2);
  const pa = geo.attributes.position;
  const hgt = (x, z) => { const u = Math.abs(x / iw), v = Math.abs(z / id); const k = Math.pow(Math.pow(u, 5) + Math.pow(v, 5), 0.2); return 0.4 + h * Math.sqrt(Math.max(0, 1 - Math.pow(k, 6) * 0.9)) * (0.92 + 0.08 * Math.sin(x * 2.1) * Math.cos(z * 1.7)); };
  for (let i = 0; i < pa.count; i++) { const x = pa.getX(i), z = pa.getZ(i); pa.setY(i, hgt(x, z)); }
  geo.computeVertexNormals();
  const col = RICE_TEX.col.clone(), bump = RICE_TEX.bump.clone();
  for (const t of [col, bump]) { t.needsUpdate = true; t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(iw / 3.2, id / 3.2); }
  const base = new T.Mesh(geo, new T.MeshPhongMaterial({ map: col, bumpMap: bump, bumpScale: 1.4, specular: 0x6b6a66, shininess: 46 }));
  base.receiveShadow = true; g.add(base);
  const n = 200;
  const grain = new T.CapsuleGeometry(0.1, 0.26, 1, 6);
  const im = new T.InstancedMesh(grain, new T.MeshPhongMaterial({ color: 0xfdfcf8, specular: 0x9a9a94, shininess: 70 }), n);
  const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(0, 0, 0, 'YXZ'), p = new T.Vector3(), sc = new T.Vector3(1, 1, 1);
  for (let i = 0; i < n; i++) {
    const x = (RND() * 2 - 1) * iw * 0.96, z = (RND() * 2 - 1) * id * 0.96;
    p.set(x, hgt(x, z) + 0.03, z);
    e.set(Math.PI / 2 + (RND() - 0.5) * 0.5, RND() * 6.28, (RND() - 0.5) * 0.5); q.setFromEuler(e);
    const k = 0.85 + RND() * 0.3; sc.set(k, k, k);
    m4.compose(p, q, sc); im.setMatrixAt(i, m4);
  }
  im.receiveShadow = true; g.add(im);
  return g;
}
// tamagoyaki
function swirlTex() {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  const grd = g.createRadialGradient(N/2, N/2, 10, N/2, N/2, N*0.7); grd.addColorStop(0, '#ffe066'); grd.addColorStop(1, '#f7c531');
  g.fillStyle = grd; g.fillRect(0, 0, N, N);

    g.beginPath();
    for (let a = 0; a < Math.PI * 10; a += 0.04) { const r = 4 + a * 3.9 + k * 2; const x = N / 2 + Math.cos(a) * r * 1.12, y = N / 2 + Math.sin(a) * r * 0.78; a === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }

  g.fillStyle = '#f3bb38'; g.fillRect(0, 0, N, N);
  for (let i = 0; i < 60; i++) { const x = RND() * N, y = RND() * N, r = 4 + RND() * 14; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(190,110,30,${0.25 * RND()})`); gr.addColorStop(1, 'rgba(190,110,30,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }

function tamago(w, d) {

// broccoli

  return g;
}

// ===================================================================
// Input: one active pointer at a time. Lever = flick/tap. Others wiggle.
// ===================================================================
const Input = (() => {
  let active = null; // {id, x0, y0, t0, lever, dx, fired}
  let lastInputT = 0;
  const handlers = { leverHit: null, press: null, drag: null, release: null, cancel: null, other: null, any: null };
  const el = renderer.domElement;
  function pos(e) { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function down(e) {
    Sound.init();
    if (active) { e.preventDefault(); return; }               // ignore extra fingers
    const [x, y] = pos(e);
    lastInputT = Clock.t;
    handlers.any && handlers.any();
    const lever = handlers.leverHit ? handlers.leverHit(x, y) : null;
    if (lever) {
      active = { id: e.pointerId, x0: x, y0: y, t0: performance.now(), lever, dx: 0, fired: false };
      api.lastPress = { ev: e.timeStamp, handled: performance.now() };
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      handlers.press && handlers.press(lever, x, y);
    } else {
      handlers.other && handlers.other(x, y);
    }
    e.preventDefault();
  }
  function move(e) {
    if (!active || e.pointerId !== active.id) return;
    const [x, y] = pos(e);
    active.dx = x - active.x0;
    lastInputT = Clock.t;
    handlers.drag && handlers.drag(active.lever, active.dx, y - active.y0, active);
    e.preventDefault();
  }
  function up(e) {
    Sound.init();                                             // iOS unlocks audio on touchend/pointerup
    if (!active || e.pointerId !== active.id) return;
    const [x] = pos(e);
    active.dx = x - active.x0;
    const a = active; active = null;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    handlers.release && handlers.release(a.lever, a.dx, a);
    lastInputT = Clock.t;
    e.preventDefault();
  }
  function cancel(e) {
    if (!active || (e && e.pointerId !== undefined && e.pointerId !== active.id)) return;
    const a = active; active = null;
    handlers.cancel && handlers.cancel(a.lever, a);
  }
  el.addEventListener('pointerdown', down, { passive: false });
  el.addEventListener('pointermove', move, { passive: false });
  el.addEventListener('pointerup', up, { passive: false });
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('lostpointercapture', e => { if (active && e.pointerId === active.id) cancel(e); });
  window.addEventListener('blur', () => cancel());
  // suppress browser gestures / menus / zoom
  const stop = e => { e.preventDefault(); };
  document.addEventListener('contextmenu', stop, { passive: false });
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('gestureend', stop, { passive: false });
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('selectstart', stop, { passive: false });
  document.addEventListener('wheel', stop, { passive: false });
  document.addEventListener('touchend', () => Sound.init(), { passive: true });
  document.addEventListener('click', () => Sound.init(), { passive: true });
  const api = {
    lastPress: null,
    on(k, f) { handlers[k] = f; },
    get active() { return active; },
    idleFor() { return Clock.t - lastInputT; },
    touch() { lastInputT = Clock.t; },
    reset() { const a = active; active = null; if (a && handlers.cancel) handlers.cancel(a.lever, a); },
  };
  return api;
})();

// ===================================================================
// Hand demo (shown once after ~4 s idle, removed on any input)
// ===================================================================
const Hand = (() => {
  const el = document.getElementById('hand');
  let playing = false, t = 0, from = null, dir = 1, onPhase = null;
  function set(x, y, s, o, rot) {
    el.style.opacity = o.toFixed(3);
    el.style.transform = `translate3d(${(x - 30).toFixed(1)}px, ${(y - 14).toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg) scale(${s.toFixed(3)})`;
  }
  return {
    get playing() { return playing; },
    play(getPoint, direction, phaseCb) { playing = true; t = 0; from = getPoint; dir = direction; onPhase = phaseCb; },
    stop() { if (!playing) return; playing = false; el.style.opacity = 0; onPhase && onPhase('stop'); },
    update(dt) {
      if (!playing) return;
      t += dt;
      const p = from(); if (!p) { this.stop(); return; }
      const [px, py] = p;
      // timeline: 0-0.5 fade/move in, 0.5-0.75 press, 0.75-1.15 flick, 1.15-1.8 hold, fade out by 2.3
      let x = px, y = py + 6, s = 1, o = 1, rot = -12 * dir;
      if (t < 0.5) { const k = Ease.out(t / 0.5); y = py + 70 - 64 * k; o = k; }
      else if (t < 0.75) { const k = (t - 0.5) / 0.25; y = py + 6 - 3 * k; s = 1 - 0.08 * k; if (k > 0.6) onPhase && onPhase('press'); }
      else if (t < 1.15) { const k = Ease.out((t - 0.75) / 0.4); x = px + dir * 70 * k; y = py + 3; s = 0.92; rot = -12 * dir + 18 * dir * k; onPhase && onPhase('flick', k); }
      else if (t < 1.8) { x = px + dir * 70; y = py + 3 + 20 * ((t - 1.15) / 0.65); s = 0.92 + 0.08 * ((t - 1.15) / 0.65); rot = 6 * dir; onPhase && onPhase('hold'); }
      else if (t < 2.3) { const k = (t - 1.8) / 0.5; x = px + dir * 70; y = py + 23 + 20 * k; o = 1 - k; rot = 6 * dir; }
      else { this.stop(); return; }
      set(x, y, s, o, rot);
    },
  };
})();

// ---------- helpers ----------
function roundPoly(pts, r = 1.1, seg = 4) {
  // pts: array of [x,z]; returns rounded corner polyline [x,z]
  if (pts.length < 3) return pts.map(p => p.slice());
  const out = [pts[0].slice()];
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const a = [p0[0] - p1[0], p0[1] - p1[1]], b = [p2[0] - p1[0], p2[1] - p1[1]];
    const la = Math.hypot(a[0], a[1]), lb = Math.hypot(b[0], b[1]);
    const rr = Math.min(r, la * 0.45, lb * 0.45);
    const s = [p1[0] + a[0] / la * rr, p1[1] + a[1] / la * rr], e = [p1[0] + b[0] / lb * rr, p1[1] + b[1] / lb * rr];
    for (let k = 0; k <= seg; k++) {
      const t = k / seg, u = 1 - t;
      out.push([u * u * s[0] + 2 * u * t * p1[0] + t * t * e[0], u * u * s[1] + 2 * u * t * p1[1] + t * t * e[1]]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
function railMesh(track, opts = {}) {
  const g = new T.Group();
  const m = mesh(railGeometry(track, opts), opts.mat || MAT.wood, true, true);
  g.add(m);
  if (opts.posts !== false) {
    const pts = [];
    const n = Math.max(1, Math.round(track.length / (opts.postEvery || 7)));
    for (let i = 0; i <= n; i++) {
      if ((i === 0 && opts.noPostStart) || (i === n && opts.noPostEnd)) continue;
      const s = track.length * i / n;
      const p = track.at(s);
      if (opts.skipPost && opts.skipPost(p)) continue;
      pts.push(p);
    }
    const pg = postGeometry(pts, opts.h0 || 0);
    if (pg) g.add(mesh(pg, MAT.woodDark, true, true));
  }
  return g;
}
function addRail(name, pts, opts = {}) {
  const tr = new Track(name, pts, opts);
  const g = railMesh(tr, opts);
  (opts.parent || scene).add(g);
  world.rails[name] = { track: tr, group: g, mode: opts.mode || 'both', fold: !!opts.fold };
  return world.rails[name];
}

const Particles = (() => {
  const MAX = 48;
  const geo = new T.SphereGeometry(0.16, 8, 6);
  const im = new T.InstancedMesh(geo, MAT.water, MAX); im.count = MAX; im.frustumCulled = false; im.renderOrder = 5;
  const sparkMat = new T.MeshBasicMaterial({ color: 0xfff3c4, transparent: true, opacity: 0.9, depthWrite: false, blending: T.AdditiveBlending });
  const sp = new T.InstancedMesh(new T.SphereGeometry(0.22, 8, 6), sparkMat, MAX); sp.count = MAX; sp.frustumCulled = false; sp.renderOrder = 6;
  scene.add(im); scene.add(sp);
  const P = [];
  for (let i = 0; i < MAX * 2; i++) P.push({ alive: false, p: new T.Vector3(), v: new T.Vector3(), life: 0, max: 1, kind: 0 });
  const m4 = new T.Matrix4(), q = new T.Quaternion(), s = new T.Vector3();
  function spawn(pos, vel, life, kind = 0) {
    let n = 0; for (const p of P) if (p.alive && p.kind === kind) n++;
    if (n >= MAX) return;
    const p = P.find(p => !p.alive); if (!p) return;
    p.alive = true; p.p.copy(pos); p.v.copy(vel); p.life = life; p.max = life; p.kind = kind;
  }
  function update(dt) {
    let iw = 0, is = 0;
    for (const p of P) {
      if (!p.alive) continue;
      p.life -= dt; if (p.life <= 0) { p.alive = false; continue; }
      if (p.kind === 0) { p.v.y -= 60 * dt; } else { p.v.multiplyScalar(1 - 2.5 * dt); }
      p.p.addScaledVector(p.v, dt);
      if (p.p.y < 0.1) { p.p.y = 0.1; p.v.set(0, 0, 0); }
      const k = p.life / p.max;
      s.setScalar(p.kind === 0 ? 0.6 + 0.6 * k : 0.4 + 1.2 * k);
      m4.compose(p.p, q, s);
      if (p.kind === 0) im.setMatrixAt(iw++, m4); else sp.setMatrixAt(is++, m4);
    }
    im.count = iw; sp.count = is;
    im.visible = iw > 0; sp.visible = is > 0;
    if (iw) im.instanceMatrix.needsUpdate = true;
    if (is) sp.instanceMatrix.needsUpdate = true;
  }
  return { spawn, update, count: () => P.filter(p => p.alive).length };
})();
function sparkle(pos, n = 8, spread = 6) {

}

const LANE = { Lx: -9.85, Rx: 9.85, F: 18.0, B: -16.6 };

    const sx = p.x < 0 ? LANE.Lx : LANE.Rx;
    pts.push(V3(p.x, y, Math.min(p.z, LANE.B + 1.2)), V3(sx, y, LANE.B + 0.6));
    pts.push(V3(sx, y, -6), V3(sx, y, p.x < 0 ? 4.5 : 3.0));
  } else if (p.x <= -9 && p.z < 4.2) {
    pts.push(V3(LANE.Lx - 0.3, y, p.z), V3(LANE.Lx, y, 4.5));
  } else if (p.x >= 9 && p.z < 4.6) {
    pts.push(V3(Math.max(LANE.Rx, p.x), y, p.z), V3(LANE.Rx, y, 3.0));
  }
  const last = pts.length ? pts[pts.length - 1] : p;
  if (last.x < 0) {
    pts.push(V3(Math.min(last.x, -2.8) * 0.9, y, Math.max(last.z + 2, 8)));

  } else if (last.x > 12.5) {
    pts.push(V3(Math.max(last.x, 20.5), y, Math.max(last.z, 7.5)), V3(20.5, y, 13.3), V3(12.5, y, 14.4), scoop);
  } else if (G.mode === 'spread' || G.mode === 'gathering') {

    pts.push(V3(x, y, Math.min(Math.max(last.z, 2.8), 4.0)), V3(7.8, y, 5.6), V3(7.8, y, 12.6), scoop);
  } else {

// one ball arrives above a stub tip, drops, then rides the lid or falls into the cup.
async function arriveAtStub(ball, c, k, fromAbove = true) {

  }

// ----- spread routes -----
async function routeSpread(ball, d) {
  const A = world.containers.A, B = world.containers.B, C = world.containers.C;
  const sw = swing[d];
  await ball.roll([world.rails['fork' + d].track, sw.track], { v0: 18 });

    logEvent('crossLid', { id: 'A' });
    await rollPts(ball, grooveWorld(A).slice(1));
    await rollPts(ball, CONN_AB.slice(1));

    logEvent('crossLid', { id: 'B' });
    await rollPts(ball, grooveWorld(B).slice(1));
    await rollPts(ball, SR_FEED);
    await atDishSpread(ball, 'R');

    if (await arriveAtStub(ball, C, 1) === 'closed') return;
    logEvent('crossLid', { id: 'C' });
    await rollPts(ball, grooveWorld(C, true).slice(1));
    await rollPts(ball, CONN_CB.slice(1));
    if (await arriveAtStub(ball, B, 2, false) === 'closed') { logEvent('farReached', { id: 'B', via: 'C' }); return; }
    logEvent('crossLid', { id: 'B' });

    await rollPts(ball, SL_FEED);

}
async function atDishSpread(ball, side) {

    await rollPts(ball, [cupP], { vmin: 12 });
    restIn(ball, side); tiltTo(side); Sound.knock(0.8, 0.8);
    logEvent('weight', { side });
    await wait(0.5);
    return;
  }
  if (S.occ[side]) { // push: new ball stays, old ball leaves through the outlet and closes a lid
    const old = S.occ[side];
    await rollPts(ball, [cupP.clone().add(V3(side === 'L' ? -0.6 : 0.6, 0.3, 0.4))], { vmin: 14 });
    Sound.knock(1.25, 1);
    S.occ[side] = null; old.loc = 'moving';
    restIn(ball, side);
    logEvent('push', { side, old: old.id, ball: ball.id });
    sparkle(cupP, 5, 4);
    const tgt = side === 'R' ? world.containers.C : world.containers.A;
    const outPts = side === 'R' ? SR_OUT : SL_OUT;
    await old.roll(seg([old.pos.clone(), ...outPts, cupWorld(tgt, 2).add(V3(0, 0.35, 0))]), { v0: 30, vmin: 16 });
    if (tgt.open && !tgt.busy) {

      await closeLid(tgt, 2, old);
      await dropTo(old, cupDropOut(tgt, 2), true, 0.8);
      goHome(old);
    } else { await dropTo(old, cupDropOut(tgt, 2), true, 0.8); goHome(old); }
    return;
  }

  await retilt(ball, side);
}
async function retilt(ball, side) {
  const S = world.seesaw, other = side === 'L' ? 'R' : 'L';
  const cupP = seesawCupWorld(side);

  if (lifted) {

    tipDish(other, -1);
    const p = lifted.pos.clone();
    await lifted.roll(seg([p, p.clone().add(V3(0, 0.3, -1.4)), V3(p.x * 1.05, 2.0, p.z - 2.6), V3(p.x, Y_CLOTH, -16.4)]), { v0: 12, vmin: 14 });

// ----- gathered routes -----
const LAP = {
  L: () => { const A = world.containers.A, B = world.containers.B, C = world.containers.C; return [
    { c: A, k: 1, pts: grooveWorld(A) }, { c: B, k: 1, pts: grooveWorld(B) }, { c: C, k: 2, pts: grooveWorld(C) }]; },
  R: () => { const A = world.containers.A, B = world.containers.B, C = world.containers.C; return [
    { c: C, k: 1, pts: grooveWorld(C, true) }, { c: B, k: 2, pts: grooveWorld(B, true) }, { c: A, k: 2, pts: grooveWorld(A, true) }]; },
};
async function routeGathered(ball, d) {
  await ball.roll([world.rails['fork' + d].track, swing[d].track], { v0: 18 });
  const legs = LAP[d]();
  let first = true;
  for (const leg of legs) {

  await atDishGathered(ball, side);
}
async function atDishGathered(ball, side) {
  const S = world.seesaw, other = side === 'L' ? 'R' : 'L';
  if (S.occ[side]) return underLid(ball, side);           // 発見4
  if (S.occ[other]) return retilt(ball, side);            // 発見2 (傾け直し)
  if (side === 'L') return finishRoad(ball);              // 発見5
  const cupP = seesawCupWorld(side);
  await rollPts(ball, [cupP], { vmin: 12 });
  restIn(ball, side); tiltTo(side); Sound.knock(0.8, 0.8);

// the lowered dish diverts the ball down to the lower road under the adjacent lid
async function underLid(ball, side) {
  const S = world.seesaw;
  const c = side === 'L' ? world.containers.A : world.containers.B;
  const road = side === 'L' ? LOW_RICE : LOW_EGG;
  logEvent('underLid', { side, id: c.id });
  const resting = S.occ[side];
  // roll along the lower road until the clasp paddle
  const claspW = new T.Vector3(); c.clasp.updateWorldMatrix(true, false); claspW.setFromMatrixPosition(c.clasp.matrixWorld);
  const roadTr = seg([ball.pos.clone(), ...road]);
  // split road at the point nearest the clasp
  let best = 0, bd = 1e9;
  for (let i = 0; i < roadTr.pts.length; i++) { const dd = Math.hypot(roadTr.pts[i].x - claspW.x, roadTr.pts[i].z - claspW.z); if (dd < bd) { bd = dd; best = i; } }
  const sClasp = roadTr.cum[best];
  const firstPart = []; for (let i = 0; i <= best; i += 3) firstPart.push(roadTr.pts[i]); firstPart.push(roadTr.pts[best]);
  await ball.roll(seg([ball.pos.clone(), ...firstPart.slice(1)]), { vmin: 16 });
  Sound.knock(1.6, 0.6);
  // clasp releases -> lid springs open -> crank tips the dish
  const opening = openLid(c);
  await wait(0.22);
  let restingGo = null;
  if (resting) {
    S.occ[side] = null; resting.loc = 'moving';
    tipDish(side, 1);
    tiltTo(null);
    logEvent('drop', { side, ball: resting.id });
    const p = seesawCupWorld(side);
    Sound.plop();
    // the resting ball drops onto the start of the lower road and waits there until the road ahead is clear
    const landing = road[1].clone();
    restingGo = (async () => {
      await resting.roll(seg([p, p.clone().add(V3(side === 'L' ? -1.2 : 1.2, -0.4, 0.4)), road[0], landing]), { v0: 10, vmin: 14 });
      resting.v = 0;
    })();
  }
  // first ball continues along the rest of the road and home
  const rest = roadTr.pts.slice(best + 1).filter((_, i) => i % 3 === 0);
  rest.push(roadTr.pts[roadTr.pts.length - 1]);
  await opening;
  ball.roll(seg([ball.pos.clone(), ...rest]), { vmin: 16, vmax: 40 }).then(() => goHome(ball));
  if (restingGo) {
    await restingGo;
    await wait(0.9);
    const later = road.slice(2);
    resting.roll(seg([resting.pos.clone(), ...later]), { vmin: 16, vmax: 34 }).then(() => goHome(resting));
  }
  await wait(0.3);
}

    await foldRails(r => r.mode === 'spread', false, 0.55);
    Sound.slide(1.1);
    const A = world.containers.A, C = world.containers.C;

    const a1 = V3(CDEF.A.gather[0], 0, CDEF.A.gather[1]), c1 = V3(CDEF.C.gather[0], 0, CDEF.C.gather[1]);

  // outer lid back to its stand (rises from behind)
  world.outer.group.position.copy(OUTER_REST.pos).add(V3(0, -12, -6)); world.outer.group.rotation.copy(OUTER_REST.rot);
  tray.pivot.rotation.z = 0;
  // swing chutes aim at the spread stubs (after containers arrive)
  Sound.slide(1.4);
  const targets = { A: V3(CDEF.A.spread[0], 0, CDEF.A.spread[1]), B: V3(CDEF.B.spread[0], 0, CDEF.B.spread[1]), C: V3(CDEF.C.spread[0], 0, CDEF.C.spread[1]) };
  const starts = { A: entries.A.clone(), B: entries.B.clone(), C: entries.C.clone() };
  const o0 = world.outer.group.position.clone();
  const bag0 = bagG.position.clone(), bag1 = V3(-20.6, 0, -3.4);
  await tween(1.4, e => {
    for (const id of ['A', 'B', 'C']) cs[id].group.position.lerpVectors(starts[id], targets[id], e);
    world.outer.group.position.lerpVectors(o0, OUTER_REST.pos, e);
    bagG.position.lerpVectors(bag0, bag1, e);
  }, Ease.out);
  Sound.knock(0.7, 0.6);
  for (const s of ['L', 'R']) { swing[s].group.visible = true; }
  aimSwing('L', stubAbove(cs.A, 1)); aimSwing('R', stubAbove(cs.C, 1));
  await foldRails(r => r.mode === 'spread', true, 0.6);
  // seesaw level and empty
  world.seesaw.occ.L = null; world.seesaw.occ.R = null; tiltTo(null);
  // balls go from the collection tray back to the lift
  G.mode = 'spread';
  G.round++;
  logEvent('newRound', { round: G.round, dir: G.dir });
  for (const b of world.balls) if (b.loc === 'collected') { goHome(b, [V3(b.pos.x + 2, Y_CLOTH, 18.6)]); await wait(0.5); }
}

// ===================================================================
// Hints: bouncing lever when a ball waits; hand demo after ~4 s idle
// ===================================================================
const Hint = { demoShown: false, readySince: -1, glow: 0, flash: 0 };
function hintUpdate(dt) {
  // safety: a ball waiting in the second slot always rolls up to the gate
  if (G.queue.length && !G.queue[0].moving && G.queue[0].pos.distanceTo(Q0) > 0.2 && (G.mode === 'spread' || G.mode === 'gathered')) advanceQueue();
  const ready = canSend();
  const lv = world.lever;
  if (ready && !Input.active && !Hand.playing) {
    const ph = (Clock.t * 0.65) % 1;
    if (ph < 0.02 && lv.bounce.x < 0.05) lv.bounce.kick(6.5);
  }
  lv.bounce.target = 0;
  // idle demo: once per idle period, only after ~4 s of a ball waiting untouched
  if (ready && Hint.readySince < 0) Hint.readySince = Clock.t;
  if (!ready) Hint.readySince = -1;
  const idle = Math.min(Input.idleFor(), ready ? Clock.t - Hint.readySince : 0);
  if (ready && idle > 4.0 && !Hint.demoShown && !Hand.playing && !Input.active) {
    Hint.demoShown = true;
    // after several sends the same way, show the other way so both roads get discovered
    const last = G.sends.slice(-3);
    const d = last.length === 3 && last.every(x => x === last[0]) ? (last[0] === 'L' ? 'R' : 'L') : G.dir;
    Hand.play(() => {
      const p = knobWorld().project(camera);
      return [(p.x * 0.5 + 0.5) * window.innerWidth, (-p.y * 0.5 + 0.5) * window.innerHeight];
    }, d === 'L' ? -1 : 1, (ph, k) => {
      if (ph === 'press') lv.bend.target = 0.6;
      else if (ph === 'flick') { lv.bend.target = 0; lv.angle.target = (d === 'L' ? -1 : 1) * (LEVER_REST + 0.2 * (k || 0)); }
      else if (ph === 'hold' || ph === 'stop') { lv.angle.target = (G.dir === 'L' ? -1 : 1) * LEVER_REST; lv.bend.target = 0; }
    });
  }
}
Input.on('any', () => { if (Hand.playing) Hand.stop(); });

// ===================================================================
// Input wiring
// ===================================================================
const _kp = new T.Vector3();
function screenOf(v) { const p = v.clone().project(camera); return [(p.x * 0.5 + 0.5) * window.innerWidth, (-p.y * 0.5 + 0.5) * window.innerHeight]; }
function leverHitRadius() {
  const k = knobWorld(_kp);
  const a = screenOf(k), b = screenOf(k.clone().add(V3(2.3, 0, 0)));
  return Math.max(52, Math.hypot(a[0] - b[0], a[1] - b[1]) * 1.9);
}
Input.on('leverHit', (x, y) => {
  const k = knobWorld(_kp);
  const [kx, ky] = screenOf(k);
  if (Math.hypot(x - kx, y - ky) <= leverHitRadius()) return world.lever;
  // also the arm between the knob and the fork
  const [fx, fy] = screenOf(V3(FORK.x, Y_Q - 1.2, FORK.z + 1));
  const t = Math.max(0, Math.min(1, ((x - fx) * (kx - fx) + (y - fy) * (ky - fy)) / ((kx - fx) ** 2 + (ky - fy) ** 2 || 1)));
  const px = fx + (kx - fx) * t, py = fy + (ky - fy) * t;
  if (Math.hypot(x - px, y - py) < 34 && t > 0.25) return world.lever;
  return null;
});
Input.on('press', (lv) => {
  lv.bend.kick(-9); lv.bend.target = 0.35;
  lv.press.target = 1; lv.press.kick(14); Hint.flash = 1;
  Sound.click(1);
  world.lever.plateJig = 1;
  logEvent('leverPress');
});
const FLICK_PX = 24, TAP_PX = 6;
Input.on('drag', (lv, dx, dy, a) => {
  if (a.fired) return;
  const s = Math.max(-1, Math.min(1, dx / 60));
  lv.angle.target = s * (LEVER_REST + 0.25);
  if (Math.abs(dx) >= FLICK_PX) { a.fired = true; fire(dx < 0 ? 'L' : 'R'); }
});
Input.on('release', (lv, dx, a) => {
  lv.bend.target = 0; lv.press.target = 0;
  if (!a.fired) {
    const d = Math.abs(dx) >= TAP_PX ? (dx < 0 ? 'L' : 'R') : G.dir;
    fire(d);
  } else {
    lv.angle.target = (G.dir === 'L' ? -1 : 1) * LEVER_REST;
  }
});
Input.on('cancel', (lv) => { lv.bend.target = 0; lv.press.target = 0; lv.angle.target = (G.dir === 'L' ? -1 : 1) * LEVER_REST; });
function fire(d) {
  setDir(d, true);
  Sound.click(0.7);
  const ok = trySend(d);
  if (ok) Sound.knock(1.2, 0.5);
}
// taps elsewhere: related-but-not-target objects wiggle a little; empty space does nothing
const ray = new T.Raycaster();
const wiggleTargets = [];
function registerWiggle(obj, root) { obj.traverse(o => { if (o.isMesh) { o.userData.wiggleRoot = root || obj; wiggleTargets.push(o); } }); }
for (const id in world.containers) registerWiggle(world.containers[id].box, world.containers[id].group);
registerWiggle(world.seesaw.group); registerWiggle(world.bag.bag, world.bag.group); registerWiggle(world.outer.lid, world.outer.group); registerWiggle(world.lift.group);
const wiggles = new Map();
Input.on('other', (x, y) => {
  const w = window.innerWidth, h = window.innerHeight;
  ray.setFromCamera(new T.Vector2(x / w * 2 - 1, -(y / h) * 2 + 1), camera);
  const hit = ray.intersectObjects(wiggleTargets, false)[0];
  if (!hit) return;
  const root = hit.object.userData.wiggleRoot;
  if (G.mode === 'finishing') return;
  const prev = wiggles.get(root);
  wiggles.set(root, { t: 0, base: prev ? prev.base : root.rotation.y });
  Sound.tiny();
});
function wiggleUpdate(dt) {
  wiggles.forEach((w, root) => {
    w.t += dt;
    const k = Math.max(0, 1 - w.t / 0.45);
    root.rotation.y = w.base + Math.sin(w.t * 38) * 0.035 * k;
    if (w.t > 0.45) { root.rotation.y = w.base; wiggles.delete(root); }
  });
}

// ===================================================================
// Main loop
// ===================================================================
aimSwing('L', stubAbove(world.containers.A, 1));
aimSwing('R', stubAbove(world.containers.C, 1));
setRailMode('spread');
for (const id in world.containers) world.containers[id].clasp.userData.hingePivot.rotation.x = 1.25;

function updateMechanics(dt) {
  // seesaw beam
  const S = world.seesaw;
  S.tiltS.step(dt);
  S.beam.rotation.z = S.tiltS.x * SEE.amp;
  // balls resting in dishes follow them
  for (const side of ['L', 'R']) { const b = S.occ[side]; if (b && !b.moving) seesawCupWorld(side, b.pos); }
  // lever
  const lv = world.lever;
  lv.angle.step(dt); lv.bend.step(dt); lv.bounce.step(dt); lv.press.step(dt);
  lv.axle.rotation.y = lv.angle.x;
  lv.axle.rotation.x = lv.bend.x * 0.06;                 // flex under the finger
  const bo = Math.max(0, lv.bounce.x), pr = Math.max(0, lv.press.x);
  lv.knobG.position.y = 0.5 + bo * 3.4 - pr * 0.9;       // ready hop (~0.8 cm) / pressed down
  // Let a short flick visibly settle; keep the pressed response while held.
  const feedback = Math.max(pr, Hint.flash);
  const sq = 1 + feedback * 0.3 + Math.abs(lv.bend.x) * 0.03;
  lv.knobG.scale.set(sq, (1 / sq) * (1 + bo * 0.5), sq);
  Hint.flash = Math.max(0, Hint.flash - dt * 0.5);
  if (lv.plateJig) { lv.plateJig = Math.max(0, lv.plateJig - dt * 4); lv.plate.rotation.y = Math.sin(lv.plateJig * 30) * 0.1 * lv.plateJig; }
  // knob glow when a ball is ready
  const ready = canSend();
  Hint.glow += ((ready ? 1 : 0) - Hint.glow) * Math.min(1, dt * 4);
  MAT.knob.emissive.setRGB(0.35 * Hint.glow * (0.6 + 0.4 * Math.sin(Clock.t * 4)) + 0.5 * feedback, 0.12 * Hint.glow + 0.3 * feedback, 0.1 * feedback);
  updateCranks();
}

let rafId = 0, lastT = 0, running = false;
const TIME_SCALE = { v: 1 };
const RENDER_SKIP = { n: 1, i: 0 };   // test hook: skip rendering to speed up logic checks
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = lastT ? t - lastT : 1 / 60;
  lastT = t;
  if (dt > 0 && dt < 0.25) adaptResolution(dt * 1000);
  dt = Math.min(dt, 1 / 30) * TIME_SCALE.v;
  if (TIME_SCALE.v > 1) dt = Math.min(dt, 0.12);           // no time explosions after hiccups
  tickEngine(dt);
  for (const b of world.balls) b.update(dt);
  updateMechanics(dt);
  Particles.update(dt);
  hintUpdate(dt);
  Hand.update(dt);
  wiggleUpdate(dt);
  const r0 = performance.now();
  if (++RENDER_SKIP.i >= RENDER_SKIP.n) { RENDER_SKIP.i = 0; renderer.render(scene, camera); }
  perf.render = perf.render * 0.9 + (performance.now() - r0) * 0.1;
  perf.dt = perf.dt * 0.9 + dt * 0.1; perf.frames++;
}
const perf = { render: 0, dt: 1 / 60, frames: 0 };
function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); Sound.silenceRollers(); Sound.suspend(); Input.reset(); Hand.stop(); }
  else { Sound.resume(); Input.touch(); start(); }
});
window.addEventListener('pagehide', () => { stop(); Sound.suspend(); });
window.addEventListener('pageshow', () => { if (!document.hidden) start(); });
let resizeT = 0;
function onResize() { frameCamera(); }
window.addEventListener('resize', () => { clearTimeout(resizeT); onResize(); resizeT = setTimeout(onResize, 120); });
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); stop(); Sound.silenceRollers(); }, false);
renderer.domElement.addEventListener('webglcontextrestored', () => {
  // render-target contents are lost with the context: rebuild the reflection map
  try { ENV = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture; for (const m of ENV_MATS) { m.envMap = ENV; m.needsUpdate = true; } } catch (_) {}
  frameCamera(); start();
}, false);

frameCamera();
renderer.compile(scene, camera);
start();
requestAnimationFrame(() => { document.getElementById('boot').style.opacity = 0; });

// test hooks (no UI)
window.__game = {
  ready: true, G, world, Clock, Sound, TIME_SCALE, RENDER_SKIP, renderer, scene, camera, sun, stop, start,
  debug: () => ({ tweens: tweens.length, timers: timers.length, t: +Clock.t.toFixed(2), lift: world.lift.busy, returning: G.returning, frames: perf.frames }),
  send: d => fire(d), canSend,
  state() {
    const c = world.containers;
    return { mode: G.mode, busy: G.busy, dir: G.dir, queue: G.queue.map(b => b.id), round: G.round,
      lids: { A: c.A.open, B: c.B.open, C: c.C.open }, occ: { L: world.seesaw.occ.L && world.seesaw.occ.L.id, R: world.seesaw.occ.R && world.seesaw.occ.R.id },
      balls: world.balls.map(b => ({ id: b.id, loc: b.loc, moving: b.moving, p: b.pos.toArray().map(v => +v.toFixed(2)) })), particles: Particles.count() };
  },
  perf, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures }),
  knobScreen() { return screenOf(knobWorld()); },
  input: () => ({ active: !!Input.active, lastPress: Input.lastPress, idle: Input.idleFor() }),
  hand: () => ({ playing: Hand.playing, opacity: +document.getElementById('hand').style.opacity || 0 }),
  running: () => running,
  fitCheck() {
    const w = innerWidth, h = innerHeight, ins = safeInsets();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of FIT_PTS) { const [x, y] = screenOf(p); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const k = screenOf(knobWorld());
    return { w, h, ins, box: [x0, y0, x1, y1].map(v => Math.round(v)), inside: x0 >= ins.l - 1 && x1 <= w - ins.r + 1 && y0 >= ins.t - 1 && y1 <= h - ins.b + 1, knob: k.map(Math.round), knobR: Math.round(leverHitRadius()) };
  },
  leverRadius: leverHitRadius,
};

})();

</script>
</body>
</html>
